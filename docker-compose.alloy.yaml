# Alloy sandbox stack for HazardNet.
#
#   backend : Express API (backend/server.js) on 127.0.0.1:3001
#   frontend: Vite dev server (frontend/) on 0.0.0.0:3000 — proxies /api,
#             /metrics and /health to the backend (see frontend/vite.config.ts)
#
# Both services share the host network so the Alloy proxy on 8080 can reach
# the Vite dev server on 3000 directly. No published `ports` by design.
services:
  backend:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    env_file:
      - .env
    environment:
      IS_ALLOY: ${IS_ALLOY:-true}
      NODE_ENV: development
      PORT: 3001
      npm_config_fund: "false"
      npm_config_audit: "false"
    volumes:
      - .:/workspace
      - backend-node-modules:/workspace/node_modules
    command: >
      bash -lc "npm install --no-audit --no-fund --ignore-scripts && node backend/server.js"

  frontend:
    image: node:22-bookworm
    working_dir: /workspace/frontend
    network_mode: host
    env_file:
      - .env
    environment:
      IS_ALLOY: ${IS_ALLOY:-true}
      NODE_ENV: development
      npm_config_fund: "false"
      npm_config_audit: "false"
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/frontend/node_modules
    depends_on:
      - backend
    command: >
      bash -lc "npm install --no-audit --no-fund --ignore-scripts && npx vite --host 0.0.0.0 --port 3000"

volumes:
  backend-node-modules:
  frontend-node-modules:
