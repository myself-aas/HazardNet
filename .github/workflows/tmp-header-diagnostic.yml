name: TMP Header Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [arena/e0f19f23-hazardnet]
    paths: ['.github/workflows/tmp-header-diagnostic.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Collect live headers
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/diag
          {
            echo "### GET https://hazardnet.live/ (follow redirects, dump all hops)"
            curl -sS -L -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' \
              -D - -o /dev/null --max-redirs 5 --max-time 30 https://hazardnet.live/ 2>&1 | tr -d '\r'
            echo
            echo "### GET https://www.hazardnet.live/"
            curl -sS -L -D - -o /dev/null --max-redirs 5 --max-time 30 https://www.hazardnet.live/ 2>&1 | tr -d '\r'
            echo
            echo "### apk/other: /status"
            curl -sS -L -D - -o /dev/null --max-redirs 5 --max-time 30 https://hazardnet.live/status 2>&1 | tr -d '\r'
            echo
            echo "### body of / (first 1200 bytes)"
            curl -sS -L --max-redirs 5 --max-time 30 https://hazardnet.live/ 2>&1 | head -c 1200
            echo
            echo "### /data/freshness.json"
            curl -sS -L -D - --max-redirs 5 --max-time 30 https://hazardnet.live/data/freshness.json 2>&1 | head -c 1200 | tr -d '\r'
            echo
            echo "### /.well-known/security.txt"
            curl -sS -L -D - --max-redirs 5 --max-time 30 https://hazardnet.live/.well-known/security.txt 2>&1 | head -c 600 | tr -d '\r'
            echo
            echo "### DNS"
            (command -v dig >/dev/null && { dig +short hazardnet.live A; dig +short hazardnet.live CNAME; dig +short www.hazardnet.live; dig +short hazardnet.live TXT; }) || echo "no dig"
            (getent hosts hazardnet.live || true)
            getent hosts www.hazardnet.live || true
            echo
            echo "### DoH JSON"
            curl -sS --max-time 20 'https://cloudflare-dns.com/dns-query?name=hazardnet.live&type=CNAME' -H 'accept: application/dns-json' || true
            echo
            echo "### 5x GET / status+headers digest"
            for i in 1 2 3 4 5; do
              printf 'try %s: ' "$i"
              curl -sS -o /dev/null -D /tmp/h.txt -L --max-time 20 https://hazardnet.live/ || true
              head -1 /tmp/h.txt | tr -d '\r'
              grep -iE '^(server|x-vercel-id|x-fh-requested-host|x-served-by|via|x-cache|age):' /tmp/h.txt | tr -d '\r' | paste -sd' | ' - || true
              sleep 1
            done
            echo
            echo "### Firebase Hosting default domain (origin, no Cloudflare)"
            curl -sS -L -D - -o /dev/null --max-redirs 5 --max-time 30 https://hazardnet-aas48424.web.app/ 2>&1 | tr -d '\r' | head -40
            echo
            echo "### Firebase Hosting .firebaseapp.com"
            curl -sS -L -D - -o /dev/null --max-redirs 5 --max-time 30 https://hazardnet-aas48424.firebaseapp.com/ 2>&1 | tr -d '\r' | head -40
            echo
            echo "### origin freshness built_at (web.app)"
            curl -sS -L --max-redirs 5 --max-time 30 https://hazardnet-aas48424.web.app/data/freshness.json 2>&1 | head -c 400
          } > /tmp/diag/headers.txt
          rm -f diag-headers-*.txt
          cp /tmp/diag/headers.txt "diag-headers-${GITHUB_RUN_ID}.txt"
      - name: Publish dump to the branch
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "diag-bot"
          git config user.email "diag@example.com"
          git add diag-headers-*.txt
          git commit -m "diag: live header dump ${GITHUB_RUN_ID}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
