name: Site Health Probe

# External black-box probe for the production deployment (monitoring gap
# closure): every 30 minutes, verify the site renders and the forecast API
# serves data no older than 10 days. Failures are visible in Actions (and can
# be wired to Slack/email via the notify step's webhook inputs).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `write` for exactly one step: publishing the machine-readable probe result
  # (data/site-health/latest.json + the derived freshness artifact) that the
  # /status page renders. Everything else in this workflow only reads. If the
  # repository's workflow permissions are set to read-only, the publish step
  # degrades to a warning and the result is still uploaded as an artifact —
  # see docs/ops/owner-actions.md, Action 9.
  contents: write

env:
  SITE_URL: https://hazardnet.live
  MAX_DATA_AGE_DAYS: '10'
  # Optional override (repository variable) for the forecast API host. Default:
  # same host as the site. Only set this if the API is served somewhere else —
  # the Kaggle pipeline pushes to HAZARDNET_API_URL, which need not be the
  # website's own host.
  API_METADATA_URL: ${{ vars.API_METADATA_URL || '' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `-L` (follow redirects) is required, not cosmetic: the canonical
      # deployment is www.hazardnet.live and the apex answers 308. Without -L
      # curl reported that redirect *as* the probe result, so every scheduled
      # run had been red ("Homepage returned HTTP 308") while the site itself
      # was serving 200 — see
      # docs/audits/2026-09-15-ci-backend-tests-and-workflow-green.md.
      # %{url_effective} plus the same-site check keep the probe honest: a
      # redirect that leaves the production domain still fails the job.
      - name: Probe homepage
        id: homepage
        shell: bash
        run: |
          RESPONSE=$(curl -sSL --max-redirs 5 -o /tmp/home.html -w "%{http_code} %{url_effective}" --max-time 30 "$SITE_URL/")
          HTTP_CODE=${RESPONSE%% *}
          FINAL_URL=${RESPONSE#* }
          echo "homepage HTTP $HTTP_CODE (final URL: ${FINAL_URL:-unknown})"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Homepage returned HTTP $HTTP_CODE (final URL: ${FINAL_URL:-unknown})"
            exit 1
          fi
          case "$FINAL_URL" in
            "$SITE_URL"|"$SITE_URL"/*) ;;
            "https://www.hazardnet.live"|"https://www.hazardnet.live"/*) ;;
            *)
              echo "::error::Homepage redirected off the production domain: $FINAL_URL"
              exit 1
              ;;
          esac
          if ! grep -qiE 'hazardnet|__vite__|react' /tmp/home.html; then
            echo "::error::Homepage body does not look like the HazardNet app"
            head -c 500 /tmp/home.html
            exit 1
          fi
          echo "✅ Homepage serves the app shell"

      # Deep-link probe (2026-09-17 audit, P0). Every non-root route returned
      # Vercel's platform 404 in production — /login, /dashboard, /about,
      # /blogs, /documentation — because the project was built from frontend/
      # and the root vercel.json rewrites never applied. The build now emits a
      # real HTML file per route (frontend/scripts/prerender.mjs) and
      # frontend/vercel.json carries the rewrite, so this must stay green.
      - name: Probe deep links resolve with prerendered content
        id: deep_links
        shell: bash
        run: |
          set -uo pipefail
          FAILED=0
          check_route () {
            local path="$1" expect="$2" label="$3"
            local response code html
            response=$(curl -sSL --max-redirs 5 -w '\n%{http_code}' --max-time 30 "$SITE_URL$path" 2>/dev/null || true)
            code="${response##*$'\n'}"
            html="${response%$'\n'*}"
            if [ "$code" != "200" ]; then
              echo "::error::$label ($path) returned HTTP $code — deep links are broken. Check the Vercel Root Directory (docs/ops/owner-actions.md §2a-bis) and that the prerender step ran."
              FAILED=1
              return
            fi
            if ! grep -qi -- "$expect" <<< "$html"; then
              echo "::error::$label ($path) returned 200 but is missing expected content ($expect) — the SPA shell may have been served instead of the prerendered page."
              FAILED=1
              return
            fi
            echo "✅ $label ($path) 200 with expected content"
          }
          check_route '/' 'hazardnet' 'homepage'
          check_route '/login' 'sign in' 'sign-in page'
          check_route '/about' 'about hazardnet' 'about page'
          check_route '/blogs' 'blog' 'blog index'
          check_route '/methodology' 'methodology' 'methodology'
          check_route '/faq' 'frequently asked questions' 'FAQ'
          check_route '/robots.txt' 'sitemap:' 'robots.txt'
          check_route '/.well-known/security.txt' 'contact:' 'security.txt'
          exit "$FAILED"

      # Security-header probe (SEC-03/SEC-04). vercel.json (both copies) is the
      # only thing that sets these; if the wrong one applies to the deployment
      # they disappear silently, which is exactly what happened before.
      - name: Probe security headers
        id: security_headers
        shell: bash
        run: |
          set -uo pipefail
          HEADERS=$(curl -sSI -L --max-redirs 5 --max-time 30 "$SITE_URL/" | tr -d '\r')
          FAILED=0
          require () {
            local name="$1" needle="${2:-}"
            if ! grep -qi "^$name:" <<< "$HEADERS"; then
              echo "::error::missing header: $name"
              FAILED=1
              return
            fi
            if [ -n "$needle" ] && ! grep -qi "^$name:.*$needle" <<< "$HEADERS"; then
              echo "::error::$name does not contain '$needle'"
              FAILED=1
              return
            fi
            echo "✅ $name"
          }
          require 'strict-transport-security' 'includeSubDomains'
          require 'content-security-policy' "frame-ancestors 'none'"
          require 'x-content-type-options' 'nosniff'
          require 'referrer-policy'
          require 'permissions-policy'
          exit "$FAILED"

      # Sitemap honesty: a sitemap that lists URLs the deployment does not serve
      # is worse than no sitemap (SEO-01). Verified live on 2026-09-17: it listed
      # /documentation and /about, both of which 404'd.
      - name: Verify every sitemap URL resolves
        id: sitemap
        shell: bash
        run: |
          set -uo pipefail
          curl -sSL --max-redirs 5 --max-time 30 "$SITE_URL/sitemap.xml" -o /tmp/sitemap.xml
          if ! grep -q '<urlset' /tmp/sitemap.xml; then
            echo "::error::/sitemap.xml is not a sitemap"
            head -c 300 /tmp/sitemap.xml
            exit 1
          fi
          URLS=$(grep -o '<loc>[^<]*</loc>' /tmp/sitemap.xml | sed 's/<[^>]*>//g')
          COUNT=$(wc -w <<< "$URLS")
          echo "sitemap lists $COUNT URLs"
          FAILED=0
          for url in $URLS; do
            code=$(curl -sSL --max-redirs 5 -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error::$url → HTTP $code (listed in sitemap.xml but not served)"
              FAILED=1
            fi
          done
          [ "$FAILED" = "0" ] && echo "✅ every sitemap URL returns 200"
          exit "$FAILED"

      - name: Probe forecast data (API, falling back to the committed snapshot)
        id: forecast_data
        shell: bash
        run: |
          # Same -L rationale as the homepage probe above: the API rides the
          # same apex→www 308.
          #
          # Production currently ships the SPA plus the committed snapshot and
          # serves NO /api/* route at all (Vercel Root Directory — see
          # docs/ops/owner-actions.md §2a-bis). While PUSH_TO_API=false the
          # snapshot IS the documented delivery path (daily_forecast.yml
          # commits it), so a 404 on the API must not go red as long as the
          # snapshot the site actually serves is present and fresh. The probe
          # therefore checks the API first and falls back to the snapshot,
          # applying the same freshness gate to whichever source answered.
          API_URL="${API_METADATA_URL:-$SITE_URL/api/v1/forecasts/metadata}"
          SNAPSHOT_URL="$SITE_URL/data/forecasts-latest.json"

          check_freshness() {
            # $1 = prediction_date (YYYY-MM-DD), $2 = human-readable source
            if [ -z "$1" ]; then
              echo "::error::$2 has no prediction_date — the forecast data looks empty"
              return 1
            fi
            echo "prediction_date: $1 ($2)"
            AGE_DAYS=$(( ( $(date +%s) - $(date -d "$1" +%s) ) / 86400 ))
            echo "data age: ${AGE_DAYS} days (threshold: ${MAX_DATA_AGE_DAYS})"
            if [ "$AGE_DAYS" -gt "$MAX_DATA_AGE_DAYS" ]; then
              echo "::error::forecast data is ${AGE_DAYS} days old (>${MAX_DATA_AGE_DAYS}) — pipeline may be stalled"
              return 1
            fi
          }

          HTTP_CODE=$(curl -sSL --max-redirs 5 -o /tmp/metadata.json -w "%{http_code}" --max-time 30 "$API_URL")
          echo "metadata HTTP $HTTP_CODE ($API_URL)"
          if [ "$HTTP_CODE" = "200" ] && jq -e . /tmp/metadata.json >/dev/null 2>&1; then
            PREDICTION_DATE=$(jq -r '.prediction_date // empty' /tmp/metadata.json | head -c 10)
            check_freshness "$PREDICTION_DATE" "$API_URL" || exit 1
            echo "✅ Forecast API serves fresh data"
            exit 0
          fi

          if [ -n "$API_METADATA_URL" ]; then
            # The owner explicitly pointed the probe at a dedicated API host —
            # that host not answering with forecast JSON is a hard failure.
            echo "::error::$API_URL returned HTTP $HTTP_CODE (or non-JSON) — the API_METADATA_URL repository variable points at a host that does not serve forecast metadata."
            head -c 300 /tmp/metadata.json || true
            exit 1
          fi

          echo "::warning::$API_URL returned HTTP $HTTP_CODE — this deployment serves no /api/v1/forecasts/* route (Vercel Root Directory, docs/ops/owner-actions.md §2a-bis). Probing the committed snapshot instead: it is the active delivery path while PUSH_TO_API=false. Set the API_METADATA_URL repository variable if the API runs on another host."
          SNAP_CODE=$(curl -sSL --max-redirs 5 -o /tmp/metadata.json -w "%{http_code}" --max-time 30 "$SNAPSHOT_URL")
          echo "snapshot HTTP $SNAP_CODE ($SNAPSHOT_URL)"
          if [ "$SNAP_CODE" != "200" ] || ! jq -e . /tmp/metadata.json >/dev/null 2>&1; then
            echo "::error::Neither the forecast API (HTTP $HTTP_CODE) nor the committed snapshot (HTTP $SNAP_CODE) is being served — the site has no forecast data path at all."
            head -c 300 /tmp/metadata.json || true
            exit 1
          fi
          PREDICTION_DATE=$(jq -r '.prediction_date // empty' /tmp/metadata.json | head -c 10)
          check_freshness "$PREDICTION_DATE" "$SNAPSHOT_URL" || exit 1
          echo "✅ Committed snapshot serves fresh data"

      # Phase 7: the status page is part of the product surface now, and so is the
      # artifact it renders. Both are probed here — a page that says "within SLO"
      # while its artifact contradicts the data the site serves is exactly the
      # failure this check exists to make visible.
      - name: Probe the status page and its freshness artifact
        id: status_page
        shell: bash
        run: |
          set -uo pipefail
          FAILED=0

          CODE=$(curl -sSL --max-redirs 5 -o /tmp/status.html -w '%{http_code}' --max-time 30 "$SITE_URL/status" || echo 000)
          echo "/status HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::/status returned HTTP $CODE — the public status page is not being served."
            FAILED=1
          elif ! grep -qi 'system status' /tmp/status.html; then
            echo "::error::/status returned 200 without the status page content (SPA shell served instead?)."
            FAILED=1
          fi

          ACODE=$(curl -sSL --max-redirs 5 -o /tmp/freshness.json -w '%{http_code}' --max-time 30 "$SITE_URL/data/freshness.json" || echo 000)
          echo "/data/freshness.json HTTP $ACODE"
          if [ "$ACODE" != "200" ] || ! jq -e . /tmp/freshness.json >/dev/null 2>&1; then
            echo "::error::/data/freshness.json is not served (HTTP $ACODE) — the status page has no data to render."
            FAILED=1
          else
            SCHEMA=$(jq -r '.schema // "none"' /tmp/freshness.json)
            SOURCES=$(jq -r '(.sources | length) // 0' /tmp/freshness.json)
            echo "artifact schema: $SCHEMA, sources: $SOURCES"
            if [ "$SCHEMA" != "hazardnet-freshness/v1" ] || [ "$SOURCES" -lt 1 ]; then
              echo "::error::the served freshness artifact does not carry the expected contract."
              FAILED=1
            fi
            # The artifact must describe the data this deployment actually serves.
            if [ -f /tmp/metadata.json ] && jq -e . /tmp/metadata.json >/dev/null 2>&1; then
              SERVED=$(jq -r '.prediction_date // empty' /tmp/metadata.json | head -c 10)
              QUOTED=$(jq -r '.sources[] | select(.id == "forecast_snapshot") | .prediction_date // empty' /tmp/freshness.json | head -c 10)
              echo "served prediction_date: ${SERVED:-unknown} | artifact quotes: ${QUOTED:-unknown}"
              if [ -n "$SERVED" ] && [ -n "$QUOTED" ] && [ "$SERVED" != "$QUOTED" ]; then
                echo "::error::the freshness artifact quotes prediction_date $QUOTED but the site serves $SERVED — the status page would describe different data than the deployment ships."
                FAILED=1
              fi
            fi
          fi
          exit "$FAILED"

      # The result is published in two forms: a machine-readable record the status
      # page reads, and a run artifact. Neither invents a pass: the outcomes are
      # read back from the steps themselves.
      - name: Publish machine-readable probe result
        if: always()
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_HOMEPAGE: ${{ steps.homepage.outcome }}
          OUT_DEEP_LINKS: ${{ steps.deep_links.outcome }}
          OUT_SECURITY_HEADERS: ${{ steps.security_headers.outcome }}
          OUT_SITEMAP: ${{ steps.sitemap.outcome }}
          OUT_FORECAST_DATA: ${{ steps.forecast_data.outcome }}
          OUT_STATUS_PAGE: ${{ steps.status_page.outcome }}
        run: |
          set -uo pipefail
          mkdir -p data/site-health
          jq -n \
            --arg ran_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_url "$RUN_URL" \
            --arg site_url "$SITE_URL" \
            --arg homepage "$OUT_HOMEPAGE" \
            --arg deep_links "$OUT_DEEP_LINKS" \
            --arg security_headers "$OUT_SECURITY_HEADERS" \
            --arg sitemap "$OUT_SITEMAP" \
            --arg forecast_data "$OUT_FORECAST_DATA" \
            --arg status_page "$OUT_STATUS_PAGE" \
            '{
              schema: "hazardnet-site-probe/v1",
              ran_at: $ran_at,
              run_url: $run_url,
              site_url: $site_url,
              outcome: (if ([$homepage, $deep_links, $security_headers, $sitemap, $forecast_data, $status_page] | all(. == "success")) then "pass" else "fail" end),
              checks: [
                { id: "homepage", outcome: $homepage, detail: null },
                { id: "deep_links", outcome: $deep_links, detail: null },
                { id: "security_headers", outcome: $security_headers, detail: null },
                { id: "sitemap", outcome: $sitemap, detail: null },
                { id: "forecast_data", outcome: $forecast_data, detail: null },
                { id: "status_page", outcome: $status_page, detail: null }
              ]
            }' > data/site-health/latest.json
          # Rebuild the derived artifact so the published page quotes this run.
          node scripts/build_freshness_artifact.mjs || echo "::warning::could not rebuild the freshness artifact"
          {
            echo ""
            echo "- probe outcome: $(jq -r '.outcome' data/site-health/latest.json)"
            jq -r '.checks[] | "  - \(.id): \(.outcome)"' data/site-health/latest.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the probe result to the branch
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::notice::not the default branch (${GITHUB_REF_NAME}) — the probe result stays a run artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site-health/latest.json frontend/public/data/freshness.json
          if git diff --staged --quiet; then
            echo "Probe result unchanged since the last run — nothing to commit."
            exit 0
          fi
          OUTCOME=$(jq -r '.outcome' data/site-health/latest.json)
          git pull --rebase --autostash origin main || true
          git commit -m "chore(ops): site-health probe ${OUTCOME} $(date -u +%Y-%m-%dT%H:%MZ)"
          if ! git push; then
            echo "::warning::could not publish the probe result to the branch — this repository's workflow permissions are read-only (docs/ops/owner-actions.md, Action 9). The result is still in the run summary and the uploaded artifact."
          fi

      - name: Upload the probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-health-result
          path: |
            data/site-health/latest.json
            frontend/public/data/freshness.json
          retention-days: 30

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Site health probe — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- site: $SITE_URL"
            # Guard the jq: when the probed endpoint answered with an HTML
            # error page, /tmp/metadata.json is not JSON and an unguarded jq
            # here used to fail the Summarize step on top of the probe itself.
            if [ -f /tmp/metadata.json ] && jq -e . /tmp/metadata.json >/dev/null 2>&1; then
              jq -r '"- prediction_date: " + (.prediction_date // "none") + "\n- source: " + (.data_source // .source // "none")' /tmp/metadata.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
