name: Site Health Probe

# External black-box probe for the production deployment (monitoring gap
# closure): every 30 minutes, verify the site renders and the forecast API
# serves data no older than 10 days. Failures are visible in Actions (and can
# be wired to Slack/email via the notify step's webhook inputs).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: https://hazardnet.live
  MAX_DATA_AGE_DAYS: '10'
  # Optional override (repository variable) for the forecast API host. Default:
  # same host as the site. Only set this if the API is served somewhere else —
  # the Kaggle pipeline pushes to HAZARDNET_API_URL, which need not be the
  # website's own host.
  API_METADATA_URL: ${{ vars.API_METADATA_URL || '' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `-L` (follow redirects) is required, not cosmetic: the canonical
      # deployment is www.hazardnet.live and the apex answers 308. Without -L
      # curl reported that redirect *as* the probe result, so every scheduled
      # run had been red ("Homepage returned HTTP 308") while the site itself
      # was serving 200 — see
      # docs/audits/2026-09-15-ci-backend-tests-and-workflow-green.md.
      # %{url_effective} plus the same-site check keep the probe honest: a
      # redirect that leaves the production domain still fails the job.
      - name: Probe homepage
        shell: bash
        run: |
          RESPONSE=$(curl -sSL --max-redirs 5 -o /tmp/home.html -w "%{http_code} %{url_effective}" --max-time 30 "$SITE_URL/")
          HTTP_CODE=${RESPONSE%% *}
          FINAL_URL=${RESPONSE#* }
          echo "homepage HTTP $HTTP_CODE (final URL: ${FINAL_URL:-unknown})"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Homepage returned HTTP $HTTP_CODE (final URL: ${FINAL_URL:-unknown})"
            exit 1
          fi
          case "$FINAL_URL" in
            "$SITE_URL"|"$SITE_URL"/*) ;;
            "https://www.hazardnet.live"|"https://www.hazardnet.live"/*) ;;
            *)
              echo "::error::Homepage redirected off the production domain: $FINAL_URL"
              exit 1
              ;;
          esac
          if ! grep -qiE 'hazardnet|__vite__|react' /tmp/home.html; then
            echo "::error::Homepage body does not look like the HazardNet app"
            head -c 500 /tmp/home.html
            exit 1
          fi
          echo "✅ Homepage serves the app shell"

      - name: Probe forecast metadata API
        shell: bash
        run: |
          # Same -L rationale as the homepage probe above: the API rides the
          # same apex→www 308.
          API_URL="${API_METADATA_URL:-$SITE_URL/api/v1/forecasts/metadata}"
          HTTP_CODE=$(curl -sSL --max-redirs 5 -o /tmp/metadata.json -w "%{http_code}" --max-time 30 "$API_URL")
          echo "metadata HTTP $HTTP_CODE ($API_URL)"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::$API_URL returns 404 — this deployment serves no /api/v1/forecasts/* route at all."
            echo "::error::Check the Vercel project's Root Directory (Production serves only the static frontend today: /dashboard 404s too). If the API runs on a different host, set the API_METADATA_URL repository variable to its /api/v1/forecasts/metadata URL."
            cat /tmp/metadata.json | head -c 300
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::/api/v1/forecasts/metadata returned HTTP $HTTP_CODE"
            cat /tmp/metadata.json
            exit 1
          fi
          PREDICTION_DATE=$(jq -r '.prediction_date // empty' /tmp/metadata.json | head -c 10)
          echo "prediction_date: ${PREDICTION_DATE:-<none>}"
          if [ -z "$PREDICTION_DATE" ]; then
            echo "::error::metadata has no prediction_date — the forecast store looks empty"
            cat /tmp/metadata.json
            exit 1
          fi
          AGE_DAYS=$(( ( $(date +%s) - $(date -d "$PREDICTION_DATE" +%s) ) / 86400 ))
          echo "data age: ${AGE_DAYS} days (threshold: ${MAX_DATA_AGE_DAYS})"
          if [ "$AGE_DAYS" -gt "$MAX_DATA_AGE_DAYS" ]; then
            echo "::error::forecast data is ${AGE_DAYS} days old (>${MAX_DATA_AGE_DAYS}) — pipeline may be stalled"
            exit 1
          fi
          echo "✅ Forecast data is fresh"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Site health probe — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- site: $SITE_URL"
            if [ -f /tmp/metadata.json ]; then
              jq -r '"- prediction_date: " + (.prediction_date // "none") + "\n- source: " + (.data_source // "none")' /tmp/metadata.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
