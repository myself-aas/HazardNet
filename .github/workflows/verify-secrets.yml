name: Verify GitHub Actions Secrets

# Standalone dispatchable workflow that maps EVERY repository secret expected
# by HazardNet into a single step and runs scripts/verify-actions-secrets.sh.
#
# Run from:  Actions -> "Verify GitHub Actions Secrets" -> Run workflow
#
# This is a read-only diagnostic: it checks presence/shape only and never
# prints secret values. Exit code 0 = all secrets are correctly configured;
# non-zero = check the Actions log for which secret is missing or malformed.

on:
  workflow_dispatch:

concurrency:
  group: verify-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-all-secrets:
    name: Enumerate & verify all repository secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (needed for EE_SERVICE_ACCOUNT_JSON JSON check)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Step 1: quick static scan -- confirm every secret reference in every
      # workflow file maps to a name we explicitly verify below. Catches drift
      # when a NEW secret is added to a workflow but forgotten here.
      - name: Static secret-reference audit
        id: audit
        shell: bash
        # NOTE: do NOT write the GitHub Actions expression-opener sequence
        # ($ followed by two braces) anywhere in this file except in real secret
        # expressions. GitHub scans the ENTIRE file for expression delimiters
        # before any YAML parsing, so even putting the opener inside a bash
        # comment or a quoted YAML string causes an "unrecognized workflow"
        # parse failure on upload. The opener is therefore assembled at run time
        # inside bash.
        run: |
          set -euo pipefail
          # `$` + `{` + `{`, assembled so the literal three-character opener never
          # appears in this file. The first version of this step built only `$` +
          # `{` and fed the result to an ERE, so the scan matched no real secret
          # expression and the audit passed vacuously on a reference set of zero —
          # the exact drift it exists to catch. `grep -F` (fixed string) keeps the
          # braces from being read as an interval expression.
          RAW='$''{''{'
          echo "Secrets referenced across .github/workflows/*.y{a,}ml:"
          # Scan whole LINES that contain an expression opener, then pull every
          # secret name out of them. Anchoring on the opener keeps prose and
          # comments (which mention secret names without referencing one) out of
          # the reference set, while a fallback chain (`secrets.A || secrets.B`
          # inside one expression) — which a delimited `… secrets.NAME }}`
          # pattern silently skips — contributes both names.
          mapfile -t REFS < <(
            grep -rhF -- "$RAW" .github/workflows/ \
              | grep -oE 'secrets\.[A-Z_][A-Z0-9_]*' \
              | sed 's/^secrets\.//' \
              | sort -u
          )
          printf '  %s\n' "${REFS[@]:-}"

          # Expected set kept in sync with the env: map below. GITHUB_TOKEN is
          # always provided by the runner (no user config required) -- include
          # it here purely so the audit doesn't flag it as "unknown".
          #
          # The list is one name per line grouped by consumer. It MUST carry
          # every secret any workflow in this directory references; the loop
          # below fails the step on any reference that is missing here, which is
          # the point of the audit (it is how a newly wired secret gets noticed
          # instead of silently reading as empty at run time).
          EXPECTED=(BACKEND_API_KEY GEMINI_API_KEY
                    HAZARDNET_API_URL HAZARDNET_API_KEY EE_SERVICE_ACCOUNT_JSON
                    CODECOV_TOKEN GITHUB_TOKEN
                    FIREBASE_PROJECT_ID FIREBASE_CLIENT_EMAIL FIREBASE_PRIVATE_KEY
                    FIREBASE_SERVICE_ACCOUNT FIREBASE_SERVICE_ACCOUNT_JSON
                    SITE_PROBE_TOKEN
                    KAGGLE_USERNAME KAGGLE_KEY
                    VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID
                    # BENCH_URL is consumed by scripts/bench-predict.mjs but is
                    # NOT currently mapped in any production workflow -- it
                    # will show as SKIP unless you wire secrets.BENCH_URL into
                    # the relevant job's env: block.
                    BENCH_URL)

          echo ""
          echo "Cross-checking against expected set..."
          UNKNOWN=0
          for r in "${REFS[@]}"; do
            found=0
            for e in "${EXPECTED[@]}"; do
              [ "$r" = "$e" ] && { found=1; break; }
            done
            if [ "$found" -eq 0 ]; then
              echo "  !! workflow references secrets.${r} but it is NOT in the verification env: list -- add it!"
              UNKNOWN=$((UNKNOWN + 1))
            fi
          done
          if [ "$UNKNOWN" -gt 0 ]; then
            echo "::error::${UNKNOWN} secret reference(s) not covered by verification -- update this workflow."
            exit 1
          fi
          echo "  OK: All ${#REFS[@]} workflow secret references are accounted for."

      # Step 2: map EVERY secret the repo uses into this step's environment
      # (matching the exact env: blocks in the production workflows) and run
      # the verification script.
      - name: Verify every secret is injected
        shell: bash
        env:
          # Core backend
          BACKEND_API_KEY:         ${{ secrets.BACKEND_API_KEY }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          # Daily / data-source inference
          HAZARDNET_API_URL:       ${{ secrets.HAZARDNET_API_URL }}
          HAZARDNET_API_KEY:       ${{ secrets.HAZARDNET_API_KEY }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          # Firebase (Firestore forecast store + Auth)
          FIREBASE_PROJECT_ID:     ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL:   ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:    ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # CI / coverage
          CODECOV_TOKEN:           ${{ secrets.CODECOV_TOKEN }}
          # Benchmark (optional -- consumed by scripts/bench-predict.mjs)
          BENCH_URL:               ${{ secrets.BENCH_URL }}
          # Site-health probe authentication (docs/ops/owner-actions.md Action 18)
          SITE_PROBE_TOKEN:        ${{ secrets.SITE_PROBE_TOKEN }}
          # Daily advisory ingest (Kaggle CLI)
          KAGGLE_USERNAME:         ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:              ${{ secrets.KAGGLE_KEY }}
          # Ingest-triggered Vercel deploy (optional -- skipped when unset)
          VERCEL_TOKEN:            ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:           ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID:       ${{ secrets.VERCEL_PROJECT_ID }}
          # Firebase service-account aliases used by the ingest/verify workflows
          FIREBASE_SERVICE_ACCOUNT:      ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/verify-actions-secrets.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Secret verification -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "See the 'Verify every secret is injected' step log for per-secret results."
            echo ""
            echo "BACKEND_API_KEY, GEMINI_API_KEY, HAZARDNET_API_URL, HAZARDNET_API_KEY,"
            echo "EE_SERVICE_ACCOUNT_JSON, CODECOV_TOKEN, BENCH_URL, SITE_PROBE_TOKEN,"
            echo "FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY,"
            echo "FIREBASE_SERVICE_ACCOUNT(_JSON), KAGGLE_USERNAME, KAGGLE_KEY,"
            echo "VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID."
            echo ""
            echo "Android signing (ANDROID_KEYSTORE_*) and SLACK_WEBHOOK_URL are deliberately"
            echo "absent: those pipelines were retired to .github/workflow-templates/ on"
            echo "2026-10-26 and no live workflow references their secrets."
          } >> "$GITHUB_STEP_SUMMARY"
