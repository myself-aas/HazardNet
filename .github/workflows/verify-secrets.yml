name: Verify GitHub Actions Secrets

# Standalone dispatchable workflow that maps EVERY repository secret expected
# by HazardNet into a single step and runs scripts/verify-actions-secrets.sh.
#
# Run from:  Actions -> "Verify GitHub Actions Secrets" -> Run workflow
#
# This is a read-only diagnostic: it checks presence/shape only and never
# prints secret values. Exit code 0 = all secrets are correctly configured;
# non-zero = check the Actions log for which secret is missing or malformed.

on:
  workflow_dispatch:

concurrency:
  group: verify-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-all-secrets:
    name: Enumerate & verify all repository secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python (needed for EE_SERVICE_ACCOUNT_JSON JSON check)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Step 1: quick static scan -- confirm every secrets.X reference in every
      # workflow file maps to a name we explicitly verify below. Catches drift
      # when a NEW secret is added to a workflow but forgotten here.
      - name: Static secret-reference audit
        id: audit
        shell: bash
        env:
          # IMPORTANT: never write the literal ${{ or }} inside run: blocks --
          # GitHub interpolates those expressions even inside bash comments,
          # which would leak values into the rendered script. Build the
          # delimiters from env so the YAML source is safe.
          DOPEN: '${{'
          DCLOSE: '}}'
        run: |
          set -euo pipefail
          PATTERN="${DOPEN}[[:space:]]*secrets\\.[A-Z_][A-Z0-9_]*[[:space:]]*${DCLOSE}"
          echo "Secrets referenced across .github/workflows/*.y{a,}ml:"
          mapfile -t REFS < <(
            grep -rhoE "$PATTERN" .github/workflows/ \
              | grep -oE 'secrets\.[A-Z_][A-Z0-9_]*' \
              | sed 's/^secrets\.//' \
              | sort -u
          )
          printf '  %s\n' "${REFS[@]}"

          # Expected set kept in sync with the env: map below. GITHUB_TOKEN is
          # always provided by the runner (no user config required) -- include
          # it here purely so the audit doesn't flag it as "unknown".
          EXPECTED=(BACKEND_API_KEY KAGGLE_USERNAME KAGGLE_KEY GEMINI_API_KEY
                    HAZARDNET_API_URL HAZARDNET_API_KEY EE_SERVICE_ACCOUNT_JSON
                    SUPABASE_DB_URL CODECOV_TOKEN GITHUB_TOKEN
                    # BENCH_URL is consumed by scripts/bench-predict.mjs but is
                    # NOT currently mapped in any production workflow -- it
                    # will show as SKIP unless you wire secrets.BENCH_URL into
                    # the relevant job's env: block.
                    BENCH_URL)

          echo ""
          echo "Cross-checking against expected set..."
          UNKNOWN=0
          for r in "${REFS[@]}"; do
            found=0
            for e in "${EXPECTED[@]}"; do
              [ "$r" = "$e" ] && { found=1; break; }
            done
            if [ "$found" -eq 0 ]; then
              echo "  !! workflow references secrets.${r} but it is NOT in the verification env: list -- add it!"
              UNKNOWN=$((UNKNOWN + 1))
            fi
          done
          if [ "$UNKNOWN" -gt 0 ]; then
            echo "::error::${UNKNOWN} secret reference(s) not covered by verification -- update this workflow."
            exit 1
          fi
          echo "  OK: All ${#REFS[@]} workflow secret references are accounted for."

      # Step 2: map EVERY secret the repo uses into this step's environment
      # (matching the exact env: blocks in the production workflows) and run
      # the verification script.
      - name: Verify every secret is injected
        shell: bash
        env:
          # Core backend
          BACKEND_API_KEY:         ${{ secrets.BACKEND_API_KEY }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          # Kaggle
          KAGGLE_USERNAME:         ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:              ${{ secrets.KAGGLE_KEY }}
          # Daily / Earth Engine inference
          HAZARDNET_API_URL:       ${{ secrets.HAZARDNET_API_URL }}
          HAZARDNET_API_KEY:       ${{ secrets.HAZARDNET_API_KEY }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          # Supabase cutover
          SUPABASE_DB_URL:         ${{ secrets.SUPABASE_DB_URL }}
          # CI / coverage
          CODECOV_TOKEN:           ${{ secrets.CODECOV_TOKEN }}
          # Benchmark (optional -- consumed by scripts/bench-predict.mjs)
          BENCH_URL:               ${{ secrets.BENCH_URL }}
        run: bash scripts/verify-actions-secrets.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Secret verification -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "See the 'Verify every secret is injected' step log for per-secret results."
            echo ""
            echo "Secrets checked: BACKEND_API_KEY, KAGGLE_USERNAME, KAGGLE_KEY,"
            echo "GEMINI_API_KEY, HAZARDNET_API_URL, HAZARDNET_API_KEY,"
            echo "EE_SERVICE_ACCOUNT_JSON, SUPABASE_DB_URL, CODECOV_TOKEN, BENCH_URL."
          } >> "$GITHUB_STEP_SUMMARY"
