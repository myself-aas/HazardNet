name: Weekly Forecast Pipeline & Patch Release

on:
  schedule:
    # Runs every Sunday at 02:00 UTC (i.e., 08:00 local Bangladesh time, BST=UTC+6)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Manual trigger for debugging (main branch only — see preflight)

concurrency:
  group: weekly-forecast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write
  pull-requests: write

env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  FORECAST_STORE: ${{ vars.FORECAST_STORE || 'supabase' }}
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_SSL: 'true'
  NOTEBOOK_DIR: ./kaggle_notebooks/hazardnet-auto-forecast-pipeline
  KERNEL_SLUG: ashifahmedshuvo/hazardnet-auto-forecast-pipeline
  CSV_PATH: ./backend/data/forecasts/hazardnet_forecasts_latest.csv
  JSON_PATH: ./backend/data/forecasts/hazardnet_forecasts_latest.json
  PORT: '3001'

jobs:
  weekly-patch-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pipeline.txt

      - name: Preflight — verify branch + required secrets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "❌ Manual weekly runs are only allowed from 'main' (this workflow tags releases and pushes to main)."
            exit 1
          fi
          missing=0
          for var in KAGGLE_USERNAME KAGGLE_KEY BACKEND_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "❌ '$var' is not configured (repo → Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          if [ "$FORECAST_STORE" = "supabase" ] && [ -z "$DATABASE_URL" ]; then
            echo "❌ FORECAST_STORE=supabase but SUPABASE_DB_URL secret is not set."
            echo "   Apply scripts/db/*.sql in Supabase, then add the service-role Postgres"
            echo "   connection string as SUPABASE_DB_URL (see docs/ops/hourly_forecast.md)."
            missing=1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY unset — ingest advisories will use the deterministic fallback text."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ Required secrets present (store: $FORECAST_STORE)."

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install --requirement scripts/requirements-pipeline.txt

      - name: Configure Kaggle CLI
        shell: bash
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ env.KAGGLE_USERNAME }}\",\"key\":\"${{ env.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle --version

      - name: Trigger Kaggle Notebook
        shell: bash
        run: |
          EXPECTED_KERNEL_SLUG="ashifahmedshuvo/hazardnet-auto-forecast-pipeline"
          if [ ! -f "$NOTEBOOK_DIR/kernel-metadata.json" ]; then
            echo "❌ Notebook directory not found: $NOTEBOOK_DIR"
            exit 1
          fi
          KERNEL_SLUG=$(jq -r '.id' "$NOTEBOOK_DIR/kernel-metadata.json")
          if [ -z "$KERNEL_SLUG" ] || [ "$KERNEL_SLUG" = "null" ]; then
            echo "❌ Could not read kernel id from kernel-metadata.json"
            exit 1
          fi
          if [ "$KERNEL_SLUG" != "$EXPECTED_KERNEL_SLUG" ]; then
            echo "❌ kernel-metadata.json id '$KERNEL_SLUG' does not match '$EXPECTED_KERNEL_SLUG'"
            exit 1
          fi
          cd "$NOTEBOOK_DIR"
          kaggle kernels push -p .
          echo "KERNEL_SLUG=$KERNEL_SLUG" >> "$GITHUB_ENV"
          echo "✅ Triggered Kaggle kernel: $KERNEL_SLUG"

      - name: Wait for Kaggle Notebook to Complete
        shell: bash
        env:
          MAX_RETRIES: '90'
        run: |
          echo "⏳ Polling Kaggle kernel status (max $MAX_RETRIES minutes)..."
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if STATUS_OUTPUT=$(kaggle kernels status "$KERNEL_SLUG" 2>&1); then
              echo "[$((RETRY_COUNT + 1))/$MAX_RETRIES] $STATUS_OUTPUT"
              if echo "$STATUS_OUTPUT" | grep -qi 'complete'; then
                echo "✅ Notebook execution completed successfully!"
                exit 0
              elif echo "$STATUS_OUTPUT" | grep -qiE 'error|cancel'; then
                echo "❌ Notebook execution failed!"
                mkdir -p ./kaggle_logs
                kaggle kernels output "$KERNEL_SLUG" -p ./kaggle_logs || true
                cat ./kaggle_logs/* || true
                exit 1
              fi
            else
              echo "[$((RETRY_COUNT + 1))/$MAX_RETRIES] Transient status check failure (retrying): $STATUS_OUTPUT"
            fi
            sleep 60
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          echo "❌ Timeout waiting for Kaggle notebook to complete."
          exit 1

      - name: Download forecast output from the notebook run
        shell: bash
        run: |
          # Single source of truth (same as the hourly refresher): the kernel's
          # own output files — no stale-dataset fallback, no hard JSON
          # requirement (the notebook emits CSV-only; the JSON sidecar is
          # regenerated from it).
          set -o pipefail
          python scripts/fetch_kaggle_forecast.py --dest data/kaggle_notebook_output \
            --attempts 5 --retry-delay 60 2>&1 | tee fetch.log
          test -f "$CSV_PATH" || { echo "❌ Expected CSV missing: $CSV_PATH"; exit 1; }
          echo "✅ Notebook output ready ($(wc -l < "$CSV_PATH") lines) -> $CSV_PATH"

      - name: Validate forecast data
        shell: bash
        run: |
          # Strict gate (producer pipeline): schema + ranges + freshness.
          python scripts/validate_forecasts.py

      - name: Collect release files
        shell: bash
        run: |
          RELEASE_FILES="$CSV_PATH"
          if [ -f "$JSON_PATH" ]; then
            RELEASE_FILES=$(printf '%s\n%s' "$RELEASE_FILES" "$JSON_PATH")
          fi
          for f in hazardnet_adm3_exposure.csv hazardnet_adm3_locations.csv hazardnet_adm3_latest.geojson; do
            if [ -f "data/$f" ]; then
              RELEASE_FILES=$(printf '%s\n%s' "$RELEASE_FILES" "./data/$f")
              echo "✅ Optional artifact present: $f"
            else
              echo "ℹ️ Optional artifact absent (notebook step is fail-soft): $f"
            fi
          done
          {
            echo "RELEASE_FILES<<ARTIFACT_EOF"
            echo "$RELEASE_FILES"
            echo "ARTIFACT_EOF"
          } >> "$GITHUB_ENV"

      - name: Start backend server
        shell: bash
        run: |
          node backend/server.js > backend-server.log 2>&1 &
          echo $! > backend-server.pid
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/health" > /dev/null; then
              echo "✅ Backend is healthy:"
              curl -s "http://localhost:${PORT}/health"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Backend failed to become healthy. Server log:"
          cat backend-server.log
          exit 1

      - name: Ingest CSV and generate advisories
        shell: bash
        run: |
          HTTP_CODE=$(curl -sS -X POST "http://localhost:${PORT}/api/v1/forecasts/update" \
            -H "Authorization: Bearer $BACKEND_API_KEY" \
            -F "file=@${CSV_PATH}" \
            -o ingest_response.json \
            -w "%{http_code}")
          echo "📥 Ingest responded HTTP $HTTP_CODE:"
          cat ingest_response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Ingestion failed with HTTP $HTTP_CODE"
            exit 1
          fi
          if ! jq -e '.status == "success"' ingest_response.json > /dev/null; then
            echo "❌ Ingestion response did not report success"
            exit 1
          fi
          echo "✅ Ingested $(jq -r '.records_updated' ingest_response.json) records (skipped $(jq -r '.records_skipped' ingest_response.json)) for prediction_date $(jq -r '.prediction_date' ingest_response.json)"

      - name: Rebuild website snapshot
        shell: bash
        run: node scripts/build_forecast_snapshot.mjs

      - name: Run test suite
        run: npx jest --ci

      - name: Stop backend server
        if: always()
        shell: bash
        run: |
          if [ -f backend-server.pid ]; then
            kill "$(cat backend-server.pid)" 2>/dev/null || true
          fi
          pkill -f "backend/server\\.js" 2>/dev/null || true

      - name: Commit refreshed forecast data
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/forecasts/ frontend/public/data/forecasts-latest.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            PREDICTION_DATE=$(jq -r '.prediction_date // "unknown"' backend/data/forecasts/manifest.json 2>/dev/null || echo unknown)
            git commit -m "chore(data): weekly forecast refresh ${PREDICTION_DATE}" \
              -m "Source: kaggle kernels output ${KERNEL_SLUG}" \
              -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi

      - name: Bump Weekly Patch Version
        id: version
        shell: bash
        run: |
          # Version bump runs AFTER successful ingest so a failed data run
          # never ships an empty release.
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Automated weekly release v$NEW_VERSION"
          git push origin HEAD:main --tags
          echo "✅ Successfully bumped and tagged version v$NEW_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Weekly Forecast Release v${{ steps.version.outputs.new_version }}
          body: |
            🤖 **Automated Weekly Forecast Pipeline Execution**

            - ✅ Kaggle notebook executed successfully.
            - ✅ New forecast data ingested into the forecast store via `POST /api/v1/forecasts/update`.
            - ✅ Advisories generated per ingested row.
            - ✅ Website snapshot refreshed (`frontend/public/data/forecasts-latest.json`).
            - 🧪 Test suite passed (`npx jest --ci`).
            - 🔗 Datasets attached below (forecasts CSV + JSON; when present also the ADM3 location matrix, the OSM exposure overlay, and the ADM3 hazard+exposure GeoJSON — ADR 0006).
          files: |
            ${{ env.RELEASE_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-forecast-diagnostics
          path: |
            backend-server.log
            ingest_response.json
            fetch.log
            kaggle_logs/
            data/
          if-no-files-found: ignore
