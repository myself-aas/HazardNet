name: Weekly Forecast Pipeline & Patch Release

# ─────────────────────────────────────────────────────────────────────────────
# RETIRED FROM THE SCHEDULE 2026-09-16 — dispatch-only legacy.
#
# Production forecasts are generated on the GitHub runner by
# `.github/workflows/daily_forecast.yml` (scripts/auto_forecast.py: GEE +
# Open-Meteo + TFLite; no Kaggle anywhere in the path). This workflow needs a
# valid Kaggle token AND a runnable kernel, and after the 2026-09-15 token
# rotation it failed every scheduled run with a bare exit code 1 — it was
# retired rather than left red (see
# docs/audits/2026-09-15-ci-backend-tests-and-workflow-green.md §3 and
# docs/mlops/ARCHITECTURE.md, "Why this is better than the all-Kaggle setup").
#
# Kept for the cases the GitHub path does not cover (heavy ADM3/507-unit run,
# OSM exposure overlay, release archiving): re-enable by adding back a
# `schedule:` block under `on:`, and set the `KAGGLE_KERNEL` repository
# variable if the notebook slug changed. Triage: docs/ops/kaggle-pipeline-triage.md
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: # Manual trigger for debugging (main branch only — see preflight)

concurrency:
  group: weekly-forecast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write
  pull-requests: write

env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  FORECAST_STORE: ${{ vars.FORECAST_STORE || 'firestore' }}
  NOTEBOOK_DIR: ./kaggle_notebooks/hazardnet-auto-forecast-pipeline
  # Overridable (repo → Settings → Secrets and variables → Actions → Variables)
  # — kept in sync with KAGGLE_KERNEL in the other two Kaggle workflows.
  KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL || 'ashifahmedshuvo/hazardnet-auto-forecast-pipeline' }}
  CSV_PATH: ./backend/data/forecasts/hazardnet_forecasts_latest.csv
  JSON_PATH: ./backend/data/forecasts/hazardnet_forecasts_latest.json
  PORT: '3001'

jobs:
  weekly-patch-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pipeline.txt

      - name: Preflight — verify branch + required secrets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "❌ Manual weekly runs are only allowed from 'main' (this workflow tags releases and pushes to main)."
            exit 1
          fi
          missing=0
          for var in KAGGLE_USERNAME KAGGLE_KEY BACKEND_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "❌ '$var' is not configured (repo → Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY unset — ingest advisories will use the deterministic fallback text."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ Required secrets present (store: $FORECAST_STORE)."

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install --requirement scripts/requirements-pipeline.txt

      - name: Validate Firebase environment variables
        run: node scripts/validate_env.mjs

      - name: Configure Kaggle CLI
        shell: bash
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ env.KAGGLE_USERNAME }}\",\"key\":\"${{ env.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle --version

      - name: Trigger Kaggle Notebook
        shell: bash
        run: |
          python scripts/kaggle_trigger.py --kernel "$KERNEL_SLUG" --max-retries 45 --poll-interval 30

      - name: Download forecast output from the notebook run
        shell: bash
        run: |
          set -o pipefail
          python scripts/fetch_kaggle_forecast.py --dest data/kaggle_notebook_output \
            --attempts 5 --retry-delay 60 2>&1 | tee fetch.log
          test -f "$CSV_PATH" || { echo "❌ Expected CSV missing: $CSV_PATH"; exit 1; }
          echo "✅ Notebook output ready ($(wc -l < "$CSV_PATH") lines) -> $CSV_PATH"

      - name: Validate forecast data
        shell: bash
        run: |
          python scripts/validate_forecasts.py --skip-coverage  # legacy Kaggle producer: no run report / coverage tally

      - name: Collect release files
        shell: bash
        run: |
          RELEASE_FILES="$CSV_PATH"
          if [ -f "$JSON_PATH" ]; then
            RELEASE_FILES=$(printf '%s\n%s' "$RELEASE_FILES" "$JSON_PATH")
          fi
          for f in hazardnet_adm3_exposure.csv hazardnet_adm3_locations.csv hazardnet_adm3_latest.geojson; do
            if [ -f "data/$f" ]; then
              RELEASE_FILES=$(printf '%s\n%s' "$RELEASE_FILES" "./data/$f")
              echo "✅ Optional artifact present: $f"
            else
              echo "ℹ️ Optional artifact absent (notebook step is fail-soft): $f"
            fi
          done
          {
            echo "RELEASE_FILES<<ARTIFACT_EOF"
            echo "$RELEASE_FILES"
            echo "ARTIFACT_EOF"
          } >> "$GITHUB_ENV"

      - name: Start backend server
        shell: bash
        run: |
          node backend/server.js > backend-server.log 2>&1 &
          echo $! > backend-server.pid
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/health" > /dev/null; then
              echo "✅ Backend is healthy:"
              curl -s "http://localhost:${PORT}/health"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Backend failed to become healthy. Server log:"
          cat backend-server.log
          exit 1

      - name: Ingest CSV and generate advisories
        shell: bash
        run: |
          HTTP_CODE=$(curl -sS -X POST "http://localhost:${PORT}/api/v1/forecasts/update" \
            -H "Authorization: Bearer $BACKEND_API_KEY" \
            -F "file=@${CSV_PATH}" \
            -o ingest_response.json \
            -w "%{http_code}")
          echo "📥 Ingest responded HTTP $HTTP_CODE:"
          cat ingest_response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Ingestion failed with HTTP $HTTP_CODE"
            exit 1
          fi
          if ! jq -e '.status == "success"' ingest_response.json > /dev/null; then
            echo "❌ Ingestion response did not report success"
            exit 1
          fi
          echo "✅ Ingested $(jq -r '.records_updated' ingest_response.json) records (skipped $(jq -r '.records_skipped' ingest_response.json)) for prediction_date $(jq -r '.prediction_date' ingest_response.json)"

      - name: Rebuild website snapshot
        shell: bash
        run: node scripts/build_forecast_snapshot.mjs

      - name: Run test suite
        run: npx jest --ci

      - name: Stop backend server
        if: always()
        shell: bash
        run: |
          if [ -f backend-server.pid ]; then
            kill "$(cat backend-server.pid)" 2>/dev/null || true
          fi
          pkill -f "backend/server\\.js" 2>/dev/null || true

      - name: Commit refreshed forecast data
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/forecasts/ frontend/public/data/forecasts-latest.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            PREDICTION_DATE=$(jq -r '.prediction_date // "unknown"' backend/data/forecasts/manifest.json 2>/dev/null || echo unknown)
            git commit -m "chore(data): weekly forecast refresh ${PREDICTION_DATE}" \
              -m "Source: kaggle kernels output ${KERNEL_SLUG}" \
              -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi

      - name: Bump Weekly Patch Version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Automated weekly release v$NEW_VERSION"
          git push origin HEAD:main --tags
          echo "✅ Successfully bumped and tagged version v$NEW_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Weekly Forecast Release v${{ steps.version.outputs.new_version }}
          body: |
            🤖 **Automated Weekly Forecast Pipeline Execution**

            - ✅ Kaggle notebook executed successfully.
            - ✅ New forecast data ingested into the forecast store via `POST /api/v1/forecasts/update`.
            - ✅ Advisories generated per ingested row.
            - ✅ Website snapshot refreshed (`frontend/public/data/forecasts-latest.json`).
            - 🧪 Test suite passed (`npx jest --ci`).
            - 🔗 Datasets attached below (forecasts CSV + JSON).
          files: |
            ${{ env.RELEASE_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-forecast-diagnostics
          path: |
            backend-server.log
            ingest_response.json
            fetch.log
            kaggle_logs/
            data/
          if-no-files-found: ignore
