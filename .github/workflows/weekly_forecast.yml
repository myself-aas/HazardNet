name: Weekly Forecast Pipeline

on:
  schedule:
    # Runs every Sunday at 02:00 UTC (i.e., 10:00 local Bangladesh time)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Manual trigger for debugging

concurrency:
  group: weekly-forecast
  cancel-in-progress: true

env:
  # These are injected as GitHub secrets. They are required for the
  # Kaggle API, Gemini, and Supabase connections.
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # Supabase connection for PostgreSQL
  DATABASE_URL: ${{ secrets.SUPABASE_URL }}
  DATABASE_SSL: 'true'
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Path to the CSV that will be generated by the Kaggle script.
  CSV_PATH: ./data/weekly_forecast.csv

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend
          npm ci

      - name: Install Kaggle CLI
        run: |
          pip install kaggle
          kaggle --version

      - name: Download forecast data from Kaggle
        run: |
          kaggle datasets download -d ${KAGGLE_USERNAME}/hazardnet-forecast --unzip -p data
          # The Kaggle dataset contains a CSV named `weekly_forecast.csv`.
          # Verify its existence.
          if [ ! -f ${CSV_PATH} ]; then
            echo "CSV not found at ${CSV_PATH}" && exit 1
          fi

      - name: Start backend server
        run: |
          cd backend
          # Run the server in the background. It will listen on port 3001.
          npm run start &
          echo "Backend started with PID $!"
          # Wait for the server to be ready.
          for i in {1..30}; do
            nc -z localhost 3001 && break || sleep 2
          done
          if ! nc -z localhost 3001; then
            echo "Backend failed to start" && exit 1
          fi

      - name: Ingest CSV and generate advisories
        run: |
          # The backend exposes a POST /api/forecasts endpoint that accepts a CSV.
          curl -sS -X POST http://localhost:3001/api/forecasts \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${CSV_PATH}" \
            -o /tmp/ingest_response.json
          echo "Ingest response:" && cat /tmp/ingest_response.json
          # Verify that the response contains advisories.
          if ! jq -e '.advisories | length > 0' /tmp/ingest_response.json; then
            echo "No advisories returned" && exit 1
          fi

      - name: Run tests
        run: |
          cd backend
          npm test

      - name: Stop backend server
        run: |
          pkill -f "node.*backend" || true

      - name: Upload logs (optional)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend/logs/*.log
