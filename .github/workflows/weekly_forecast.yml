name: Weekly Forecast Pipeline & Patch Release

on:
  schedule:
    # Runs every Sunday at 02:00 UTC (i.e., 10:00 local Bangladesh time)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Manual trigger for debugging

concurrency:
  group: weekly-forecast
  cancel-in-progress: false # Prevent cancellation mid-release/version bump

env:
  # Injected as GitHub Secrets
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  DATABASE_URL: ${{ secrets.SUPABASE_URL }}
  DATABASE_SSL: 'true'
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  
  # Paths
  NOTEBOOK_DIR: ./kaggle_notebooks/auto_forecast
  CSV_PATH: ./data/weekly_forecast.csv

jobs:
  weekly-patch-and-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for version bumping, tagging, and releases
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git tagging and pushing history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # =======================================================================
      # 1. AUTOMATED WEEKLY PATCH VERSIONING
      # =======================================================================
      - name: Bump Weekly Patch Version
        id: version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Bump patch version in package.json (e.g., 1.0.0 -> 1.0.1)
          npm version patch --no-git-tag-version
          
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Commit and tag the new version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Automated weekly release v$NEW_VERSION"
          git push origin HEAD:main --tags
          echo "✅ Successfully bumped and tagged version v$NEW_VERSION"

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ..
          pip install kaggle

      # =======================================================================
      # 2. KAGGLE NOTEBOOK EXECUTION
      # =======================================================================
      - name: Configure Kaggle CLI
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ env.KAGGLE_USERNAME }}","key":"${{ env.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Trigger Kaggle Notebook
        run: |
          cd ${{ env.NOTEBOOK_DIR }}
          # Pushes the notebook and automatically triggers a run if 'enable_gpu' or schedule is set in metadata
          kaggle kernels push -p .
          
          # Extract the kernel slug (e.g., "username/kernel-name") from metadata
          KERNEL_SLUG=$(cat kernel-metadata.json | jq -r '.id')
          echo "kernel_slug=$KERNEL_SLUG" >> $GITHUB_ENV
          echo "✅ Triggered Kaggle kernel: $KERNEL_SLUG"

      - name: Wait for Kaggle Notebook to Complete
        run: |
          echo "⏳ Polling Kaggle kernel status..."
          MAX_RETRIES=60 # 60 minutes max wait time
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            STATUS_OUTPUT=$(kaggle kernels status ${{ env.kernel_slug }})
            STATUS=$(echo "$STATUS_OUTPUT" | awk '{print $3}')
            echo "Current status: $STATUS"
            
            if [[ "$STATUS" == "complete" ]]; then
              echo "✅ Notebook execution completed successfully!"
              break
            elif [[ "$STATUS" == "error" ]]; then
              echo "❌ Notebook execution failed!"
              mkdir -p ./kaggle_logs
              kaggle kernels output ${{ env.kernel_slug }} -p ./kaggle_logs
              cat ./kaggle_logs/* || true
              exit 1
            fi
            
            sleep 60
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Timeout waiting for Kaggle notebook to complete."
            exit 1
          fi

      - name: Download Forecast Data from Kaggle
        run: |
          mkdir -p data
          kaggle kernels output ${{ env.kernel_slug }} -p data
          
          # Find the generated CSV (adjust filename if your notebook outputs a specific name)
          CSV_FILE=$(find data -name "*.csv" | head -n 1)
          if [ -z "$CSV_FILE" ]; then
            echo "❌ No CSV file found in Kaggle output."
            exit 1
          fi
          
          mv "$CSV_FILE" ${{ env.CSV_PATH }}
          echo "✅ Successfully downloaded and moved CSV to ${{ env.CSV_PATH }}"

      # =======================================================================
      # 3. BACKEND INGESTION & TESTING
      # =======================================================================
      - name: Start backend server
        run: |
          cd backend
          npm run start &
          echo "Backend started with PID $!"
          
          # Wait for the server to be ready
          for i in {1..30}; do
            if nc -z localhost 3001; then
              echo "✅ Backend is ready!"
              break
            fi
            sleep 2
          done
          
          if ! nc -z localhost 3001; then
            echo "❌ Backend failed to start"
            exit 1
          fi

      - name: Ingest CSV and generate advisories
        run: |
          curl -sS -X POST http://localhost:3001/api/forecasts \
            -H "Authorization: Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${{ env.CSV_PATH }}" \
            -o /tmp/ingest_response.json
          
          echo "📥 Ingest response:"
          cat /tmp/ingest_response.json
          
          # Verify that the response indicates success
          if ! jq -e '.status == "success"' /tmp/ingest_response.json > /dev/null; then
            echo "❌ Ingestion failed or no advisories returned"
            exit 1
          fi

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Stop backend server
        if: always()
        run: |
          pkill -f "node.*backend" || true

      # =======================================================================
      # 4. RELEASE & ARTIFACTS
      # =======================================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Weekly Forecast Release v${{ steps.version.outputs.new_version }}
          body: |
            🤖 **Automated Weekly Forecast Pipeline Execution**
            
            - ✅ Kaggle notebook executed successfully.
            - ✅ New forecast data ingested into Supabase.
            - ✅ Backend advisories generated.
            - 🔗 Dataset attached below.
          files: |
            ${{ env.CSV_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend/logs/*.log
