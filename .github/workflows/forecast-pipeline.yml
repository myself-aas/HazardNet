name: HazardNet Automated Forecast Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# DISPATCH-ONLY: this triggers a Kaggle notebook run and pulls its output.
#
# The daily producer is `.github/workflows/daily_forecast.yml`, which pulls the
# notebook's output on a schedule (since 2026-09-20 — see
# docs/adr/0013-kaggle-is-the-forecast-producer.md). This workflow is the manual
# half of the same path: push the notebook, wait for it, pull and publish. Use it
# when you have changed the notebook and want today's rows from the new code
# rather than waiting for Kaggle's own schedule.
#
# It needs a valid Kaggle token AND a runnable kernel, which is why it stays off
# the schedule: after the 2026-09-15 token rotation every scheduled Kaggle run
# failed with a bare exit code 1 while the site silently served the last
# committed snapshot (docs/audits/2026-09-15-ci-backend-tests-and-workflow-green.md
# §3). A dispatch failure is read by the person who clicked the button.
#
# Also kept for the cases the daily pull does not cover (heavy ADM3/507-unit run,
# OSM exposure overlay, release archiving). Set the `KAGGLE_KERNEL` repository
# variable if the notebook slug changed. Triage: docs/ops/kaggle-pipeline-triage.md
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force forecast generation'
        required: false
        default: 'false'

concurrency:
  group: forecast-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORECAST_STORE: ${{ vars.FORECAST_STORE || 'firestore' }}
  # Overridable at runtime (repo → Settings → Secrets and variables → Actions →
  # Variables). Renaming or re-uploading the notebook on Kaggle changes its
  # slug; every Kaggle-backed job then dies at the first API call with a bare
  # "exit code 1". Set the `KAGGLE_KERNEL` variable to repoint all three
  # pipelines without a code change, and see the diagnostic output of
  # scripts/kaggle_trigger.py for which of the two failure modes it is
  # (credentials vs. kernel not found).
  KAGGLE_KERNEL: ${{ vars.KAGGLE_KERNEL || 'ashifahmedshuvo/hazardnet-auto-forecast-pipeline' }}

jobs:
  generate-forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pipeline.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for required secrets
        shell: bash
        run: |
          missing=0
          for secret in KAGGLE_USERNAME KAGGLE_KEY BACKEND_API_KEY; do
            if [ -z "${!secret}" ]; then
              echo "❌ Error: $secret secret is not set (repo → Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ Required secrets present (store: $FORECAST_STORE)."
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install --requirement scripts/requirements-pipeline.txt

      - name: Validate Firebase environment variables
        run: node scripts/validate_env.mjs

      - name: Configure Kaggle CLI
        shell: bash
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle --version
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      - name: Trigger Kaggle Notebook Run
        id: kaggle_trigger
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python scripts/kaggle_trigger.py --kernel "$KAGGLE_KERNEL" --max-retries 45 --poll-interval 30

      - name: Download Output CSV from Kaggle
        id: fetch_forecast
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python scripts/fetch_kaggle_forecast.py --kernel "$KAGGLE_KERNEL" --dest data/kaggle_notebook_output --attempts 5 --retry-delay 30

      - name: Validate Forecast Data
        run: |
          # Coverage gate ON: scripts/fetch_kaggle_forecast.py writes the tally
          # (64-district vocabulary × horizons vs published rows), so a short
          # producer run is labelled partial rather than passing as complete.
          python scripts/validate_forecasts.py

      - name: Ingest refreshed CSV into Firebase and backend store
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          PORT: '3001'
        run: |
          node backend/server.js > backend-server.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS -X POST "http://127.0.0.1:${PORT}/api/v1/forecasts/update" \
            -H "Authorization: Bearer ${BACKEND_API_KEY}" \
            -F "file=@backend/data/forecasts/hazardnet_forecasts_latest.csv" \
            -o ingest-response.json
          jq -e '.status == "success"' ingest-response.json >/dev/null
          cat ingest-response.json

      - name: Rebuild website snapshot
        run: |
          node scripts/build_forecast_snapshot.mjs
          echo "### 3-Hour forecast refresh — $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- prediction_date: " + (.prediction_date // "unknown")' frontend/public/data/forecasts-latest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Historical Forecasts
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          mkdir -p backend/data/forecasts/archive/${TIMESTAMP}

          if [ -f backend/data/forecasts/hazardnet_forecasts_latest.csv ]; then
            cp backend/data/forecasts/hazardnet_forecasts_latest.csv \
               backend/data/forecasts/archive/${TIMESTAMP}/
          fi

          if [ -f backend/data/forecasts/hazardnet_forecasts_latest.json ]; then
            cp backend/data/forecasts/hazardnet_forecasts_latest.json \
               backend/data/forecasts/archive/${TIMESTAMP}/
          fi

          echo "Archived forecasts to archive/${TIMESTAMP}/"

      - name: Commit Forecast Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/forecasts/ frontend/public/data/forecasts-latest.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git commit -m "chore(data): update 3-hour forecasts $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                        -m "Automated 3-hour forecast update from Kaggle pipeline" \
                        -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            # An explicit refspec, not a bare `git push`: with no upstream configured — and
            # whenever the checkout is not sitting on a local branch — git dies with exit 128
            # and the only thing the run reports is "Process completed with exit code 128",
            # which is how hindcast.yml failed on 2026-09-19 (run 35430992137) after every
            # scoring step had passed. The summary block below makes the next one legible:
            # branch state, the last commits and the remote answer for themselves.
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              {
                echo '#### The 3-hour forecast commit could not be pushed'
                echo '```'
                git status --short --branch
                git log --oneline -3
                git remote -v
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::the bot commit is local only — nothing was published to ${GITHUB_REF_NAME}. The job summary says whether the push was rejected (branch protection, read-only token) or the ref did not resolve."
              exit 1
            fi
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forecast-outputs
          path: |
            backend/data/forecasts/hazardnet_forecasts_latest.csv
            backend/data/forecasts/hazardnet_forecasts_latest.json
            frontend/public/data/forecasts-latest.json
          retention-days: 90

      - name: Notify on Failure
        if: failure()
        run: |
          echo "⚠️ Forecast pipeline failed! Check logs for details."
          echo "::error::Forecast generation or validation failed"

      - name: Check Forecast Freshness
        if: success()
        run: |
          if [ -f backend/data/forecasts/hazardnet_forecasts_latest.json ]; then
            SOURCE=backend/data/forecasts/hazardnet_forecasts_latest.json
          else
            SOURCE=backend/data/forecasts/hazardnet_forecasts_latest.csv
          fi
          FORECAST_AGE_HOURS=$(python3 -c "
          import csv, json, sys
          from datetime import datetime, timezone
          src = '$SOURCE'
          if src.endswith('.json'):
              with open(src) as f:
                  dates = [r['prediction_date'] for r in json.load(f)]
          else:
              with open(src, newline='') as f:
                  dates = [r['prediction_date'] for r in csv.DictReader(f)]
          latest = max(dates)
          pred = datetime.fromisoformat(latest)
          if pred.tzinfo is None:
              pred = pred.replace(tzinfo=timezone.utc)
          age = (datetime.now(timezone.utc) - pred).total_seconds() / 3600
          print(int(age))
          print(latest, file=sys.stderr)
          ")

          if [ "$FORECAST_AGE_HOURS" -gt 48 ]; then
            echo "::warning::Forecasts are ${FORECAST_AGE_HOURS} hours old (stale threshold: 48hrs)"
          else
            echo "✅ Forecasts are fresh (${FORECAST_AGE_HOURS} hours old)"
          fi
