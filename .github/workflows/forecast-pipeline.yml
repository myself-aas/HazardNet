name: Three-hour verified Kaggle forecasts
on:
  schedule:
    - cron: '0 */3 * * *' # UTC; GitHub schedules may be delayed.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast-production-writer
  cancel-in-progress: false
jobs:
  forecast:
    # Only reviewed default-branch code may access production credentials.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: forecast-production
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-pipeline.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies before exposing credentials
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          pip install -r scripts/requirements-pipeline.txt
      - name: Preflight production configuration
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL: ${{ vars.KAGGLE_KERNEL }}
          KAGGLE_SOURCE_SHA256: ${{ vars.KAGGLE_SOURCE_SHA256 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          for key in KAGGLE_USERNAME KAGGLE_KEY KAGGLE_KERNEL KAGGLE_SOURCE_SHA256 FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_PROJECT_ID FIREBASE_DATABASE_ID; do
            test -n "${!key}" || { echo "::error::Configure $key in forecast-production"; exit 1; }
          done
      - name: Trigger new notebook version and await verified output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL: ${{ vars.KAGGLE_KERNEL }}
          KAGGLE_SOURCE_SHA256: ${{ vars.KAGGLE_SOURCE_SHA256 }}
        run: python scripts/kaggle_trigger.py --timeout-minutes 90
      - name: Publish complete snapshot atomically to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: node scripts/publish_forecasts.mjs > .forecast-run/receipt.json
      - name: Publication summary
        run: |
          echo '### Verified Kaggle publication' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Run: " + .run_id + "\n- Result: " + .status' .forecast-run/receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Archive validated outputs only (never notebook source or execution logs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: forecast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .forecast-run/hazardnet_forecasts_latest.csv
            .forecast-run/hazardnet_run.json
            .forecast-run/publication.json
            .forecast-run/receipt.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Report failed refresh
        if: failure()
        run: echo '::error::Refresh failed. Last successful Firebase publication remains active; inspect run and notebook contract.'
