name: Legacy Two-Horizon Advisory Ingestion

# The current Kaggle export has 960 district/day rows, not the older 128
# two-horizon rows. This workflow is manual-only; the daily schedule belongs to
# public_daily_advisories.yml. Never feed the newer export to this Firestore path.
on:
  workflow_dispatch:
    inputs:
      advisory_csv_path:
        description: 'Required path or URL to a 128-row legacy two-horizon CSV (not the 960-row daily export)'
        required: true
        default: ''
      allow_stale:
        description: 'Bypass staleness guard (>36h) for manual rehearsal'
        required: false
        type: boolean
        default: false

concurrency:
  group: advisory-ingest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    name: Advisory Fetch & Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install legacy ingestion dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Load explicitly supplied legacy CSV
        id: fetch-advisory
        env:
          OVERRIDE_PATH: ${{ inputs.advisory_csv_path }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${OVERRIDE_PATH:-}" ]; then
            echo '::error::A legacy 128-row two-horizon CSV is required. The daily Kaggle dataset belongs to public_daily_advisories.yml.'
            exit 1
          fi
          mkdir -p /tmp/advisory-ingest
          if [[ "$OVERRIDE_PATH" =~ ^https?:// ]]; then
            curl -fsSL "$OVERRIDE_PATH" -o /tmp/advisory-ingest/hazardnet_advisories_latest.csv
          else
            cp -- "$OVERRIDE_PATH" /tmp/advisory-ingest/hazardnet_advisories_latest.csv
          fi
          test -s /tmp/advisory-ingest/hazardnet_advisories_latest.csv
          echo 'fetched=true' >> "$GITHUB_OUTPUT"
          echo 'fresh=true' >> "$GITHUB_OUTPUT"

      - name: Validate Advisory CSV & Execute Ingestion
        id: run-ingest
        env:
          ALLOW_STALE: ${{ inputs.allow_stale }}
          FETCHED: ${{ steps.fetch-advisory.outputs.fetched }}
          FRESH: ${{ steps.fetch-advisory.outputs.fresh }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ "$FETCHED" != "true" ]; then
            echo "[ingest] Skipping fresh advisory mapping (no new Kaggle fetch)."
            exit 0
          fi

          if [ "$FRESH" != "true" ]; then
            echo "[ingest] Advisory CSV is unchanged since the last ingest — nothing new to map."
            echo "[ingest] The fetch step has already annotated this as a missed Kaggle run."
            exit 0
          fi

          STALE_FLAG=""
          if [ "$ALLOW_STALE" = "true" ]; then
            STALE_FLAG="--allow-stale"
          fi

          INGEST_FIRESTORE_FLAG=""
          if node -e "import('./backend/forecastPersistence.js').then(({ validateServiceAccountEnv }) => { const res = validateServiceAccountEnv(); if (!res.valid) { console.log('[ingest] Firestore pre-flight check: ' + res.reason); process.exit(1); } console.log('[ingest] Firestore credentials verified via ' + res.source + ' (project: ' + res.projectId + ')'); })"; then
            INGEST_FIRESTORE_FLAG="--ingest-firestore"
          else
            echo "::warning::[ingest] Valid Firebase service account JSON not configured; proceeding with static snapshot generation only."
          fi

          echo "[ingest] Executing process_advisory_ingest.mjs..."
          node scripts/process_advisory_ingest.mjs \
            /tmp/advisory-ingest/hazardnet_advisories_latest.csv \
            $STALE_FLAG \
            $INGEST_FIRESTORE_FLAG

          echo "[ingest] Rehearsing alert engine & refreshing alerts-latest.json and freshness.json..."
          node scripts/rehearse_alert_engine.mjs \
            --snapshot frontend/public/data/forecasts-latest.json \
            --out /tmp/advisory-ingest/alert-run.json
          node scripts/build_alert_snapshot.mjs \
            --in /tmp/advisory-ingest/alert-run.json \
            --out frontend/public/data/alerts-latest.json \
            --allow-empty
          node scripts/build_freshness_artifact.mjs

      - name: Run Pipeline Validation Tests (Tier 0 & Tier 1)
        run: |
          echo "[test] Running advisory pipeline test suite..."
          node --test __tests__/advisoryPipeline.test.js

      - name: Commit updated forecast artifacts
        id: commit-artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/forecasts/ \
                  frontend/public/data/forecasts-latest.json \
                  frontend/public/data/alerts-latest.json \
                  frontend/public/data/freshness.json

          if git diff --staged --quiet; then
            echo "[git] No changes in forecast artifacts. Working tree is clean."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            PREDICTION_DATE=$(node -e "const m = require('./backend/data/forecasts/manifest.json'); console.log(m.prediction_date);")
            git commit -m "chore(advisory): ingest daily forecast run for $PREDICTION_DATE [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "[git] Pushed updated forecast data for $PREDICTION_DATE."
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # The deploy trigger. Until 2026-10-26 this job ended with `npx vercel deploy --prod`,
      # gated on `committed == 'true'` and on a VERCEL_TOKEN the repository never held, so the
      # step silently deferred to a Git trigger that was not doing anything either.
      #
      # Why a hook and not "the push is the trigger": the artifact commit above carries
      # `[skip ci]`, which is deliberate (a data commit must not re-run the 20-minute test
      # matrix) and which Cloudflare Pages honours with the same skip tokens. So the push by
      # itself will NOT rebuild the site — the hook is the trigger, not a redundancy.
      # `docs/ops/deployment.md` §4 records the dashboard side (Deploy hooks → main).
      #
      # It fails loudly on purpose: an unset secret, a non-2xx answer or a network failure
      # means the site keeps serving the previous artifacts, and a green run that says
      # "deployed" while nothing deployed is the exact failure this replaces.
      - name: Trigger Cloudflare Pages Production Deployment
        if: steps.commit-artifacts.outputs.committed == 'true'
        shell: bash
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          set -uo pipefail
          if [ -z "${CF_PAGES_DEPLOY_HOOK}" ]; then
            echo "::error::Artifacts were committed, but CF_PAGES_DEPLOY_HOOK is unset, so the site will keep serving the previous build. Create the deploy hook (Cloudflare Pages -> project -> Settings -> Builds & deployments -> Deploy hooks -> main) and store its URL as the repository secret CF_PAGES_DEPLOY_HOOK. See docs/ops/deployment.md section 4."
            exit 1
          fi
          HTTP=$(curl -sS -o /tmp/pages-hook.txt -w '%{http_code}' \
            -X POST "$CF_PAGES_DEPLOY_HOOK" \
            -H 'Content-Type: application/json' --data '{}' \
            --retry 3 --retry-delay 10 --retry-connrefused --max-time 30) || HTTP=000
          echo "deploy hook answered HTTP $HTTP"
          case "$HTTP" in
            2??) echo "[deploy] Cloudflare Pages build triggered." ;;
            000)
              echo "::error::could not reach the Cloudflare Pages deploy hook (no HTTP response after 4 attempts). The artifacts are committed; trigger a build from the dashboard or run: npx wrangler pages deploy frontend/dist --project-name=<project>"
              exit 1
              ;;
            *)
              echo "::error::the Cloudflare Pages deploy hook rejected the request with HTTP $HTTP:"
              head -c 500 /tmp/pages-hook.txt || true
              exit 1
              ;;
          esac

      # Retired 2026-10-26: the trailing "Dispatch Operational Monitoring & Slack
      # Alert" step used to sit here. It is now the inert template
      # `.github/workflow-templates/hazardnet-ops-slack-notify.yml`.
      #
      # Two reasons, both measured rather than assumed:
      #   * The repository has no `SLACK_WEBHOOK_URL` secret, so the step could
      #     never deliver anything.
      #   * It would not have delivered anything if it had: `scripts/notify_ops.mjs`
      #     builds the Block Kit payload and logs `Slack payload prepared for
      #     #hazardnet-ops`, but never POSTs to the webhook. The step was green on
      #     every run — including failing ones — while reporting nothing.
      # The payload builder and its unit tests stay in the tree; only the wiring
      # moved. Restoration steps are in the template header.
