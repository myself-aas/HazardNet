name: Daily Advisory Ingestion

on:
  schedule:
    # 05:30 UTC ≈ 11:30 BDT (runs daily after Kaggle notebook completes)
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      advisory_csv_path:
        description: 'Optional path or URL to hazardnet_advisories_latest.csv override'
        required: false
        default: ''
      allow_stale:
        description: 'Bypass staleness guard (>36h) for manual rehearsal'
        required: false
        type: boolean
        default: false

concurrency:
  group: advisory-ingest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    name: Advisory Fetch & Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: pip install --no-cache-dir kaggle

      - name: Create working directory
        run: mkdir -p /tmp/advisory-ingest

      - name: Fetch advisory output from Kaggle
        id: fetch-advisory
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          # Prefer the notebook's published dataset (the stable public CSV) and use kernel
          # output as a fallback for transient dataset API failures.
          KAGGLE_DATASET: ${{ vars.ADVISORY_DATASET || 'ashifahmedshuvo/hazardnet-weekly-forecasts' }}
          KAGGLE_KERNEL: ${{ vars.ADVISORY_KERNEL || 'myself-aas/8-hazardnet-advisory' }}
          ADVISORY_CSV_NAME: hazardnet_advisories_latest.csv
          OVERRIDE_PATH: ${{ inputs.advisory_csv_path }}
        run: |
          # NOTE: no `set -e` here. The fetcher's exit code IS the signal this step
          # branches on (0 fresh / 2 unchanged / 1 failed), and `set -e` would kill the
          # step before the branch could read it.
          set -uo pipefail
          OUT=/tmp/advisory-ingest
          mkdir -p "$OUT"

          # A manual override (URL or workspace path) short-circuits Kaggle entirely.
          if [ -n "${OVERRIDE_PATH:-}" ]; then
            echo "[fetch] Using provided advisory CSV override: $OVERRIDE_PATH"
            if [[ "$OVERRIDE_PATH" =~ ^https?:// ]]; then
              curl -fsSL "$OVERRIDE_PATH" -o "$OUT/hazardnet_advisories_latest.csv"
            else
              cp "$OVERRIDE_PATH" "$OUT/hazardnet_advisories_latest.csv"
            fi
            echo "fetched=true"  >> "$GITHUB_OUTPUT"
            echo "fresh=true"    >> "$GITHUB_OUTPUT"
            echo "via=override"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The dataset is public, so the HTTP download is unauthenticated by default.
          # Optional Kaggle credentials unlock the CLI/kernel fallback if the API endpoint
          # is unavailable. Do not make a private secret mandatory for a public CSV.
          if [ -n "${KAGGLE_USERNAME:-}" ] && [ -n "${KAGGLE_KEY:-}" ]; then
            mkdir -p ~/.kaggle
            jq -n --arg username "$KAGGLE_USERNAME" --arg key "$KAGGLE_KEY" \
              '{username:$username,key:$key}' > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          else
            echo "[fetch] Kaggle credentials unset; using the public dataset API."
          fi

          # --wait-minutes: a scheduled Kaggle notebook is allowed to be tardy. Poll rather
          # than fail, but stay well inside the job's timeout-minutes. Wrap in an `if`: GitHub
          # invokes bash with `-e`, and a bare exit code 2 would terminate the step before the
          # branch below can distinguish unchanged from failed.
          if node scripts/fetch_kaggle_advisory.mjs --out "$OUT" --wait-minutes 12; then
            code=0
          else
            code=$?
          fi

          case "$code" in
            0)
              echo "fetched=true" >> "$GITHUB_OUTPUT"
              echo "fresh=true"   >> "$GITHUB_OUTPUT"
              ;;
            2)
              # Fetched fine, but the file is not newer than what is already committed —
              # i.e. the Kaggle schedule did not produce a new run. This is a real
              # finding, not a no-op: it is annotated, summarised and reported to Slack.
              echo "fetched=true"  >> "$GITHUB_OUTPUT"
              echo "fresh=false"   >> "$GITHUB_OUTPUT"
              echo "::warning::Advisory CSV fetched but unchanged since the last ingest — the Kaggle schedule did not produce a new run today."
              {
                echo "### ⏭️ No new advisory run"
                echo
                echo "The fetch succeeded, but the CSV is identical to the one already ingested."
                echo
                echo "Check the notebook's last successful run on Kaggle (schedule: daily)."
              } >> "$GITHUB_STEP_SUMMARY"
              if [ -f "$OUT/fetch-report.json" ]; then
                {
                  echo
                  echo '```json'
                  cat "$OUT/fetch-report.json"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              # A scheduled no-update is a real feed failure; fail it so the always()-run
              # operational notification is red. A manual rehearsal can legitimately be
              # unchanged and remains a successful no-op.
              if [ "${{ github.event_name }}" = "schedule" ]; then
                echo "::error::Scheduled Kaggle advisory publication is unchanged."
                exit 1
              fi
              ;;
            *)
              echo "::error::Advisory fetch failed (exit $code). See the step log for the method-by-method diagnosis."
              exit "$code"
              ;;
          esac

      - name: Validate Advisory CSV & Execute Ingestion
        id: run-ingest
        env:
          ALLOW_STALE: ${{ inputs.allow_stale }}
          FETCHED: ${{ steps.fetch-advisory.outputs.fetched }}
          FRESH: ${{ steps.fetch-advisory.outputs.fresh }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ "$FETCHED" != "true" ]; then
            echo "[ingest] Skipping fresh advisory mapping (no new Kaggle fetch)."
            exit 0
          fi

          if [ "$FRESH" != "true" ]; then
            echo "[ingest] Advisory CSV is unchanged since the last ingest — nothing new to map."
            echo "[ingest] The fetch step has already annotated this as a missed Kaggle run."
            exit 0
          fi

          STALE_FLAG=""
          if [ "$ALLOW_STALE" = "true" ]; then
            STALE_FLAG="--allow-stale"
          fi

          INGEST_FIRESTORE_FLAG=""
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ] || [ -n "${FIREBASE_PROJECT_ID:-}" ]; then
            INGEST_FIRESTORE_FLAG="--ingest-firestore"
          fi

          echo "[ingest] Executing process_advisory_ingest.mjs..."
          node scripts/process_advisory_ingest.mjs \
            /tmp/advisory-ingest/hazardnet_advisories_latest.csv \
            $STALE_FLAG \
            $INGEST_FIRESTORE_FLAG

          echo "[ingest] Rehearsing alert engine & refreshing alerts-latest.json and freshness.json..."
          node scripts/rehearse_alert_engine.mjs \
            --snapshot frontend/public/data/forecasts-latest.json \
            --out /tmp/advisory-ingest/alert-run.json
          node scripts/build_alert_snapshot.mjs \
            --in /tmp/advisory-ingest/alert-run.json \
            --out frontend/public/data/alerts-latest.json \
            --allow-empty
          node scripts/build_freshness_artifact.mjs

      - name: Run Pipeline Validation Tests (Tier 0 & Tier 1)
        run: |
          echo "[test] Running advisory pipeline test suite..."
          node --test __tests__/advisoryPipeline.test.js

      - name: Commit updated forecast artifacts
        id: commit-artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/forecasts/ \
                  frontend/public/data/forecasts-latest.json \
                  frontend/public/data/alerts-latest.json \
                  frontend/public/data/freshness.json

          if git diff --staged --quiet; then
            echo "[git] No changes in forecast artifacts. Working tree is clean."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            PREDICTION_DATE=$(node -e "const m = require('./backend/data/forecasts/manifest.json'); console.log(m.prediction_date);")
            git commit -m "chore(advisory): ingest daily forecast run for $PREDICTION_DATE [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "[git] Pushed updated forecast data for $PREDICTION_DATE."
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel Production Deployment
        if: steps.commit-artifacts.outputs.committed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "[deploy] VERCEL_TOKEN unset — relying on GitHub push trigger for deployment."
            exit 0
          fi

          echo "[deploy] Triggering Vercel deployment..."
          npx --yes vercel deploy --prod --token="$VERCEL_TOKEN"

      - name: Dispatch Operational Monitoring & Slack Alert
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/notify_ops.mjs \
            --status="${{ job.status }}" \
            --channel="#hazardnet-ops" \
            --manifest="backend/data/forecasts/manifest.json" \
            --snapshot="frontend/public/data/forecasts-latest.json" \
            --run-url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
