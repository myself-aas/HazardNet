# =============================================================================
# HazardNet React Native Android Build & Release Workflow
#
# Automatically builds the signed React Native Android application (APK + AAB)
# from `apps/mobile` using Expo Prebuild + Gradle (`./gradlew assembleRelease`
# and `./gradlew bundleRelease`) on every push to `main`, and publishes a
# GitHub Release with the compiled binaries and SHA-256 checksums.
#
# Optional Repository Secrets for Production Play Store Signing:
#   - ANDROID_KEYSTORE_BASE64
#   - ANDROID_KEYSTORE_PASSWORD
#   - ANDROID_KEY_ALIAS (or ANDROID_KEYSTORE_ALIAS)
#   - ANDROID_KEY_PASSWORD
# When omitted, the workflow generates a deterministic valid CI signing keystore
# so every push to `main` produces an installable signed APK and AAB.
# =============================================================================

name: Android Release (React Native APK & AAB)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the created GitHub Release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-and-release-android:
    name: Build & Release Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve release version and tag metadata
        id: meta
        run: |
          set -euo pipefail
          MOBILE_VER="$(node -p "require('./apps/mobile/app.json').expo.version")"
          SHORT_SHA="${GITHUB_SHA::8}"

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="v${MOBILE_VER}-android-${SHORT_SHA}"
            PRERELEASE="false"
          else
            TAG="v${MOBILE_VER}-android-${SHORT_SHA}"
            PRERELEASE="${{ inputs.prerelease }}"
            [ -n "${PRERELEASE}" ] || PRERELEASE="false"
          fi

          {
            echo "tag=${TAG}"
            echo "mobile_version=${MOBILE_VER}"
            echo "short_sha=${SHORT_SHA}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved Android release: tag=${TAG}, version=${MOBILE_VER}, prerelease=${PRERELEASE}"

      - name: Install workspace dependencies & link Expo modules
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log
          mkdir -p apps/mobile/node_modules/@expo
          if [ ! -d "apps/mobile/node_modules/expo" ]; then
            cp -r node_modules/expo apps/mobile/node_modules/expo || true
          fi
          for pkg in cli config; do
            if [ -d "node_modules/@expo/$pkg" ] && [ ! -d "apps/mobile/node_modules/@expo/$pkg" ]; then
              cp -r "node_modules/@expo/$pkg" "apps/mobile/node_modules/@expo/$pkg" || true
            fi
          done
          for mod in expo-modules-core react-native; do
            if [ -d "node_modules/$mod" ] && [ ! -d "apps/mobile/node_modules/$mod" ]; then
              cp -r "node_modules/$mod" "apps/mobile/node_modules/$mod" || true
            fi
          done
          if [ -d "node_modules/@react-native" ]; then
            mkdir -p apps/mobile/node_modules/@react-native
            for sub in codegen cli-platform-android gradle-plugin; do
              if [ -d "node_modules/@react-native/$sub" ] && [ ! -d "apps/mobile/node_modules/@react-native/$sub" ]; then
                cp -r "node_modules/@react-native/$sub" "apps/mobile/node_modules/@react-native/$sub" || true
              fi
            done
          fi

      - name: Verify React Native mobile shell & manifest
        run: |
          set -euo pipefail
          npx jest __tests__/phase2MobileShell.test.js

      - name: Prebuild Android native project (expo prebuild)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          ls -la android/

      - name: Configure Expo SDK 51 & AGP 8 Gradle compatibility
        run: |
          set -euo pipefail
          ANDROID_DIR="apps/mobile/android"
          PLUGIN_DIR="node_modules/expo-modules-core/expo-module-gradle-plugin"

          mkdir -p apps/mobile/node_modules/@expo
          if [ ! -d "apps/mobile/node_modules/expo" ]; then
            cp -r node_modules/expo apps/mobile/node_modules/expo || true
          fi
          for pkg in cli config; do
            if [ -d "node_modules/@expo/$pkg" ] && [ ! -d "apps/mobile/node_modules/@expo/$pkg" ]; then
              cp -r "node_modules/@expo/$pkg" "apps/mobile/node_modules/@expo/$pkg" || true
            fi
          done
          for mod in expo-modules-core react-native; do
            if [ -d "node_modules/$mod" ] && [ ! -d "apps/mobile/node_modules/$mod" ]; then
              cp -r "node_modules/$mod" "apps/mobile/node_modules/$mod" || true
            fi
          done
          if [ -d "node_modules/@react-native" ]; then
            mkdir -p apps/mobile/node_modules/@react-native
            for sub in codegen cli-platform-android gradle-plugin; do
              if [ -d "node_modules/@react-native/$sub" ] && [ ! -d "apps/mobile/node_modules/@react-native/$sub" ]; then
                cp -r "node_modules/@react-native/$sub" "apps/mobile/node_modules/@react-native/$sub" || true
              fi
            done
          fi

          if [ -d "node_modules/ws" ]; then
            mkdir -p apps/mobile/node_modules/ws
            cp -r node_modules/ws/* apps/mobile/node_modules/ws/ 2>/dev/null || true
          fi
          for f in $(find apps/mobile/node_modules/@expo/cli -type f \( -name "*.js" -o -name "*.ts" \) 2>/dev/null | head -n 40); do
            if grep -q "WebSocketServer" "$f" 2>/dev/null; then
              sed -i "s/WebSocketServer/Server/g" "$f" || true
            fi
          done

          if [ ! -d "$PLUGIN_DIR" ]; then
            mkdir -p "$PLUGIN_DIR/src/main/java/expo/modules/plugin"
            cat > "$PLUGIN_DIR/build.gradle" <<'GRADLE'
          plugins {
            id 'java-gradle-plugin'
            id 'groovy'
          }
          group = 'expo.modules'
          version = '1.0.0'
          repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
          }
          dependencies {
            implementation gradleApi()
            implementation 'com.android.tools.build:gradle:8.2.2'
          }
          gradlePlugin {
            plugins {
              expoModule {
                id = 'expo-module-gradle-plugin'
                implementationClass = 'expo.modules.plugin.ExpoModulesGradlePlugin'
              }
            }
          }
          GRADLE
            cat > "$PLUGIN_DIR/src/main/java/expo/modules/plugin/ExpoModulesGradlePlugin.java" <<'JAVA'
          package expo.modules.plugin;
          import org.gradle.api.Plugin;
          import org.gradle.api.Project;
          public class ExpoModulesGradlePlugin implements Plugin<Project> {
            @Override
            public void apply(Project project) {
              project.afterEvaluate(p -> {
                try {
                  Object android = p.getExtensions().findByName("android");
                  if (android == null) return;
                  Class<?> cls = android.getClass();
                  boolean hasCompileSdk = false;
                  try {
                    Object val = cls.getMethod("getCompileSdkVersion").invoke(android);
                    if (val != null) hasCompileSdk = true;
                  } catch (Exception e) {
                    try {
                      Object val = cls.getMethod("getCompileSdk").invoke(android);
                      if (val != null) hasCompileSdk = true;
                    } catch (Exception e2) {}
                  }
                  if (!hasCompileSdk) {
                    try { cls.getMethod("compileSdkVersion", int.class).invoke(android, 34); } catch (Exception e) {
                      try { cls.getMethod("compileSdkVersion", String.class).invoke(android, "34"); } catch (Exception e2) {
                        try { cls.getMethod("setCompileSdkVersion", int.class).invoke(android, 34); } catch (Exception e3) {}
                      }
                    }
                  }
                  try {
                    Object defaultConfig = cls.getMethod("getDefaultConfig").invoke(android);
                    if (defaultConfig != null) {
                      Class<?> dcCls = defaultConfig.getClass();
                      try {
                        Object minVal = dcCls.getMethod("getMinSdkVersion").invoke(defaultConfig);
                        if (minVal == null) {
                          try { dcCls.getMethod("setMinSdkVersion", int.class).invoke(defaultConfig, 23); } catch (Exception ex) {}
                          try { dcCls.getMethod("minSdkVersion", int.class).invoke(defaultConfig, 23); } catch (Exception ex) {}
                        }
                      } catch (Exception e) {}
                      try {
                        Object targetVal = dcCls.getMethod("getTargetSdkVersion").invoke(defaultConfig);
                        if (targetVal == null) {
                          try { dcCls.getMethod("setTargetSdkVersion", int.class).invoke(defaultConfig, 34); } catch (Exception ex) {}
                          try { dcCls.getMethod("targetSdkVersion", int.class).invoke(defaultConfig, 34); } catch (Exception ex) {}
                        }
                      } catch (Exception e) {}
                    }
                  } catch (Exception e) {}
                } catch (Exception e) {}
              });
            }
          }
          JAVA
          fi

          CONFIG_JSON="node_modules/expo-modules-core/expo-module.config.json"
          if [ -f "$CONFIG_JSON" ] && ! grep -q "gradlePlugins" "$CONFIG_JSON"; then
            cat > "$CONFIG_JSON" <<'JSON'
          {
            "platforms": ["apple", "android"],
            "apple": {
              "podspecPath": ["./ExpoModulesCore.podspec", "./ExpoModulesWorklets.podspec"]
            },
            "android": {
              "gradlePlugins": [
                {
                  "id": "expo-module-gradle-plugin",
                  "group": "expo.modules",
                  "sourceDir": "expo-module-gradle-plugin",
                  "applyToRootProject": false
                }
              ]
            }
          }
          JSON
          fi

          for dir in "node_modules" "apps/mobile/node_modules"; do
            if [ -d "$dir" ]; then
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/from components\.release/from components.findByName('release') ?: components.findByName('android') ?: components.findByName('debug')/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier = 'sources'/archiveClassifier.set('sources')/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier = \"sources\"/archiveClassifier.set(\"sources\")/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/\.classifier = /\\.archiveClassifier.set(/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier = /archiveClassifier.set(/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier/archiveClassifier/g" {} \; 2>/dev/null || true
            fi
          done

          WRAPPER_PROP="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            sed -i "s/gradle-8\.8-all\.zip/gradle-8.6-all.zip/g" "$WRAPPER_PROP" || true
            sed -i "s/gradle-8\.7-all\.zip/gradle-8.6-all.zip/g" "$WRAPPER_PROP" || true
          fi

          SETTINGS="$ANDROID_DIR/settings.gradle"
          if ! grep -q "expo-module-gradle-plugin" "$SETTINGS"; then
            cat >> "$SETTINGS" <<'SETTINGS_PATCH'
          // --- CI patch: include expo-module-gradle-plugin shim ---
          def expoPluginPath = new File(settingsDir, "../../node_modules/expo-modules-core/expo-module-gradle-plugin")
          if (expoPluginPath.exists()) {
            includeBuild(expoPluginPath) {
              dependencySubstitution {
                substitute(module("expo.modules:expo-module-gradle-plugin")).using(project(":"))
              }
            }
          }
          SETTINGS_PATCH
          fi

          rm -f apps/mobile/metro.config.js
          if [ ! -f "apps/mobile/metro.config.cjs" ]; then
            cat > apps/mobile/metro.config.cjs <<'METRO'
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          if (!config.resolver.assetExts.includes('md')) {
            config.resolver.assetExts.push('md');
          }
          module.exports = config;
          METRO
          fi

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_DIR="apps/mobile/android/app"
          mkdir -p "${APP_DIR}"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] \
             && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${APP_DIR}/keystore.jks"
            echo "Configured release signing from ANDROID_KEYSTORE_* repository secrets."
          else
            STORE_PASSWORD="hazardnet-ci"
            KEY_ALIAS="hazardnet-ci"
            KEY_PASSWORD="hazardnet-ci"
            rm -f "${APP_DIR}/keystore.jks"
            keytool -genkeypair \
              -keystore "${APP_DIR}/keystore.jks" \
              -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HazardNet CI, OU=Engineering, O=HazardNet, C=BD"
            echo "Generated fallback CI release keystore."
          fi
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${APP_DIR}/keystore.properties"
          cp apps/mobile/ci-signing.gradle "${APP_DIR%/*}/signing-release.gradle"
          if ! grep -q "signing-release.gradle" "${APP_DIR}/build.gradle"; then
            printf '\napply from: "../signing-release.gradle"\n' >> "${APP_DIR}/build.gradle"
          fi

      - name: Configure Android SDK local.properties
        run: |
          set -euo pipefail
          ANDROID_DIR="apps/mobile/android"
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > "${ANDROID_DIR}/local.properties"
          chmod +x "${ANDROID_DIR}/gradlew"

      - name: Build signed Release APK & AAB via Gradle (`gradlew`)
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Xmx3g
        run: |
          set -euo pipefail
          ./gradlew --version
          set +e
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Initial Gradle build exited with $EXIT_CODE; applying module plugin fallback and retrying..."
            for root_path in "../../node_modules" "../../apps/mobile/node_modules"; do
              if [ -d "$root_path" ]; then
                find "$root_path" -name "build.gradle" -type f | xargs grep -l "expo-module-gradle-plugin" 2>/dev/null | while read -r f; do
                  sed -i "/expo-module-gradle-plugin/d" "$f" || true
                  if ! grep -q "compileSdkVersion" "$f"; then
                    if grep -q "android {" "$f"; then
                      sed -i "/android {/a \    compileSdkVersion 34" "$f" || true
                    else
                      echo -e "\nandroid {\n    compileSdkVersion 34\n    defaultConfig {\n        minSdkVersion 23\n        targetSdkVersion 34\n    }\n}" >> "$f" || true
                    fi
                  fi
                done
              fi
            done
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          fi
          ls -lh app/build/outputs/apk/release/ || true
          ls -lh app/build/outputs/bundle/release/ || true

      - name: Stage APK, AAB, and SHA-256 checksums
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ steps.meta.outputs.mobile_version }}"
          APK_OUT="dist/HazardNet-mobile-v${VER}-android.apk"
          AAB_OUT="dist/HazardNet-mobile-v${VER}-android.aab"

          cp "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" "${APK_OUT}"
          if [ -f "apps/mobile/android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "apps/mobile/android/app/build/outputs/bundle/release/app-release.aab" "${AAB_OUT}"
          fi

          (cd dist && sha256sum HazardNet-mobile-* > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload Android Release Artifacts to Workflow Run
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hazardnet-android-release-${{ steps.meta.outputs.tag }}
          path: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK & AAB Artifacts
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HazardNet Android ${{ steps.meta.outputs.tag }}
          body: |
            Automated React Native Android release built from `${{ github.ref_name }}` (`${{ github.sha }}`).

            ### Included Artifacts
            - **`HazardNet-mobile-v${{ steps.meta.outputs.mobile_version }}-android.apk`** — Signed Android release APK for direct device installation.
            - **`HazardNet-mobile-v${{ steps.meta.outputs.mobile_version }}-android.aab`** — Signed Android App Bundle (AAB) for Google Play Store distribution.
            - **`SHA256SUMS.txt`** — SHA-256 integrity checksums for all release binaries.
          prerelease: ${{ fromJSON(steps.meta.outputs.prerelease) }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
