name: Supabase cutover verify

on:
  workflow_dispatch:
    inputs:
      boot_server:
        description: 'Boot the backend in supabase mode and smoke the API'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ADR 0002 §Runbook names three artifacts this job was written around:
      #
      #   scripts/db/002_forecasts_supabase.sql      the consolidation schema (RLS:
      #                                              public read, service-role write)
      #   scripts/verify-supabase-cutover.mjs        "the ADR checklist as code"
      #   scripts/migrate-firestore-to-supabase.mjs  the migration dry-run
      #
      # None of the three is in the repository, although scripts/db/README.md lists
      # `002` as step 2 of the apply order and the ADR's verification checklist cites
      # the verifier by name. Dispatching this workflow therefore failed at the first
      # substantive step with `Error: Cannot find module
      # '/home/runner/work/…/scripts/verify-supabase-cutover.mjs'` (exit 1) — which
      # reads like a database or credentials problem and is neither. This step says
      # what is actually missing and stops, so the run cannot be mistaken for a
      # schema failure. The live smoke test below still runs (`!cancelled()`), because
      # it needs neither the schema file nor the verifier: it boots the backend
      # against whatever the database really contains, and that evidence is worth
      # having even while the checklist itself has no code.
      #
      # Closing this is docs/ops/owner-actions.md, Action 14.
      - name: Preflight -- the ADR 0002 cutover artifacts exist
        id: schema
        shell: bash
        run: |
          MISSING=0
          for artifact in \
            scripts/db/002_forecasts_supabase.sql \
            scripts/verify-supabase-cutover.mjs \
            scripts/migrate-firestore-to-supabase.mjs; do
            if [ -f "$artifact" ]; then
              echo "✅ $artifact"
            else
              echo "::error::$artifact is referenced by ADR 0002 and scripts/db/README.md but is not in the repository — the ADR 0002 checklist cannot be verified as code yet (docs/ops/owner-actions.md, Action 14)."
              MISSING=$((MISSING + 1))
            fi
          done
          {
            echo "### ADR 0002 checklist — ${MISSING} artifact(s) missing"
            echo ""
            echo "The schema verifier, the consolidation migration and the Firestore→Supabase"
            echo "dry-run are named by ADR 0002 but were never committed, so this workflow can"
            echo "only run the live smoke test below. See docs/ops/owner-actions.md, Action 14."
          } >> "$GITHUB_STEP_SUMMARY"
          # No verifier is invoked here on purpose. This workflow used to run
          # `node scripts/verify-supabase-cutover.mjs` unconditionally; the file has
          # never existed, so every dispatch died with `Cannot find module` before it
          # reached the database. A step that invokes a script the repository does not
          # have is now a test failure (scripts/tests/test_workflows.py::
          # test_workflows_only_invoke_scripts_that_exist), so the invocation stays out
          # of the file until the script is in it.
          #
          # When scripts/verify-supabase-cutover.mjs lands (Action 14), add the step
          # back between this one and the smoke test:
          #
          #   - name: Verify Supabase schema (ADR 0002 checklist)
          #     env:
          #       DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          #       SUPABASE_SSL: 'true'
          #     run: node scripts/verify-supabase-cutover.mjs
          #
          # and drop `!cancelled()` from the smoke test's `if:` below.
          exit "$MISSING"

      - name: Boot backend (FORECAST_STORE=supabase) and smoke the API
        # `!cancelled()` rather than the default `success()`: the preflight above
        # fails while the ADR 0002 artifacts are missing, and the live smoke test is
        # the one part of this job that still produces real evidence in that state.
        if: ${{ inputs.boot_server && !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SSL: 'true'
          FORECAST_STORE: supabase
          PORT: '3010'
        run: |
          node backend/server.js > server.log 2>&1 &
          echo $! > server.pid

          # Wait for readiness (max ~20s).
          for i in $(seq 1 20); do
            curl -sf http://localhost:3010/health > /dev/null && break
            sleep 1
          done

          echo "── GET /health ──"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3010/health

          echo "── GET /api/v1/forecasts/bulk?horizon=7_days (through the Supabase store) ──"
          curl -s -w "\nHTTP %{http_code}\n" "http://localhost:3010/api/v1/forecasts/bulk?horizon=7_days" | head -c 500
          echo

          echo "── GET /api/v1/forecasts/history (default window) ──"
          curl -s -w "\nHTTP %{http_code}\n" "http://localhost:3010/api/v1/forecasts/history" | head -c 300
          echo

          echo "── GET /metrics — forecast freshness gauge ──"
          curl -s http://localhost:3010/metrics | grep -A1 hazardnet_forecast_age_hours || echo "(gauge absent — empty store, expected pre-first-run)"

          echo "── Server config log ──"
          grep -E "\[config\]|forecastStore" server.log | head -10 || true

          # Hard gate: the bulk serving path must return 200 through Supabase.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3010/api/v1/forecasts/bulk?horizon=7_days")
          if [ "$CODE" != "200" ]; then
            echo "❌ /bulk returned HTTP $CODE through the Supabase store — see server.log below"
            tail -30 server.log
            kill $(cat server.pid) 2>/dev/null || true
            exit 1
          fi

          kill $(cat server.pid) 2>/dev/null || true
          echo "✅ Supabase cutover smoke passed (health/bulk/history/metrics)"
