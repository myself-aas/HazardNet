name: Publish Daily District Advisories

on:
  # Kaggle has no GitHub completion webhook. Poll its public dataset for a new
  # Ready version; only a matching UTC notebook run file unlocks publication.
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-public-advisories-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public site
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python for bounded archive reads
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install site dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Poll a Ready Kaggle dataset version
        id: fetch
        shell: bash
        env:
          # Optional for a public dataset; a Kaggle 403 fails without publishing.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if node scripts/fetch_kaggle_daily_public.mjs --out /tmp/hazardnet-daily-public; then
            echo 'new=true' >> "$GITHUB_OUTPUT"
            echo 'New Ready Kaggle version with a matching UTC notebook run record.' >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo 'new=false' >> "$GITHUB_OUTPUT"
              echo 'No new Ready dataset version; public site unchanged.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '::error::Kaggle daily dataset or UTC run record could not be verified; the public site was not updated.'
              exit "$code"
            fi
          fi

      - name: Build and check the public-only projection
        if: steps.fetch.outputs.new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat /tmp/hazardnet-daily-public/dataset-version.txt)
          [[ "$VERSION" =~ ^[1-9][0-9]*$ ]]
          node scripts/build_public_daily_advisories.mjs \
            --input /tmp/hazardnet-daily-public/hazardnet_advisories_latest.csv \
            --manifest /tmp/hazardnet-daily-public/hazardnet_advisories_latest.run.json \
            --output frontend/public/data/daily-advisories-v1.json \
            --automated-publish --dataset-version "$VERSION"
          node scripts/check_public_daily_asset.mjs --require
          npx jest --ci --runInBand --silent \
            __tests__/dailyAdvisoryPublic.test.js \
            __tests__/kaggleDailyPublic.test.js \
            frontend/src/lib/__tests__/dailyAdvisories.test.ts
          npm run build
          npm run audit:pages:strict
          cmp frontend/public/data/daily-advisories-v1.json dist/data/daily-advisories-v1.json
          # The original technical CSV and run JSON never enter the public site,
          # an Actions artifact, a cache or Git. Only the whitelisted JSON is staged.
          test ! -e dist/data/hazardnet_advisories_latest.csv
          test ! -e dist/data/hazardnet_advisories_latest.run.json

      - name: Commit only the public result
        id: commit
        if: steps.fetch.outputs.new == 'true'
        shell: bash
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then
            echo '::error::CF_PAGES_DEPLOY_HOOK is unset; no commit is made because there is no configured path to the live site.'
            exit 1
          fi
          git add -- frontend/public/data/daily-advisories-v1.json
          if git diff --cached --quiet; then
            echo '::error::A new Kaggle run produced no new public result; refusing a misleading successful update.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(advisory): publish daily district outlook [skip ci]"
          git push origin HEAD:main
          echo 'committed=true' >> "$GITHUB_OUTPUT"
          echo 'Public-only advisory committed; starting the Pages deployment.' >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Cloudflare Pages build
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          HTTP=$(curl -fsS -o /tmp/hazardnet-pages-hook.txt -w '%{http_code}' \
            -X POST "$CF_PAGES_DEPLOY_HOOK" -H 'Content-Type: application/json' --data '{}' \
            --retry 3 --retry-delay 10 --retry-connrefused --max-time 30) || HTTP=000
          case "$HTTP" in
            2??)
              echo 'Cloudflare Pages accepted the build trigger; deployment success still needs a live check.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::The public-only commit succeeded, but Pages did not accept the deployment trigger (HTTP $HTTP). Check the Pages dashboard."
              exit 1
              ;;
          esac
