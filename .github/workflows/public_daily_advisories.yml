name: Publish Daily District Advisories

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch: {}
  push:
    branches: [arena/58cfa6c2-hazardnet]
    paths: ['.github/workflows/public_daily_advisories.yml']

concurrency:
  group: daily-public-advisories-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public site
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python for bounded archive reads
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install site dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Poll a Ready Kaggle dataset version
        id: fetch
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if node scripts/fetch_kaggle_daily_public.mjs --out /tmp/hazardnet-daily-public; then
            echo 'new=true' >> "$GITHUB_OUTPUT"
            echo 'New Ready Kaggle daily dataset version fetched and verified.' >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo 'new=false' >> "$GITHUB_OUTPUT"
              echo 'No new Ready dataset version; public site unchanged.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '::error::Kaggle daily dataset could not be verified; the public site was not updated.'
              exit "$code"
            fi
          fi

      - name: Build daily snapshot and synchronize website forecast artifacts
        if: steps.fetch.outputs.new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat /tmp/hazardnet-daily-public/dataset-version.txt)
          [[ "$VERSION" =~ ^[1-9][0-9]*$ ]]
          node scripts/build_public_daily_advisories.mjs \
            --input /tmp/hazardnet-daily-public/hazardnet_advisories_latest.csv \
            --manifest /tmp/hazardnet-daily-public/hazardnet_advisories_latest.run.json \
            --output frontend/public/data/daily-advisories-v1.json \
            --automated-publish --dataset-version "$VERSION"
          node scripts/check_public_daily_asset.mjs --require
          SNAPSHOT_SOURCE="Kaggle_Daily_Advisory (public_daily_advisories.yml, dataset v$VERSION)" \
            node scripts/sync_daily_to_forecasts.mjs \
              --from-daily-json frontend/public/data/daily-advisories-v1.json
          node scripts/capture_edge_fixtures.mjs
          npx jest --ci --runInBand --silent \
            __tests__/dailyAdvisoryPublic.test.js \
            __tests__/kaggleDailyPublic.test.js \
            frontend/src/lib/__tests__/dailyAdvisories.test.ts
          npm run build
          npm run audit:pages:strict
          cmp frontend/public/data/daily-advisories-v1.json frontend/dist/data/daily-advisories-v1.json
          cmp frontend/public/data/forecasts-latest.json frontend/dist/data/forecasts-latest.json
          cmp frontend/public/data/alerts-latest.json frontend/dist/data/alerts-latest.json
          test ! -e frontend/dist/data/hazardnet_advisories_latest.csv
          test ! -e frontend/dist/data/hazardnet_advisories_latest.run.json

      - name: Upload validated public daily snapshot artifact on PR branches
        if: steps.fetch.outputs.new == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: daily-advisories-public-v1
          path: frontend/public/data/daily-advisories-v1.json
          retention-days: 1

      - name: Commit synchronized public snapshots
        id: commit
        if: steps.fetch.outputs.new == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            frontend/public/data/daily-advisories-v1.json \
            frontend/public/data/forecasts-latest.json \
            frontend/public/data/alerts-latest.json \
            frontend/public/data/hazardnet_forecasts_latest.json \
            frontend/public/data/climatic_hazards_summary.json \
            frontend/public/data/freshness.json \
            frontend/public/data/content-index.json \
            frontend/src/content/generated-routes.json \
            frontend/src/data/backendForecasts.json \
            backend/data/forecasts/hazardnet_forecasts_latest.csv \
            backend/data/forecasts/hazardnet_forecasts_latest.json \
            backend/data/forecasts/manifest.json \
            __tests__/fixtures/alertsSnapshot.js \
            __tests__/fixtures/forecastsSnapshot.js \
            __tests__/fixtures/telemetryBatch.js \
            __tests__/fixtures/weatherFullObject.js
          if git diff --cached --quiet; then
            echo '::error::A new Kaggle run produced no new public result; refusing a misleading successful update.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(advisory): publish daily Kaggle advisories and forecast snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'committed=true' >> "$GITHUB_OUTPUT"
          echo "Synchronized daily and forecast snapshots committed to ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Cloudflare Pages deploy hook if configured
        if: steps.commit.outputs.committed == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then
            echo 'CF_PAGES_DEPLOY_HOOK not set; relying on Cloudflare Pages Git branch integration.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          HTTP=$(curl -fsS -o /tmp/hazardnet-pages-hook.txt -w '%{http_code}' \
            -X POST "$CF_PAGES_DEPLOY_HOOK" -H 'Content-Type: application/json' --data '{}' \
            --retry 3 --retry-delay 10 --retry-connrefused --max-time 30) || HTTP=000
          case "$HTTP" in
            2??)
              echo 'Cloudflare Pages accepted the build trigger.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::warning::Pages deploy hook answered HTTP $HTTP; check Cloudflare Pages Git deployment status."
              ;;
          esac
