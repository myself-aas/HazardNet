name: Firebase Store Verify

# ─────────────────────────────────────────────────────────────────────────────
# Firebase is HazardNet's single database (Firestore forecast store, profiles,
# assessments, connectors, blog articles, alerts). This workflow is the
# "other store is gone" gate: it proves the backend boots against the real
# Firebase project and that the serving paths that used to fork between two
# stores (`FORECAST_STORE=…`) now serve strictly out of the forecast store.
#
# It replaces the removed cutover-verify workflow, which expected schema and
# migration artifacts (`scripts/db/002_forecasts_*.sql`, a verifier and a
# migration dry-run) that were never committed and so failed every dispatch
# on a missing file. That workflow no longer exists — its scope (a second
# database) is the opposite of this repository's direction.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-store-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Boot backend (Firestore forecast store) and smoke the API
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          PORT: '3010'
        run: |
          node backend/server.js > server.log 2>&1 &
          echo $! > server.pid

          # Wait for readiness (max ~30s).
          for i in $(seq 1 30); do
            curl -sf http://localhost:3010/health > /dev/null && break
            sleep 1
          done

          echo "── GET /health ──"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3010/health

          echo "── GET /api/v1/forecasts/bulk?horizon=7_days (through the Firestore store) ──"
          curl -s -w "\nHTTP %{http_code}\n" "http://localhost:3010/api/v1/forecasts/bulk?horizon=7_days" | head -c 500
          echo

          echo "── GET /api/v1/forecasts/history (default window) ──"
          curl -s -w "\nHTTP %{http_code}\n" "http://localhost:3010/api/v1/forecasts/history" | head -c 300
          echo

          echo "── GET /metrics — forecast freshness gauge ──"
          curl -s http://localhost:3010/metrics | grep -A1 hazardnet_forecast_age_hours || echo "(gauge absent — empty store, expected pre-first-run)"

          echo "── Store mode the backend selected ──"
          grep -E "\[config\]" server.log | head -10 || true

          # Hard gate: the bulk serving path must return 200 through Firestore.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3010/api/v1/forecasts/bulk?horizon=7_days")
          if [ "$CODE" != "200" ]; then
            echo "❌ /bulk returned HTTP $CODE through the Firestore store — see server.log below"
            tail -30 server.log
            kill $(cat server.pid) 2>/dev/null || true
            exit 1
          fi

          kill $(cat server.pid) 2>/dev/null || true
          echo "✅ Firebase store smoke passed (health/bulk/history/metrics)"
