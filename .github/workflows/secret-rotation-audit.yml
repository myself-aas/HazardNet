name: Secret rotation audit

# Owner Action 1 (`docs/ops/owner-actions.md`): no credential in this project had a
# rotation cadence, and the secrets-audit workflow is dispatch-only, so nothing ever
# reminded anyone. This job reads data/security/secret-rotation.json on a schedule and
# fails when a credential is past its cadence.
#
# It reads no secret values — only the dates recorded in the register.

on:
  schedule:
    # 07:15 UTC on the first of every month.
    - cron: '15 7 1 * *'
  workflow_dispatch:

concurrency:
  group: secret-rotation-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Check rotation dates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Report rotation state
        id: report
        run: |
          set -uo pipefail
          node scripts/check-secret-rotation.mjs | tee rotation-report.txt
          echo "status=$?" >> "$GITHUB_OUTPUT" || true

      - name: Fail if a credential is past due
        run: |
          set -euo pipefail
          # Unknown dates are warnings until the register has been filled in once; see
          # docs/ops/secret-rotation.md ("Recording a rotation", step 5) for the point at
          # which this should become `--strict`.
          node scripts/check-secret-rotation.mjs

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-rotation-report
          path: rotation-report.txt
          if-no-files-found: warn
