name: HazardNet Daily Forecast Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# THE production forecast pipeline (MLOps Profile 1). It generates the
# forecast ON THE RUNNER — no Kaggle, no notebook scheduler, no kernel slug:
#
#   scripts/auto_forecast.py     GEE satellite imagery + Open-Meteo forecasts
#                                → TFLite inference (tflite-runtime + cv2)
#                                → hazardnet_forecasts_latest.csv
#   scripts/publish_forecast_csv.py
#                                → backend/data/forecasts/*.csv|json + manifest
#   scripts/build_forecast_snapshot.mjs
#                                → frontend/public/data/forecasts-latest.json
#   commit                       → the website redeploys carrying the new data
#
# The three Kaggle-backed workflows (forecast-pipeline, hourly_forecast,
# weekly_forecast) lost their schedules on 2026-09-16 and are dispatch-only
# legacy: they need a live Kaggle token + kernel and produced red runs for days
# while this path needed only the GEE service account. See
# docs/mlops/ARCHITECTURE.md ("Why this is better than the all-Kaggle setup").
#
# Delivery is the committed snapshot by default (the production deployment
# serves the SPA + bundled snapshot). Set the repository VARIABLE
# `PUSH_TO_API=true` once an ingest API is deployed to also POST the CSV to
# `HAZARDNET_API_URL` — that push is then a hard gate.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC (06:00 Bangladesh time)
  workflow_dispatch: # Manual trigger for debugging

concurrency:
  group: daily-forecast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commits the refreshed CSV + snapshot

env:
  # Stream Python stdout line-by-line. During the 2026-09-17 zero-rows incident
  # the block-buffered output flushed only at exit, so every "Processing X..."
  # line carried the final-flush timestamp and the real error ordering was
  # unrecoverable from the log.
  PYTHONUNBUFFERED: '1'
  SNAPSHOT_SOURCE: 'github-actions: scripts/auto_forecast.py (GEE + Open-Meteo + TFLite)'
  # Only push to an ingest API when one is known to be deployed; otherwise the
  # generator runs artifact-only and the site is served by the committed
  # snapshot (see docs/ops/owner-actions.md §2a-bis for the deployment state).
  PUSH_TO_API: ${{ vars.PUSH_TO_API || 'false' }}

jobs:
  run-forecast:
    name: Generate forecasts on the runner + publish
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-inference.txt

      - name: Set up Node.js
        # The snapshot/policy scripts have zero npm dependencies, but the content
        # rebuild below runs the real build (engine -> vite -> prerender) so the
        # committed content pages and the content index are refreshed together —
        # see the "Rebuild generated content pages and the content index" step.
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Optimized Dependencies
        run: pip install -r scripts/requirements-inference.txt

      - name: Install workspace dependencies
        # Root install: `frontend/` is an npm workspace, so this is what gives the
        # build below its toolchain (vite, the prerenderer's deps).
        run: npm ci --no-audit --no-fund

      - name: Preflight -- verify required secrets
        shell: bash
        run: |
          missing=0
          # Earth Engine is the one credential this pipeline cannot avoid: it
          # is the satellite data source (Kaggle is not involved at all).
          if [ -z "$EE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::'EE_SERVICE_ACCOUNT_JSON' is not configured (repo -> Settings -> Secrets and variables -> Actions). It is required: scripts/auto_forecast.py authenticates to Google Earth Engine with it."
            missing=1
          fi
          if [ "$PUSH_TO_API" = "true" ]; then
            for var in HAZARDNET_API_URL HAZARDNET_API_KEY; do
              if [ -z "${!var}" ]; then
                echo "::error::'$var' is not configured but the PUSH_TO_API repository variable is 'true'. Set both, or set PUSH_TO_API=false to publish through the committed snapshot only."
                missing=1
              fi
            done
            case "$HAZARDNET_API_URL" in
              http://*|https://*) ;;
              *) echo "::error::HAZARDNET_API_URL does not start with http(s)://: $HAZARDNET_API_URL"; missing=1 ;;
            esac
          else
            echo "ℹ️ PUSH_TO_API=$PUSH_TO_API — generating artifacts only (no API POST)."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ Required secrets present."
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          HAZARDNET_API_URL: ${{ secrets.HAZARDNET_API_URL }}
          HAZARDNET_API_KEY: ${{ secrets.HAZARDNET_API_KEY }}

      # `scripts/auto_forecast.py` calls `ee.Initialize()` at import time with no
      # handler around it, so a rotated, truncated or mistyped service-account key
      # surfaces as a bare Python traceback about a minute into a scheduled run —
      # which is what the 2026-09-19 02:00 UTC run produced (failed in 1m46s at
      # this step, after a 16-minute run had got all the way to publishing the day
      # before). The step above only proves the secret is non-empty; this one
      # proves it authenticates, names the cause, and costs ~10 seconds.
      - name: Preflight -- Earth Engine credential authenticates
        shell: bash
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_SERVICE_ACCOUNT_EMAIL: ${{ vars.EE_SERVICE_ACCOUNT_EMAIL || '' }}
        run: |
          python - <<'PY'
          import json, os, sys, tempfile

          raw = (os.environ.get('EE_SERVICE_ACCOUNT_JSON') or '').strip()
          try:
              key = json.loads(raw)
          except ValueError as exc:
              print(f"::error::EE_SERVICE_ACCOUNT_JSON is not valid JSON ({exc}). "
                    "Re-paste the complete service-account key file into the repository secret "
                    "(docs/ops/owner-actions.md, Action 1b).")
              sys.exit(1)

          required = ('type', 'project_id', 'private_key_id', 'private_key', 'client_email', 'token_uri')
          missing = [field for field in required if not key.get(field)]
          if key.get('type') != 'service_account' or missing:
              print(f"::error::EE_SERVICE_ACCOUNT_JSON is not a complete service-account key "
                    f"(type={key.get('type')!r}, missing={missing or 'none'}). Regenerate it in "
                    "GCP -> IAM & Admin -> Service accounts -> Keys, then update the secret.")
              sys.exit(1)

          email = (os.environ.get('EE_SERVICE_ACCOUNT_EMAIL') or '').strip() or key['client_email']
          if email != key['client_email']:
              print(f"::error::EE_SERVICE_ACCOUNT_EMAIL ({email}) does not match the key's "
                    f"client_email ({key['client_email']}) — the variable and the secret describe "
                    "two different service accounts, so Earth Engine would reject the pair.")
              sys.exit(1)

          path = None
          try:
              import ee
              with tempfile.NamedTemporaryFile('w', suffix='.json', delete=False) as handle:
                  handle.write(raw)
                  path = handle.name
              ee.Initialize(ee.ServiceAccountCredentials(email, path))
              # Initialize can be lazy; one trivial authenticated call proves the token
              # exchange actually worked rather than failing 19 minutes in.
              ee.Number(1).getInfo()
          except Exception as exc:  # noqa: BLE001 - reported as the owner action it is
              print(f"::error::Earth Engine rejected the credential for {email}: "
                    f"{type(exc).__name__}: {str(exc)[:400]}. Rotate the key and confirm the "
                    "account has Earth Engine API access (docs/ops/owner-actions.md, Action 1b).")
              sys.exit(1)
          finally:
              if path:
                  try:
                      os.remove(path)
                  except OSError:
                      pass

          print(f"✅ Earth Engine authenticated as {email} (project {key['project_id']})")
          PY

      - name: Execute pipeline (GEE + Open-Meteo + TFLite inference)
        # ~19 min: GEE imagery + Open-Meteo per district, then TFLite inference
        # for the 7-day and 15-day horizons. Writes hazardnet_forecasts_latest.csv
        # into the workspace. HAZARDNET_API_URL/KEY are passed only when
        # PUSH_TO_API=true; the script then POSTs the CSV and fails the job if
        # the ingest is rejected.
        #
        # The output is tee'd to a file and its tail copied into the job summary:
        # Actions log storage is a separate blob host from the API, so a failure
        # diagnosed from `gh run view` alone shows the exit code but not the
        # traceback that explains it. The summary travels with the run page.
        shell: bash
        env:
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          EE_SERVICE_ACCOUNT_EMAIL: ${{ vars.EE_SERVICE_ACCOUNT_EMAIL || '' }}
          HAZARDNET_API_URL: ${{ vars.PUSH_TO_API == 'true' && secrets.HAZARDNET_API_URL || '' }}
          HAZARDNET_API_KEY: ${{ vars.PUSH_TO_API == 'true' && secrets.HAZARDNET_API_KEY || '' }}
        run: |
          # `shell: bash` on a Linux runner means `bash -eo pipefail`, so a
          # non-zero python would abort the step at the pipeline and the summary
          # block below would never run. errexit is lifted for the pipeline only,
          # and the generator's own status is taken from PIPESTATUS (tee always
          # succeeds, so $? would report the wrong thing).
          set +e
          python scripts/auto_forecast.py 2>&1 | tee auto-forecast.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            {
              echo ""
              echo "#### Generator failure — last 40 lines of \`scripts/auto_forecast.py\`"
              echo ""
              echo '```'
              tail -n 40 auto-forecast.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::scripts/auto_forecast.py exited ${STATUS}. The tail of its output is in the job summary; the full log is the auto-forecast.log entry of the daily-forecast-output artifact."
          fi
          exit "$STATUS"

      - name: Publish CSV to the pipeline paths
        id: publish
        shell: bash
        run: |
          # --run-report is mandatory: it carries the coverage tally (how many of
          # the requested district x horizon units were actually produced), the
          # model provenance and the scene-manifest block (the per-row
          # dataset_version). Without it a partial run would ship looking complete
          # — the defect fixed on 2026-09-17 — and a run whose lineage failed would
          # ship rows that cannot name their inputs (PRODUCT_SPEC §5.8).
          python scripts/publish_forecast_csv.py \
            --csv hazardnet_forecasts_latest.csv \
            --run-report hazardnet_run_report.json \
            --source "$SNAPSHOT_SOURCE" | tee publish.log
          CHANGED=$(grep -oE 'CHANGED=(true|false)' publish.log | tail -n 1 | cut -d= -f2)
          echo "changed=${CHANGED:-true}" >> "$GITHUB_OUTPUT"

      - name: Run the alert engine (§1.3 levels, §1.6 gate)
        id: alerts
        env:
          HAZARDNET_API_KEY: ${{ secrets.HAZARDNET_API_KEY }}
          BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
        run: |
          # The engine lives behind /api/v1/alerts/run (backend/routes/alerts.js):
          # it assesses the latest stored rows, auto-publishes at or below WATCH, and
          # queues anything above it for a named duty officer. Nothing above WATCH can
          # be published by this step, by construction.
          if [ -z "$HAZARDNET_API_KEY" ] || [ -z "$BACKEND_API_URL" ]; then
            echo "::notice::alert engine skipped: HAZARDNET_API_KEY (secret) and BACKEND_API_URL (variable) are not both set"
            exit 0
          fi
          # include_alerts: true is load-bearing. Without it the route strips
          # `batch.alerts` (it answers with `alerts_omitted`) and the snapshot step below
          # has no rows to read — which is exactly how the first version of this wiring
          # would have published "no alerts" every night while alerts existed.
          curl -sS -f -X POST "$BACKEND_API_URL/api/v1/alerts/run" \
            -H "Authorization: Bearer $HAZARDNET_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"notify": true, "include_alerts": true}' -o alert-run.json
          jq -r '"alert engine: rows=" + (.rows|tostring) + " published=" + (.persisted.published|tostring) + " pending_review=" + (.persisted.pending_review|tostring) + " blocked=" + (.persisted.blocked|tostring) + " published_rows=" + ((.published_alerts // [])|length|tostring) + " levels=" + (.batch.counts|tojson)' alert-run.json | tee -a "$GITHUB_STEP_SUMMARY"
          # Fail here, not later, if the report does not carry the rows the snapshot
          # needs: a stripped report must never be read as "nothing to publish".
          # NOTE: this line once ended with a stray unbalanced double quote
          # (`… exit 1; }"`), which is a bash *syntax* error at end-of-input. The
          # step still exited 0 on every run because the credential guard above
          # returns before bash parses this far — so the defect only arms itself on
          # the first run where HAZARDNET_API_KEY and BACKEND_API_URL are both set,
          # i.e. exactly when the alert engine is supposed to work. Guarded by
          # scripts/tests/test_workflows.py::test_every_run_block_is_valid_shell.
          jq -e 'has("published_alerts") or has("alerts") or (.batch.alerts | type == "array")' alert-run.json > /dev/null \
            || { echo "::error::alert run report carries no alert rows (published_alerts/alerts/batch.alerts all absent) — the snapshot cannot be built from it"; exit 1; }

      - name: Upload the alert run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alert-run
          path: alert-run.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Rebuild the alert snapshot (offline fallback for /alerts)
        shell: bash
        run: |
          # The alert page must render when the API is unreachable and on the first
          # paint of a fresh deploy, so the run's output is committed as a static
          # snapshot. The builder only carries PUBLISHED rows, stamps the §1.7
          # disclaimer on any row missing it, and refuses (exit 3) to replace a
          # non-empty snapshot with an empty one — a failed run must not read as
          # "all clear". Re-run with --allow-empty when the quiet result is real.
          if [ ! -f alert-run.json ]; then
            echo "::notice::alert snapshot not rebuilt: the alert engine did not run in this workflow"
            exit 0
          fi
          node scripts/build_alert_snapshot.mjs \
            --in alert-run.json \
            --out frontend/public/data/alerts-latest.json

      - name: Validate forecast data
        # Includes the coverage gate: the manifest must account for every
        # requested unit, and a partial run must say so.
        shell: bash
        run: python scripts/validate_forecasts.py --manifest backend/data/forecasts/manifest.json

      - name: Rebuild website snapshot
        shell: bash
        env:
          # The snapshot carries the run's coverage tally, provenance and lineage;
          # without the run report it can only report what the CSV itself proves,
          # and without the scene manifest it must say the rows' inputs are unnamed.
          SNAPSHOT_RUN_REPORT: hazardnet_run_report.json
          SCENE_MANIFEST: hazardnet_scene_manifest.json
        run: node scripts/build_forecast_snapshot.mjs

      # Phase 7: the freshness artifact quotes the snapshot and the manifest, so it is
      # rebuilt in the same run that rewrites them — a status page derived from yesterday's
      # inputs would be the exact lie it exists to prevent.
      - name: Rebuild freshness artifact
        shell: bash
        run: node scripts/build_freshness_artifact.mjs

      # Phase 8: the content engine's pages are derived from the snapshot above, so they are
      # rebuilt in the same run that rewrites it. A district page quoting yesterday's run is the
      # same class of lie the freshness artifact exists to prevent.
      # The full build, not just the engine: `npm run build` regenerates
      # `frontend/src/content/generated-routes.json` from the snapshot this run just
      # published and then prerenders every route, which is what rewrites the committed
      # `frontend/public/data/content-index.json` (and the served `dist/` copy). Both are
      # staged by the commit step below, so the repository can never carry pages or an
      # inventory that describe a different snapshot than the one published here.
      - name: Rebuild generated content pages and the content index
        shell: bash
        run: npm run build:frontend

      - name: Commit refreshed data
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/forecasts/ frontend/public/data/forecasts-latest.json
          # The derived status artifact travels with the data it describes (Phase 7).
          git add frontend/public/data/freshness.json
          # Content engine output (Phase 8): the generated pages plus the committed index of
          # what the build published. `--check` in CI fails if they stop matching the snapshot.
          git add frontend/src/content/generated-routes.json
          git add frontend/public/data/content-index.json
          # Only stages the alert snapshot when the builder actually produced one;
          # `git add` on a missing path would fail the whole commit step.
          if [ -f frontend/public/data/alerts-latest.json ]; then
            git add frontend/public/data/alerts-latest.json
          fi
          if git diff --staged --quiet; then
            echo "ℹ️ Forecast data unchanged since the last run — nothing to commit."
            exit 0
          fi
          PREDICTION_DATE=$(jq -r '.prediction_date // "unknown"' backend/data/forecasts/manifest.json)
          ROW_COUNT=$(jq -r '.row_count // 0' backend/data/forecasts/manifest.json)
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git commit -m "chore(data): daily forecast refresh ${PREDICTION_DATE}" \
            -m "Source: scripts/auto_forecast.py on GitHub Actions (GEE + Open-Meteo + TFLite)" \
            -m "Rows: ${ROW_COUNT} | Generators: .github/workflows/daily_forecast.yml" \
            -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          # An explicit refspec, not a bare `git push`: with no upstream configured — and
          # whenever the checkout is not sitting on a local branch — git dies with exit 128
          # and the only thing the run reports is "Process completed with exit code 128",
          # which is how hindcast.yml failed on 2026-09-19 (run 35430992137) after every
          # scoring step had passed. The summary block below makes the next one legible:
          # branch state, the last commits and the remote answer for themselves.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            {
              echo '#### The daily forecast commit could not be pushed'
              echo '```'
              git status --short --branch
              git log --oneline -3
              git remote -v
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the bot commit is local only — nothing was published to ${GITHUB_REF_NAME}. The job summary says whether the push was rejected (branch protection, read-only token) or the ref did not resolve."
            exit 1
          fi

      - name: Upload forecast artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-forecast-output
          path: |
            auto-forecast.log
            hazardnet_forecasts_latest.csv
            hazardnet_run_report.json
            hazardnet_scene_manifest.json
            publish.log
            backend/data/forecasts/manifest.json
            frontend/public/data/forecasts-latest.json
            frontend/public/data/alerts-latest.json
            frontend/public/data/freshness.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Daily forecast pipeline — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- generator: \`scripts/auto_forecast.py\` (GEE + Open-Meteo + TFLite) on the runner — no Kaggle"
            echo "- publish: \`scripts/publish_forecast_csv.py\` (changed: ${{ steps.publish.outputs.changed || 'n/a' }})"
            echo "- delivery: committed snapshot \`frontend/public/data/forecasts-latest.json\`"
            if [ -f frontend/public/data/alerts-latest.json ]; then
              echo "- alerts snapshot: $(jq -r '(.alerts|length)|tostring' frontend/public/data/alerts-latest.json) published row(s) committed, schema $(jq -r '.schema' frontend/public/data/alerts-latest.json)"
            fi
            if [ -f alert-run.json ]; then
              echo "- alerts: levels \`$(jq -c '.batch.counts' alert-run.json)\` — published $(jq -r '.persisted.published' alert-run.json), pending review $(jq -r '.persisted.pending_review' alert-run.json), blocked $(jq -r '.persisted.blocked // 0' alert-run.json)"
            else
              echo "- alerts: not run (see the alert engine step notice)"
            fi
            echo "- API push: PUSH_TO_API=$PUSH_TO_API"
            if [ -f backend/data/forecasts/manifest.json ]; then
              jq -r '"- prediction_date: " + (.prediction_date // "unknown") + "\n- rows: " + ((.row_count // 0) | tostring) + "\n- source: " + (.source // "unknown")' backend/data/forecasts/manifest.json
              jq -r '"- coverage: " + ((.coverage.produced_units // 0) | tostring) + "/" + ((.coverage.requested_units // 0) | tostring) + " units (" + (.coverage_status // "unknown") + "), districts: " + ((.coverage.districts_with_any_horizon // 0) | tostring) + "\n- model: " + (.model_version // "unrecorded") + "\n- soil channels fabricated: " + ((.soil_channels_fabricated // false) | tostring) + "\n- dataset_version: " + (.dataset_version // "unrecorded") + " (" + ((.scene_manifest.rows_stamped // 0) | tostring) + " rows carry a scene version, scenes_enumerated=" + ((.scene_manifest.scenes_enumerated // false) | tostring) + ")"' backend/data/forecasts/manifest.json
              if [ "$(jq -r '.coverage_status // "unknown"' backend/data/forecasts/manifest.json)" != "complete" ]; then
                echo "- ⚠️ partial run: districts missing a forecast are labelled as baseline on the site" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily forecast pipeline failed -- the site keeps serving the last committed snapshot. The generator now fails fast with the real cause in the 'Execute pipeline' step (GEE/Open-Meteo availability, credentials, or a schema change in scripts/auto_forecast.py); the publish sanity check no longer masks it."
