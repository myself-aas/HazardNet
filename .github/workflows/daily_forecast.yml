name: HazardNet Daily Kaggle Sync (forecast + dataset metadata)

# ─────────────────────────────────────────────────────────────────────────────
# THE production data pipeline (MLOps Profile 1). Nothing here generates a
# forecast: the generating is done on Kaggle, on Kaggle's own daily schedule, by
# the notebook this repository keeps a copy of —
#
#   ml/hazardnet-auto-forecast-pipeline.ipynb
#     Earth Engine imagery + Open-Meteo drivers + the deployed TFLite model
#     → /kaggle/working/hazardnet_advisories_latest.csv
#
# Kaggle is where the Earth Engine service account is attached
# (`ashifahmedshuvo/ee-token-json`), so it is the only place in this pipeline that
# can read satellite imagery. This job fetches what that run produced, translates
# it into the repository's canonical row schema, validates it, rebuilds every
# derived artifact that quotes it, and commits:
#
#   scripts/fetch_kaggle_forecast.py       kernel output → canonical CSV/JSON + manifest
#   scripts/validate_forecasts.py          schema, bounds, and a ≤3-day freshness gate
#   scripts/fetch_kaggle_dataset_meta.py   the dataset builder's normalization + config,
#                                          and how far they have drifted from the model
#   scripts/build_forecast_snapshot.mjs    → frontend/public/data/forecasts-latest.json
#   scripts/build_freshness_artifact.mjs   → frontend/public/data/freshness.json
#   npm run build:frontend                 → the generated pages + the content index
#   commit                                 → the website redeploys carrying the new data
#
# WHY NOT GENERATE ON THE RUNNER
# `scripts/auto_forecast.py` did exactly that (GEE + Open-Meteo + TFLite, ~19 min)
# and was this workflow's engine until 2026-09-20. It needed an Earth Engine
# service-account key in GitHub secrets, and when that key rotated the run died one
# minute in with a bare traceback — after which the site silently served the last
# committed snapshot. It is still in the repository, still tested, and still
# runnable by hand (`python scripts/auto_forecast.py`) as the path that does not
# depend on Kaggle; it is no longer on a schedule, because two generators for one
# artifact means the committed rows depend on which job won. The owner's decision,
# 2026-09-20: Kaggle produces, Actions publishes.
#
# DELIVERY is the committed snapshot (the production deployment serves the SPA plus
# the bundled snapshot). The store ingest below is skipped, with a notice, unless
# BACKEND_API_KEY is set.
#
# THE OTHER FORECAST WORKFLOWS
#   forecast-pipeline.yml        dispatch: *trigger* a Kaggle run, wait, then pull
#   weekly_forecast.yml          dispatch: trigger + pull + cut a patch release
#   manual_forecast_ingest.yml   dispatch: publish a hand-run CSV, no Kaggle API
# `hourly_forecast.yml` was deleted on 2026-09-20: polling an output that is
# produced once a day cannot find anything new, and everything it did — fetch,
# validate, snapshot, ingest, commit — is this job.
# Triage for a red Kaggle step: docs/ops/kaggle-pipeline-triage.md
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Midnight UTC (06:00 Bangladesh). Deliberately the schedule this workflow has
    # always kept: if Kaggle's own daily run lands later in the day, this pull
    # publishes the previous run's rows — still inside the freshness gate below, and
    # still a real forecast rather than a stale one silently re-dated. Move the cron
    # to sit after the Kaggle schedule when the two are known; the recency step in
    # the summary says which day the rows came from.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Rebuild and commit even when the notebook output is unchanged'
        required: false
        default: 'false'
      require_dataset_meta:
        description: 'Fail if the dataset builder has no metadata on Kaggle'
        required: false
        default: 'false'

concurrency:
  group: daily-forecast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commits the refreshed CSV, snapshot and dataset metadata

env:
  # Stream Python stdout line-by-line. During the 2026-09-17 zero-rows incident the
  # block-buffered output flushed only at exit, so every "Processing X..." line
  # carried the final-flush timestamp and the real error ordering was unrecoverable.
  PYTHONUNBUFFERED: '1'
  # Repository variables, so a renamed Kaggle notebook is repointed without a code
  # change or a PR (docs/ops/kaggle-pipeline-triage.md §3).
  KAGGLE_KERNEL: ${{ vars.KAGGLE_KERNEL || 'ashifahmedshuvo/hazardnet-auto-forecast-pipeline' }}
  KAGGLE_BUILDER_KERNEL: ${{ vars.KAGGLE_BUILDER_KERNEL || 'ashifahmedshuvo/4-hazardnet-dataset-builder' }}
  KAGGLE_DATASET: ${{ vars.KAGGLE_DATASET || 'ashifahmedshuvo/hazardnet-datasets' }}
  SNAPSHOT_SOURCE: 'kaggle: hazardnet-auto-forecast-pipeline (Earth Engine + Open-Meteo + TFLite)'
  FORECAST_STORE: ${{ vars.FORECAST_STORE || 'firestore' }}

jobs:
  sync:
    name: Pull the Kaggle outputs + publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pipeline.txt

      - name: Set up Node.js
        # The snapshot/freshness builders have no npm dependencies, but the content
        # rebuild below runs the real build (engine → vite → prerender) so the
        # committed pages and the content index are refreshed together.
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install the pipeline dependencies
        # kaggle (the CLI), pandas, numpy, pyyaml — pinned in this file so every run
        # resolves the same tree. No tflite-runtime, no earthengine-api, no opencv:
        # this job does not run a model or talk to Earth Engine.
        run: pip install --requirement scripts/requirements-pipeline.txt

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Preflight — Kaggle credentials, then the kernel they can see
        id: preflight
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Presence first, then authentication. A preflight that only checks that a
          # secret is non-empty passes on a rotated token and then fails one step
          # later with the CLI's own 401 — which is what the Kaggle-backed workflows
          # did for four days in September 2026 (docs/ops/kaggle-pipeline-triage.md).
          missing=0
          for var in KAGGLE_USERNAME KAGGLE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::'$var' is not configured (repo → Settings → Secrets and variables → Actions). The forecast and the dataset metadata are both produced on Kaggle; without these two there is nothing to pull."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle --version

          # `kernels status` is the cheapest authenticated call that names the kernel:
          # it answers 401 for a rejected token, 403 for a token that does not own the
          # kernel, 404 for a slug that moved, and "never been run" for a notebook that
          # exists but has no output to fetch. Ten seconds here saves a 45-minute job
          # failing at the same place with a less useful message.
          set +e
          status=$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1)
          code=$?
          set -e
          echo "$status"
          if [ "$code" -ne 0 ]; then
            case "$status" in
              *401*|*Unauthorized*|*unauthorized*)
                echo "::error::Kaggle rejected the credentials (401). KAGGLE_USERNAME/KAGGLE_KEY are present but no longer accepted — rotate them at kaggle.com → Settings → API → Create New Token, update both secrets, then run the 'Verify GitHub Actions Secrets' workflow." ;;
              *403*|*Forbidden*)
                echo "::error::Kaggle answered 403 for '$KAGGLE_KERNEL': the token is valid but does not own that kernel. KAGGLE_USERNAME must be the notebook's owner, or the notebook must be forked under the account the token belongs to." ;;
              *404*|*"not found"*|*"Not Found"*)
                echo "::error::Kaggle has no kernel '$KAGGLE_KERNEL' (404). It was renamed, re-uploaded or deleted — set the repository VARIABLE KAGGLE_KERNEL to the current slug (Settings → Secrets and variables → Actions → Variables)." ;;
              *)
                echo "::error::'kaggle kernels status $KAGGLE_KERNEL' failed: $status" ;;
            esac
            exit 1
          fi
          case "$status" in
            *error*|*ERROR*|*cancel*|*CANCEL*|*fail*|*FAIL*)
              # The notebook ran and did not succeed. Its log lives on Kaggle, and
              # pulling its output would publish whatever the last *good* run left —
              # which is the right data but the wrong story, so say so and stop.
              echo "::error::the last run of '$KAGGLE_KERNEL' did not complete ($status). Fix it on Kaggle (https://www.kaggle.com/code/$KAGGLE_KERNEL), re-run it, then re-run this workflow. Nothing was published."
              exit 1
              ;;
          esac
          echo "kernel_status=$(echo "$status" | tail -n 1)" >> "$GITHUB_OUTPUT"
          echo "✅ Kaggle authenticated; '$KAGGLE_KERNEL' is runnable."

      - name: Fetch the forecast the notebook produced
        id: fetch
        shell: bash
        run: |
          # Writes the canonical CSV + typed JSON sidecar + manifest into
          # backend/data/forecasts/, translating the notebook's advisory table into
          # the repository's row schema (district identity from the committed
          # artifact, prediction_date derived as target_date − horizon and
          # cross-checked across rows). See the script's docstring for what is
          # mapped, what is derived, and what is deliberately left null.
          set -o pipefail
          python scripts/fetch_kaggle_forecast.py \
            --kernel "$KAGGLE_KERNEL" \
            --dest data/kaggle_notebook_output \
            --attempts 5 --retry-delay 30 \
            --summary-out fetch-summary.md 2>&1 | tee fetch.log
          cat fetch-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the forecast rows
        shell: bash
        run: |
          # Both gates ON.
          #
          # Freshness: `prediction_date` must be within three days, which is what turns a
          # silently dead Kaggle schedule into a red run instead of a site that keeps
          # publishing last week's forecast as today's.
          #
          # Coverage: the pull writes the tally itself (`coverage_tally` in the fetch
          # script) — 64 districts from scripts/etl/districts.py × the horizons the
          # producer used, against the rows it published. So a day when the notebook
          # skips four districts because their Earth Engine fetch failed is labelled
          # partial and names them, instead of looking like a complete 60-district run.
          # This used to be --skip-coverage, which is exactly how the runner-side
          # generator's 25-of-64 day went unnoticed (audit 2026-09-17).
          python scripts/validate_forecasts.py \
            --manifest backend/data/forecasts/manifest.json

      - name: Fetch the dataset builder's metadata
        id: meta
        shell: bash
        continue-on-error: true
        run: |
          # normalization_stats.json + dataset_config.json — kilobytes, not the
          # hundreds of megabytes of tensors beside them (Colab reads those straight
          # from the Kaggle dataset when a retrain needs them).
          #
          # It reports how far today's normalization has moved from the one the
          # *shipped model* was trained with, and never writes into Models/: that copy
          # belongs to the deployed bundle and only a training PR may change it.
          set -o pipefail
          python scripts/fetch_kaggle_dataset_meta.py \
            --builder-kernel "$KAGGLE_BUILDER_KERNEL" \
            --dataset "$KAGGLE_DATASET" \
            --dest data/kaggle/dataset-meta \
            --attempts 3 --retry-delay 20 \
            ${{ inputs.require_dataset_meta == 'true' && '--required' || '' }} \
            --summary-out meta-summary.md 2>&1 | tee meta.log
          cat meta-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Report a dataset-metadata failure without hiding it
        if: steps.meta.outcome == 'failure'
        shell: bash
        run: |
          # `continue-on-error` keeps a missing builder kernel from blocking the day's
          # forecast — the two are different payloads with different consequences. It
          # must not make the failure invisible, so it is re-reported here as a
          # warning annotation and in the summary, and the run still shows green only
          # because the forecast, which is what the site serves, was published.
          echo "::warning::the dataset metadata pull failed (see the 'Fetch the dataset builder's metadata' step). Today's forecast was published without it; the committed copy in data/kaggle/dataset-meta/ is unchanged."
          {
            echo '#### Dataset metadata was not refreshed'
            echo '```'
            tail -n 25 meta.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ingest the refreshed CSV into the forecast store
        id: ingest
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          PORT: '3001'
        run: |
          # Delivery is the committed snapshot; the store ingest is what makes the
          # /api surfaces agree with it. Skipped, loudly, when the key is absent —
          # a silent skip here is how the API ends up serving rows the site does not.
          if [ -z "$BACKEND_API_KEY" ]; then
            echo "::notice::store ingest skipped: BACKEND_API_KEY is not configured, so only the committed snapshot is refreshed"
            echo "ingested=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node backend/server.js > backend-server.log 2>&1 &
          echo $! > backend-server.pid
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/health" > /dev/null; then
              echo "✅ backend is healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ backend did not become healthy. Server log:"
              cat backend-server.log
              exit 1
            fi
            sleep 2
          done
          HTTP_CODE=$(curl -sS -X POST "http://localhost:${PORT}/api/v1/forecasts/update" \
            -H "Authorization: Bearer $BACKEND_API_KEY" \
            -F "file=@backend/data/forecasts/hazardnet_forecasts_latest.csv" \
            -o ingest_response.json -w "%{http_code}")
          echo "ingest responded HTTP $HTTP_CODE:"
          cat ingest_response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::store ingest failed with HTTP $HTTP_CODE — the committed snapshot is refreshed but the API is not. The two must not disagree silently."
            exit 1
          fi
          jq -e '.status == "success"' ingest_response.json > /dev/null
          echo "ingested=true" >> "$GITHUB_OUTPUT"

      - name: Stop the backend server
        if: always()
        shell: bash
        run: |
          if [ -f backend-server.pid ]; then
            kill "$(cat backend-server.pid)" 2>/dev/null || true
          fi
          pkill -f "backend/server\\.js" 2>/dev/null || true

      - name: Run the alert engine (§1.3 levels, §1.6 gate)
        id: alerts
        env:
          HAZARDNET_API_KEY: ${{ secrets.HAZARDNET_API_KEY }}
          BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
        run: |
          # The engine lives behind /api/v1/alerts/run (backend/routes/alerts.js): it
          # assesses the latest stored rows, auto-publishes at or below WATCH, and
          # queues anything above it for a named duty officer. Nothing above WATCH can
          # be published by this step, by construction.
          if [ -z "$HAZARDNET_API_KEY" ] || [ -z "$BACKEND_API_URL" ]; then
            echo "::notice::alert engine skipped: HAZARDNET_API_KEY (secret) and BACKEND_API_URL (variable) are not both set"
            exit 0
          fi
          # include_alerts: true is load-bearing. Without it the route strips
          # `batch.alerts` (answering `alerts_omitted`) and the snapshot step below has
          # no rows to read — which is how the first version of this wiring would have
          # published "no alerts" every night while alerts existed.
          curl -sS -f -X POST "$BACKEND_API_URL/api/v1/alerts/run" \
            -H "Authorization: Bearer $HAZARDNET_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"notify": true, "include_alerts": true}' -o alert-run.json
          jq -r '"alert engine: rows=" + (.rows|tostring) + " published=" + (.persisted.published|tostring) + " pending_review=" + (.persisted.pending_review|tostring) + " blocked=" + (.persisted.blocked|tostring) + " published_rows=" + ((.published_alerts // [])|length|tostring) + " levels=" + (.batch.counts|tojson)' alert-run.json | tee -a "$GITHUB_STEP_SUMMARY"
          # Fail here, not later, if the report does not carry the rows the snapshot
          # needs: a stripped report must never be read as "nothing to publish".
          jq -e 'has("published_alerts") or has("alerts") or (.batch.alerts | type == "array")' alert-run.json > /dev/null \
            || { echo "::error::alert run report carries no alert rows (published_alerts/alerts/batch.alerts all absent) — the snapshot cannot be built from it"; exit 1; }

      - name: Upload the alert run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alert-run
          path: alert-run.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Rebuild the alert snapshot (offline fallback for /alerts)
        shell: bash
        run: |
          # The alert page must render when the API is unreachable and on the first
          # paint of a fresh deploy, so the run's output is committed as a static
          # snapshot. The builder only carries PUBLISHED rows, stamps the §1.7
          # disclaimer on any row missing it, and refuses (exit 3) to replace a
          # non-empty snapshot with an empty one — a failed run must not read as
          # "all clear".
          if [ ! -f alert-run.json ]; then
            echo "::notice::alert snapshot not rebuilt: the alert engine did not run in this workflow"
            exit 0
          fi
          node scripts/build_alert_snapshot.mjs \
            --in alert-run.json \
            --out frontend/public/data/alerts-latest.json

      - name: Rebuild website snapshot
        shell: bash
        env:
          # The snapshot's `source` and `kernel` fields are provenance: they are what
          # lets a reader of frontend/public/data/forecasts-latest.json name the
          # producer without reading this file. Unset, the builder writes
          # "unspecified: built outside a workflow", which is a true statement nobody
          # wants published to the status surface.
          SNAPSHOT_SOURCE: ${{ env.SNAPSHOT_SOURCE }}
          SNAPSHOT_KERNEL: ${{ env.KAGGLE_KERNEL }}
        run: node scripts/build_forecast_snapshot.mjs

      # The freshness artifact quotes the snapshot and the manifest, so it is rebuilt
      # in the same run that rewrites them — a status page derived from yesterday's
      # inputs would be the exact lie it exists to prevent.
      - name: Rebuild freshness artifact
        shell: bash
        run: node scripts/build_freshness_artifact.mjs

      # The content engine's pages are derived from the snapshot above. The full build,
      # not just the engine: `npm run build:frontend` regenerates
      # frontend/src/content/generated-routes.json from the snapshot this run published
      # and then prerenders every route, which rewrites the committed content index.
      # All three are staged by the commit step, so the repository can never carry
      # pages that describe a different snapshot than the one published here.
      - name: Rebuild generated content pages and the content index
        shell: bash
        run: npm run build:frontend

      - name: Commit refreshed data
        shell: bash
        run: |
          if [ "${{ steps.fetch.outputs.changed }}" != "true" ] && [ "${{ inputs.force_refresh }}" != "true" ]; then
            echo "ℹ️ the notebook output is byte-identical to what is already committed — nothing to publish."
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/forecasts/ frontend/public/data/forecasts-latest.json
          # The derived status artifact travels with the data it describes (Phase 7).
          git add frontend/public/data/freshness.json
          # Content engine output (Phase 8): the generated pages plus the committed
          # index of what the build published. `--check` in CI fails if they stop
          # matching the snapshot.
          git add frontend/src/content/generated-routes.json
          git add frontend/public/data/content-index.json
          # The dataset builder's metadata is committed beside the forecast it
          # contextualises, with the provenance record that says which kernel it came
          # from and how far it has drifted from the shipped model's normalization.
          # Guarded like the alert snapshot: `git add` on a path that does not exist
          # fails the step, and this directory is absent whenever the metadata pull
          # was skipped or failed — which must not cost the day's forecast its commit.
          if [ -d data/kaggle/dataset-meta ]; then
            git add data/kaggle/dataset-meta/
          fi
          # Only stage the alert snapshot when the builder actually produced one;
          # `git add` on a missing path would fail the whole commit step.
          if [ -f frontend/public/data/alerts-latest.json ]; then
            git add frontend/public/data/alerts-latest.json
          fi
          if git diff --staged --quiet; then
            echo "ℹ️ nothing changed once the derived artifacts were rebuilt — no commit."
            exit 0
          fi
          PREDICTION_DATE=$(jq -r '.prediction_date // "unknown"' backend/data/forecasts/manifest.json)
          ROW_COUNT=$(jq -r '.row_count // 0' backend/data/forecasts/manifest.json)
          DISTRICTS=$(jq -r '.district_count // 0' backend/data/forecasts/manifest.json)
          SHAPE=$(jq -r '.source_shape // "unknown"' backend/data/forecasts/manifest.json)
          DRIFT=$(jq -r '.normalization_vs_shipped_model.state // "not compared"' data/kaggle/dataset-meta/PROVENANCE.json 2>/dev/null || echo 'not pulled')
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git commit -m "chore(data): daily Kaggle sync ${PREDICTION_DATE}" \
            -m "Source: kaggle kernels output ${KAGGLE_KERNEL} (${SHAPE} schema)" \
            -m "Rows: ${ROW_COUNT} across ${DISTRICTS} districts | Dataset normalization vs shipped model: ${DRIFT}" \
            -m "Publisher: .github/workflows/daily_forecast.yml" \
            -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          # An explicit refspec, not a bare `git push`: with no upstream configured —
          # and whenever the checkout is not sitting on a local branch — git dies with
          # exit 128 and the run reports only "Process completed with exit code 128",
          # which is how hindcast.yml failed on 2026-09-19 after every scoring step had
          # passed. The summary block below makes the next one legible.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            {
              echo '#### The daily sync commit could not be pushed'
              echo '```'
              git status --short --branch
              git log --oneline -3
              git remote -v
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the bot commit is local only — nothing was published to ${GITHUB_REF_NAME}. The job summary says whether the push was rejected (branch protection, read-only token) or the ref did not resolve."
            exit 1
          fi

      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-kaggle-sync
          path: |
            fetch.log
            fetch-summary.md
            meta.log
            meta-summary.md
            ingest_response.json
            data/kaggle_notebook_output/
            backend/data/forecasts/manifest.json
            data/kaggle/dataset-meta/PROVENANCE.json
            frontend/public/data/forecasts-latest.json
            frontend/public/data/freshness.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### Daily Kaggle sync — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- producer: \`$KAGGLE_KERNEL\` on Kaggle (Earth Engine + Open-Meteo + TFLite), kernel status: ${{ steps.preflight.outputs.kernel_status || 'not checked' }}"
            echo "- publisher: this workflow — fetch, translate, validate, rebuild, commit"
            echo "- changed since the committed artifact: ${{ steps.fetch.outputs.changed || 'n/a' }} (schema: ${{ steps.fetch.outputs.shape || 'n/a' }})"
            echo "- rows: ${{ steps.fetch.outputs.rows || '0' }} across ${{ steps.fetch.outputs.districts || '0' }} districts, prediction date ${{ steps.fetch.outputs.prediction_date || 'unknown' }}"
            echo "- districts dropped for want of an identity: ${{ steps.fetch.outputs.unmatched || '0' }}"
            echo "- store ingest: ${{ steps.ingest.outputs.ingested || 'skipped' }} (store: $FORECAST_STORE)"
            echo "- dataset metadata: ${{ steps.meta.outputs.source || 'not pulled' }}, normalization drift ${{ steps.meta.outputs.drift || 'n/a' }} (${{ steps.meta.outputs.drift_values || '0' }} value(s))"
            if [ -f frontend/public/data/alerts-latest.json ]; then
              echo "- alerts snapshot: $(jq -r '(.alerts|length)|tostring' frontend/public/data/alerts-latest.json) published row(s) committed, schema $(jq -r '.schema' frontend/public/data/alerts-latest.json)"
            fi
            if [ -f alert-run.json ]; then
              echo "- alerts: levels \`$(jq -c '.batch.counts' alert-run.json)\` — published $(jq -r '.persisted.published' alert-run.json), pending review $(jq -r '.persisted.pending_review' alert-run.json), blocked $(jq -r '.persisted.blocked // 0' alert-run.json)"
            else
              echo "- alerts: not run (see the alert engine step notice)"
            fi
            # Recency, stated rather than assumed: a Kaggle schedule that quietly stopped
            # is visible here as a prediction date that stops advancing, long before the
            # three-day freshness gate in validate_forecasts.py turns it red.
            if [ -n "${{ steps.fetch.outputs.prediction_date }}" ]; then
              AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "${{ steps.fetch.outputs.prediction_date }}" +%s) ) / 86400 ))
              echo "- the rows are ${AGE_DAYS} day(s) old; this cron runs at 00:00 UTC, so a Kaggle schedule later in the day shows up here as 1"
              if [ "$AGE_DAYS" -gt 1 ]; then
                echo "- ⚠️ more than a day old: check the notebook's Kaggle schedule, or align this workflow's cron with it"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::The daily Kaggle sync failed — the site keeps serving the last committed snapshot, which is the intended failure mode. The failing step names the cause: the preflight maps Kaggle's 401/403/404 onto the owner action it needs, the fetch step reports a schema this publisher does not know, and the validation step reports rows that are out of bounds or older than three days. Decision table: docs/ops/kaggle-pipeline-triage.md."
