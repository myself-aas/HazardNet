name: Hindcast (Phase 9)

# ─────────────────────────────────────────────────────────────────────────────
# The Phase 9 hindcast: replay a named historical event through the pipeline's
# independent physics track and score the result with the Phase 3 harness.
#
#   scripts/hindcast/cli.py run --refresh-drivers
#        fetch daily reanalysis drivers for all 64 district points (Open-Meteo
#        historical archive — the only network step), write them to
#        data/hindcast/drivers/<episode>.json, and build the report
#   scripts/hindcast/cli.py check
#        rebuild every number from the committed episode + driver series and
#        fail if the report disagrees (offline, deterministic — this is the gate)
#
# Both artifacts are committed, so the score can be audited without network or
# credentials. The report states in as many words that the CNN was NOT re-run:
# its tensor needs Sentinel/Landsat/ERA5-Land bands over Earth Engine for the
# historical window, which is owner-credentialed work.
#
# An episode is a curated historical event, not a schedule: there is no cron here.
# Dispatch it by hand, or push a change to the harness/episodes (see the `push` trigger).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode id from data/hindcast/episodes/ (or "all")'
        required: false
        default: 'all'
  # `workflow_dispatch` only fires for a workflow that exists on the default branch, so the
  # harness also runs when its own inputs change. The path filter deliberately excludes
  # `data/hindcast/drivers/**` and `data/hindcast/reports/**` — the two paths this workflow
  # commits — which keeps the bot's own commit from re-triggering the run.
  push:
    branches: [main]
    paths:
      - 'scripts/hindcast/**'
      - 'data/hindcast/episodes/**'
      - '.github/workflows/hindcast.yml'

concurrency:
  group: hindcast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  hindcast:
    name: Score the committed hindcast episodes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pipeline.txt

      # Node is here for one reason: a new or re-scored report changes the derived artifacts that
      # describe it (`frontend/public/data/model-performance.json` and the generated route that
      # renders it), and `ci.yml` gates both. Committing a report without regenerating them would
      # leave the bot's own commit red — which is how this step came to exist.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install test dependencies
        run: pip install --requirement scripts/requirements-pipeline.txt pytest

      - name: List the episodes
        working-directory: scripts
        run: python -m hindcast.cli list

      - name: Score the episodes
        working-directory: scripts
        shell: bash
        run: |
          set -euo pipefail
          EPISODES=$(python - <<'PY'
          import json
          import pathlib
          wanted = "${{ github.event.inputs.episode || 'all' }}".strip() or 'all'
          episodes = sorted(pathlib.Path('../data/hindcast/episodes').glob('*.json'))
          ids = [path.stem for path in episodes]
          if wanted != 'all':
              ids = [wanted]
          for identifier in ids:
              assert identifier in [path.stem for path in episodes], f'unknown episode {identifier}'
          print(' '.join(ids))
          PY
          )
          echo "episodes: $EPISODES"
          for id in $EPISODES; do
            echo "── $id ────────────────────────────────────────────────"
            python -m hindcast.cli run \
              --episode "../data/hindcast/episodes/${id}.json" \
              --out "../data/hindcast/reports/${id}.json" \
              --refresh-drivers
          done

      - name: Recompute the reports from the committed drivers
        working-directory: scripts
        run: python -m hindcast.cli check --require-reports

      - name: Hindcast harness tests
        working-directory: scripts
        run: python -m pytest tests/test_hindcast.py -q

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # Rebuild the report-derived JSON before prerendering. The hindcast runner writes a fresh
      # report (including its generated_at and input hash) on every run, so the committed
      # validation document and the generated /model-performance route must be regenerated from
      # those exact reports before the consistency checks below. `build:frontend` only bundles
      # and prerenders; it does not run either report builder.
      - name: Rebuild the artifacts derived from the reports
        run: |
          node scripts/build_model_performance.mjs
          node scripts/build_content_engine.mjs
          npm run build:frontend

      - name: The derived artifacts describe the reports this run wrote
        run: |
          node scripts/build_model_performance.mjs --check
          node scripts/build_content_engine.mjs --check

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hindcast-reports
          path: |
            data/hindcast/reports/*.json
            data/hindcast/drivers/*.json
          retention-days: 90

      - name: Commit the drivers, the reports and the artifacts derived from them
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # `git add <pathspec>` is *fatal* (exit 128, "did not match any files")
          # when a pathspec matches nothing, and this step names five paths written
          # by four different scripts. A run where one of them legitimately produced
          # nothing — an episode set with no drivers refreshed, a content engine that
          # did not run — must not die for that reason, so stage what exists and say
          # what did not.
          STAGED_PATHS=0
          for path in data/hindcast/drivers data/hindcast/reports \
            frontend/public/data/model-performance.json \
            frontend/src/content/generated-routes.json \
            frontend/public/data/content-index.json; do
            if [ -e "$path" ]; then
              git add -- "$path"
              STAGED_PATHS=$((STAGED_PATHS + 1))
            else
              echo "::notice::not staging $path — this run did not produce it"
            fi
          done
          if [ "$STAGED_PATHS" -eq 0 ]; then
            echo "::error::none of the derived paths exist — the steps above did not write what this step commits"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "ℹ️ The hindcast output is unchanged — nothing to commit."
            exit 0
          fi
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git commit -m "chore(hindcast): re-run the Phase 9 hindcast episodes" \
            -m "Generated by .github/workflows/hindcast.yml (scripts/hindcast/cli.py)." \
            -m "The report recomputes from the committed episode + driver series (cli.py check)." \
            -m "Includes the artifacts derived from the reports: model-performance.json, the" \
            -m "/model-performance page content, and the published content index." \
            -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          # An explicit refspec, not a bare `git push`: with no upstream configured — and
          # whenever the checkout is not sitting on a local branch — git dies with exit 128
          # and the only thing the run reports is "Process completed with exit code 128",
          # which is how hindcast.yml failed on 2026-09-19 (run 35430992137) after every
          # scoring step had passed. The summary block below makes the next one legible:
          # branch state, the last commits and the remote answer for themselves.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            {
              echo '#### The hindcast commit could not be pushed'
              echo '```'
              git status --short --branch
              git log --oneline -3
              git remote -v
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the bot commit is local only — nothing was published to ${GITHUB_REF_NAME}. The job summary says whether the push was rejected (branch protection, read-only token) or the ref did not resolve."
            exit 1
          fi
