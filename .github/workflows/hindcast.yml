name: Hindcast (Phase 9)

# ─────────────────────────────────────────────────────────────────────────────
# The Phase 9 hindcast: replay a named historical event through the pipeline's
# independent physics track and score the result with the Phase 3 harness.
#
#   scripts/hindcast/cli.py run --refresh-drivers
#        fetch daily reanalysis drivers for all 64 district points (Open-Meteo
#        historical archive — the only network step), write them to
#        data/hindcast/drivers/<episode>.json, and build the report
#   scripts/hindcast/cli.py check
#        rebuild every number from the committed episode + driver series and
#        fail if the report disagrees (offline, deterministic — this is the gate)
#
# Both artifacts are committed, so the score can be audited without network or
# credentials. The report states in as many words that the CNN was NOT re-run:
# its tensor needs Sentinel/Landsat/ERA5-Land bands over Earth Engine for the
# historical window, which is owner-credentialed work.
#
# An episode is a curated historical event, not a schedule: there is no cron here.
# Dispatch it by hand, or push a change to the harness/episodes (see the `push` trigger).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode id from data/hindcast/episodes/ (or "all")'
        required: false
        default: 'all'
  # `workflow_dispatch` only fires for a workflow that exists on the default branch, so the
  # harness also runs when its own inputs change. The path filter deliberately excludes
  # `data/hindcast/drivers/**` and `data/hindcast/reports/**` — the two paths this workflow
  # commits — which keeps the bot's own commit from re-triggering the run.
  push:
    paths:
      - 'scripts/hindcast/**'
      - 'data/hindcast/episodes/**'
      - '.github/workflows/hindcast.yml'

concurrency:
  group: hindcast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  hindcast:
    name: Score the committed hindcast episodes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pipeline.txt

      - name: Install test dependencies
        run: pip install --requirement scripts/requirements-pipeline.txt pytest

      - name: List the episodes
        working-directory: scripts
        run: python -m hindcast.cli list

      - name: Score the episodes
        working-directory: scripts
        shell: bash
        run: |
          set -euo pipefail
          EPISODES=$(python - <<'PY'
          import json
          import pathlib
          wanted = "${{ github.event.inputs.episode || 'all' }}".strip() or 'all'
          episodes = sorted(pathlib.Path('../data/hindcast/episodes').glob('*.json'))
          ids = [path.stem for path in episodes]
          if wanted != 'all':
              ids = [wanted]
          for identifier in ids:
              assert identifier in [path.stem for path in episodes], f'unknown episode {identifier}'
          print(' '.join(ids))
          PY
          )
          echo "episodes: $EPISODES"
          for id in $EPISODES; do
            echo "── $id ────────────────────────────────────────────────"
            python -m hindcast.cli run \
              --episode "../data/hindcast/episodes/${id}.json" \
              --out "../data/hindcast/reports/${id}.json" \
              --refresh-drivers
          done

      - name: Recompute the reports from the committed drivers
        working-directory: scripts
        run: python -m hindcast.cli check --require-reports

      - name: Hindcast harness tests
        working-directory: scripts
        run: python -m pytest tests/test_hindcast.py -q

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hindcast-reports
          path: |
            data/hindcast/reports/*.json
            data/hindcast/drivers/*.json
          retention-days: 90

      - name: Commit the drivers and reports
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/hindcast/drivers data/hindcast/reports
          if git diff --staged --quiet; then
            echo "ℹ️ The hindcast output is unchanged — nothing to commit."
            exit 0
          fi
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git commit -m "chore(hindcast): re-run the Phase 9 hindcast episodes" \
            -m "Generated by .github/workflows/hindcast.yml (scripts/hindcast/cli.py)." \
            -m "The report recomputes from the committed episode + driver series (cli.py check)." \
            -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git push
