name: Model Intake (bundle → pull request)

# ─────────────────────────────────────────────────────────────────────────────
# The third leg: a finished bundle becomes a pull request, and nothing more.
#
# This workflow never promotes a model. It collects what a Colab run produced,
# proves the bundle is the bundle its manifest describes, stamps the handshake
# `scripts/auto_forecast.py` refuses to run without, rebuilds the registry, and
# opens a pull request whose body carries the evidence. A human reads it and merges
# — that is the standing rule (`docs/mlops/RETRAIN_AND_PROMOTION.md`), and it is why
# the last step of the promotion ladder is a merge button rather than a script.
#
# Two jobs, because two toolchains:
#   collect    Python 3.12 + the Colab CLI (which requires 3.12+) to pull the bundle
#              off the VM — or out of Drive in a scratch session, if the VM that made
#              it is gone, which by the time a run finishes it usually is.
#   candidate  Python 3.11 + tflite-runtime==2.14.0, the exact pins
#              model-validation.yml uses, so the smoke test that gates this PR is the
#              same smoke test that will run on it.
#
# Hourly rather than event-driven: a workflow that dispatches another workflow gets a
# `GITHUB_TOKEN` that cannot push or open a PR, so the handoff between "the run
# finished" and "the bundle is a PR" goes through the run marker in git instead. Most
# ticks find nothing and cost a minute.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Collect a specific run (default: the oldest complete one not yet intaken)'
        required: false
        type: string
      skip_pr:
        description: 'Collect and validate only; do not open a pull request'
        required: false
        type: boolean
        default: false

permissions:
  contents: write        # pushes the candidate branch and the marker update
  pull-requests: write   # opens the pull request
  issues: write          # reports a bundle that did not validate

concurrency:
  group: model-intake
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  collect:
    name: Collect the bundle from Colab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The fallback step re-runs the same collection against an archive, so its answers
      # win when it produced any.
      found: ${{ steps.fallback.outputs.found || steps.collect.outputs.found }}
      valid: ${{ steps.fallback.outputs.valid || steps.collect.outputs.valid }}
      run_id: ${{ steps.fallback.outputs.run_id || steps.collect.outputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the Colab CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check google-colab-cli
          colab --version

      - name: Collect and validate against the manifest
        id: collect
        continue-on-error: true
        shell: bash
        env:
          COLAB_TOKEN_JSON: ${{ secrets.COLAB_TOKEN_JSON }}
          HN_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          cd scripts
          EXTRA=''
          if [ -n "${HN_RUN_ID:-}" ]; then EXTRA="--run-id $HN_RUN_ID"; fi
          # shellcheck disable=SC2086
          python -m mlops.retrain_cli collect --bundle-dir "${GITHUB_WORKSPACE}/data/mlops/incoming" $EXTRA

      - name: Fall back to the archive the watcher made
        id: fallback
        if: steps.collect.outputs.valid != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # The VM that made a bundle is usually gone by the time it is collected — that
          # is what a free tier does. The watcher archives the bundle on the tick that
          # sees the manifest, so intake can still validate it; `collect` recognises a
          # bundle already on disk and skips the VM entirely.
          PICK="${{ inputs.run_id }}"
          ARTIFACT=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name | startswith(\"retrain-bundle-\")${PICK:+ | select(.name | endswith(\"${PICK}\"))}] | sort_by(.created_at) | last | .id // empty")
          if [ -z "$ARTIFACT" ]; then
            echo "· no archived bundle to fall back to"
            exit 0
          fi
          NAME=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT}" --jq '.name')
          RUN_ID="${NAME#retrain-bundle-}"
          echo "· falling back to ${NAME}"
          DEST="data/mlops/incoming/${RUN_ID}"
          mkdir -p "$DEST"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT}/zip" > "${RUNNER_TEMP}/bundle.zip"
          unzip -o -q "${RUNNER_TEMP}/bundle.zip" -d "$DEST"
          cd scripts
          python -m mlops.retrain_cli collect --run-id "$RUN_ID" \
            --bundle-dir "${GITHUB_WORKSPACE}/data/mlops/incoming"

      - name: Upload the collected bundle
        if: steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: retrain-bundle-${{ steps.collect.outputs.run_id }}
          path: data/mlops/incoming/${{ steps.collect.outputs.run_id }}/
          if-no-files-found: error
          retention-days: 14

      - name: Report a bundle that did not validate
        if: steps.collect.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: |
          set -uo pipefail
          TITLE="Retrain bundle ${RUN_ID:-} did not validate"
          BODY=$(cat <<EOF
          A completed retrain produced a bundle that intake will not turn into a pull request.

          The manifest gate rejected it — missing artifacts, a size that cannot be the CNN,
          a hash that does not match the bytes, fold metrics outside 0..1, or (the one that
          matters most) an ONNX→TFLite parity below 99%, which means the conversion changed
          the model's predictions rather than re-expressing them.

          The run marker at \`data/mlops/retrain-runs/${RUN_ID:-unknown}.json\` keeps the run
          eligible, so a bundle that becomes complete on a later attempt is picked up
          automatically. The champion model is unaffected either way.

          [Intake run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) —
          the \`Collect and validate\` step lists every reason.
          EOF
          )
          EXISTING=$(gh issue list --state open --search "did not validate" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "mlops" || \
              echo "::warning::could not open an issue; the reasons are only in the run log"
          fi

  candidate:
    name: Open the promotion pull request
    needs: collect
    if: needs.collect.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The pins model-validation.yml runs, so this job's smoke test and the one
          # that will gate the PR are the same test on the same runtime.
          python-version: '3.11'

      - name: Download the collected bundle
        uses: actions/download-artifact@v7
        with:
          name: retrain-bundle-${{ needs.collect.outputs.run_id }}
          path: data/mlops/incoming/${{ needs.collect.outputs.run_id }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # For one script: `scripts/gen-model-version.mjs` writes the handshake, and it
          # is the only writer of Models/VERSION.json in the repository.
          node-version: '22'

      - name: Install the model runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check tflite-runtime==2.14.0 numpy==1.26.4

      - name: Put the bundle where it would ship
        id: place
        shell: bash
        env:
          RUN_ID: ${{ needs.collect.outputs.run_id }}
        run: |
          set -euo pipefail
          BUNDLE="data/mlops/incoming/${RUN_ID}"
          test -f "${BUNDLE}/run_manifest.json" || { echo "::error::the bundle has no manifest"; exit 1; }
          # Only the artifacts the manifest claims are copied. VERSION.json is stamped
          # below rather than taken from the run, and REGISTRY.json is rebuilt, because
          # both describe the repository's state and not the VM's.
          for artifact in hazardnet_fp32.tflite hazardnet_int8.tflite labels.json \
                          normalization_stats.json preprocessing_config.json; do
            if [ -f "${BUNDLE}/${artifact}" ]; then
              cp "${BUNDLE}/${artifact}" "Models/${artifact}"
              echo "· Models/${artifact} ← $(stat -c %s "Models/${artifact}") bytes"
            fi
          done
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Regenerate the handshake and rebuild the registry
        shell: bash
        run: |
          set -euo pipefail
          # The canonical writer of Models/VERSION.json — the same script the weekly
          # pipeline runs and the same one CI checks for staleness. `<package.json
          # version>+model.<hash of the four claimed artifact hashes>`, idempotent, and
          # not something this workflow gets to reinvent.
          node scripts/gen-model-version.mjs
          jq -r '.version' Models/VERSION.json
          cd scripts
          # Rebuilding carries the stages and approvals already on disk, so a promotion a
          # human recorded is never lost by an automated refresh.
          python -m mlops.cli registry --write

      - name: Smoke-test the bundle exactly as CI will
        shell: bash
        run: |
          set -euo pipefail
          # Same script, same runtime, same input tensor shape the daily forecast uses.
          # If this fails here it would fail on the pull request too, and the reviewer
          # would be reading a red check instead of a decision.
          python scripts/validate_model_bundle.py

      - name: Audit the handshake
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python -m mlops.cli audit --json "${GITHUB_WORKSPACE}/data/mlops/incoming/audit.json" | tail -20
          echo "· audit written"

      - name: Write the pull request body
        id: body
        shell: bash
        env:
          RUN_ID: ${{ needs.collect.outputs.run_id }}
          BUNDLE: ${{ steps.place.outputs.bundle }}
        run: |
          set -euo pipefail
          python - "$RUN_ID" "$BUNDLE" <<'PY' > pr-body.md
          import json, pathlib, sys
          run_id, bundle = sys.argv[1], pathlib.Path(sys.argv[2])
          manifest = json.loads((bundle / 'run_manifest.json').read_text(encoding='utf-8'))
          report_path = bundle / 'intake-report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.is_file() else {}
          version = json.loads(pathlib.Path('Models/VERSION.json').read_text(encoding='utf-8'))
          parity = manifest.get('parity') or {}
          environment = manifest.get('environment') or {}

          def row(label, value):
              return f'| {label} | {value} |'

          print(f'## Retrained model candidate — `{run_id}`\n')
          print('A Colab T4 run trained, converted and validated this bundle unattended. '
                '**Nothing here is live until a human merges this pull request**, and merging '
                'it does not promote anything: the new artifact enters the registry as a '
                '`candidate`, and `champion` still needs `python -m mlops.cli promote --by <you>`.\n')
          print('### What the run reported\n')
          print('| | |')
          print('|---|---|')
          print(row('Strategy', manifest.get('strategy', '?')))
          print(row('Version proposed', f'`{version.get("version")}`'))
          print(row('Training time', f'{float(manifest.get("duration_seconds", 0)) / 3600:.1f} h'))
          print(row('GPU', environment.get('gpu', '?')))
          print(row('Torch / TF', f'{environment.get("torch", "?")} / {environment.get("tensorflow", "?")}'))
          print(row('Repository sha', manifest.get('repo_sha', '?')))
          resumed = manifest.get('resumed_from') or []
          print(row('Resumed from', f'{len(resumed)} dead session(s)' if resumed else 'a single uninterrupted session'))
          print('')
          print('### Fold metrics (held-out, as the notebook measured them)\n')
          print('| fold | accuracy | F1 | RMSE | MAE | R² |')
          print('|---|---|---|---|---|---|')
          for fold in manifest.get('folds') or []:
              print('| {fold} | {a:.4f} | {f:.4f} | {r:.4f} | {m:.4f} | {s:.4f} |'.format(
                  fold=fold.get('fold', '?'), a=fold.get('accuracy', 0) or 0, f=fold.get('f1', 0) or 0,
                  r=fold.get('rmse', 0) or 0, m=fold.get('mae', 0) or 0, s=fold.get('r2', 0) or 0))
          print('')
          print('### Conversion parity (the gate that makes a TFLite bundle trustworthy)\n')
          print('| | |')
          print('|---|---|')
          print(row('Hazard agreement', f'{parity.get("hazard_agreement_pct", "?")}% (gate: 99.0%)'))
          print(row('Severity MAE vs PyTorch', parity.get('severity_mae', '?')))
          print('')
          print('### Artifacts\n')
          print('| file | bytes | sha256 |')
          print('|---|---|---|')
          for entry in report.get('inventory') or []:
              if entry.get('present'):
                  print(f'| `{entry["name"]}` | {entry["bytes"]:,} | `{entry["sha256"][:16]}…` |')
          print('')
          print('`hazardnet_int8.tflite` is byte-identical to the FP32 file, as ADR 0007 records: '
                "TFLite's converter crashes on `CONV_3D` under INT8, so the name is historical and the "
                'registry reports it as a duplicate rather than a second model.\n')
          print('### What this pull request cannot prove\n')
          print('Verification scores (POD/FAR/CSI, reliability, drift) need *observed outcomes*, and a '
                'model trained today has none yet. The nightly `mlops.yml` job produces them; promotion '
                'to `champion` should wait for a challenger report:\n')
          print('```bash')
          print('cd scripts')
          print(f'python -m mlops.cli evaluate --predictions <challenger predictions> --outcomes <observed> \\')
          print('  --json /tmp/challenger.json')
          print('python -m mlops.cli promote --artifact hazardnet_fp32.tflite \\')
          print('  --report /tmp/challenger.json --champion <the current champion report> --by <your name>')
          print('```')
          print('')
          print('Merging this pull request is safe without that: it replaces the bundle the daily '
                'forecast runs, and the smoke test above plus the parity gate are what stand between a '
                'conversion bug and production. It is *not* a claim that the new model verifies better '
                'than the old one — that claim needs truth data and a named approver.')
          PY
          echo "· pull request body: $(wc -l < pr-body.md) lines"

      - name: Open the pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.collect.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_pr }}" = 'true' ]; then
            echo "· --skip-pr: the bundle is validated and left in the run artifacts"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="mlops/retrain-${RUN_ID}"
          # A tick that already opened this PR must not open a second one: the marker
          # update below lands on the default branch only after a successful push, so
          # there is a window in which the same bundle looks un-intaken.
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            echo "· a pull request is already open: $EXISTING"
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add Models/
          if git diff --staged --quiet; then
            echo "ℹ️ The bundle is byte-identical to what already ships — nothing to propose."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat(models): retrained bundle ${RUN_ID}" \
            -m "Trained unattended on a Colab T4 by model_retrain.yml, watched by model_retrain_watch.yml, collected and validated by model_intake.yml." \
            -m "The new artifact enters Models/REGISTRY.json as a candidate. Promotion to champion needs \`python -m mlops.cli promote --by <approver>\` — see docs/mlops/RETRAIN_AND_PROMOTION.md." \
            -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git push --force-with-lease origin "$BRANCH"
          URL=$(gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
            --title "Retrained model candidate ${RUN_ID}" \
            --body-file pr-body.md \
            --label "mlops")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✓ opened $URL"

      - name: Record the intake on the default branch
        if: steps.pr.outputs.url != ''
        uses: actions/checkout@v7
        with:
          # A second working tree, so the marker bookkeeping lands on the default
          # branch without disturbing the candidate branch that was just pushed.
          path: marker-repo

      - name: Mark the run as intaken
        if: steps.pr.outputs.url != ''
        shell: bash
        env:
          RUN_ID: ${{ needs.collect.outputs.run_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          cd marker-repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          cd scripts
          python -m mlops.retrain_cli mark --run-id "$RUN_ID" --pr "$PR_URL"
          cd ..
          git add data/mlops/retrain-runs
          if git diff --staged --quiet; then
            echo "· the marker was already up to date"
            exit 0
          fi
          git commit -m "chore(mlops): ${RUN_ID} is a pull request" \
            -m "Recorded so the hourly intake does not collect the same bundle again: ${PR_URL}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ needs.collect.outputs.run_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo '### Model intake'
            echo ''
            echo "Run: \`${RUN_ID}\`"
            echo ''
            if [ -n "${PR_URL}" ]; then
              echo "Pull request: ${PR_URL}"
              echo ''
              echo 'Merging it replaces the bundle the daily forecast runs. It does **not** promote'
              echo 'anything: the artifact enters the registry as a `candidate`, and `champion` still'
              echo 'needs `python -m mlops.cli promote --by <approver>`.'
            else
              echo 'No pull request was opened — either the bundle was byte-identical to what ships,'
              echo 'or `--skip-pr` was requested. The validated bundle is in the run artifacts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
