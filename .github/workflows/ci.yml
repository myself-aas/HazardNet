name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      
      - name: Run backend unit tests
        run: npx jest --ci --coverage --testPathPattern="__tests__/(api|backend)" --coverageDirectory=./coverage/backend
      
      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/backend/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
  
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --coverage --run
      
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
  
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build frontend
        run: npm run build
      
      - name: Start preview server
        run: |
          npm --prefix frontend run preview &
          npx wait-on http://localhost:4173 -t 30000
      
      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:4173
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  
  verify:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      
      - name: Type-check (tsc --noEmit)
        run: npm run lint
      
      - name: ESLint (0-error policy)
        run: npm run lint:eslint
      
      - name: RAG knowledge-base freshness
        run: npm run check:rag-freshness
      
      - name: Serverless functions load as ESM
        run: |
          node -e "import('./api/forecasts.js').then(() => console.log('api/forecasts: ESM OK'))"
          node -e "import('./api/ingest.js').then(() => console.log('api/ingest: ESM OK'))"
          node -e "import('./api/metrics.js').then(() => console.log('api/metrics: ESM OK'))"
      
      - name: Production build
        run: npm run build
      
      - name: Bundle budget check
        run: npm run check:bundle
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
  
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Production dependency audit
        continue-on-error: true
        run: |
          npm i --package-lock-only --ignore-scripts --legacy-peer-deps
          npm audit --omit=dev --audit-level=high
      
      - name: Check for known vulnerabilities (audit-ci)
        run: npx audit-ci --high --production
        continue-on-error: true
  
  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: [verify, test-e2e]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
  
  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    needs: [verify, test-e2e, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
