name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run backend unit tests
        run: npx jest --ci --coverage --coverageDirectory=./coverage/backend --testPathIgnorePatterns='/e2e/' 'frontend/src'

      - name: Upload backend coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/backend/lcov.info
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Frontend suites run under the ROOT jest config (babel TS/React
      # transform + jsdom). Running bare `jest` inside frontend/ has no config
      # and cannot parse .tsx — hence the explicit --config/--rootDir pair
      # (mirrored by frontend/package.json `test` for local runs).
      # --coverageThreshold='{}' disables the backend-calibrated global gates
      # for this frontend-only run: the 32%+ thresholds are scoped to the
      # backend test job (see jest.config.cjs QA-01) and can never pass on a
      # run that executes no backend suites. Coverage still uploads to
      # Codecov for tracking; ratchet a frontend gate here once component
      # tests land (baseline: ~17% statements, lib/utils only).
      - name: Run frontend tests
        working-directory: frontend
        run: npx jest --ci --config ../jest.config.cjs --rootDir .. --coverage --coverageDirectory=./frontend/coverage --coverageThreshold='{}' frontend/src

      - name: Upload frontend coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-pipeline-scripts:
    name: Pipeline Scripts Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Python test deps
        run: pip install --requirement scripts/requirements-pipeline.txt pytest

      # Guards the Kaggle pipeline scripts AND the workflow files themselves:
      # every .github/workflows/*.yml must parse as YAML and must not use the
      # `secrets` context in ANY `if:` (job or step — GitHub rejects the whole
      # file with zero jobs either way; gate on a resolved step output
      # instead — the Sept 2026 CI outage). See scripts/tests/.
      - name: Run pipeline script tests
        run: python -m pytest scripts/tests -q

      - name: Snapshot builder smoke test
        run: |
          python scripts/tests/make_fixture_csv.py /tmp/fixture_forecasts.csv
          node scripts/build_forecast_snapshot.mjs /tmp/fixture_forecasts.csv /tmp/forecasts-latest.json
          node -e "const s=require('/tmp/forecasts-latest.json'); if(!s.horizons['7_days']?.length) throw new Error('empty 7_days'); console.log('snapshot OK:', s.prediction_date)"

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The E2E quarantine added on 2026-09-13 (continue-on-error: true) was
    # lifted the same day: the root cause was a production defect, not a flaky
    # suite. Rolldown wrapped `leaflet` in a lazily-initialised CommonJS
    # factory while `leaflet.heat` / `leaflet.markercluster` mutate the global
    # `L` at chunk-evaluation time, so every built page threw
    # "ReferenceError: L is not defined" and dropped into the root
    # ErrorBoundary. See frontend/vite.config.ts (leafletGlobalShim) and
    # docs/audits/2026-09-13-e2e-green-and-codebase-audit.md.
    #
    # Second 2026-09-13 defect, same job: `<Analytics />` injected a classic
    # `/_vercel/insights/script.js`, which only Vercel's edge serves. Against
    # this job's preview server (and on Firebase Hosting) the path fell through
    # to the SPA rewrite, came back as `index.html` + `text/html`, and the
    # browser threw `SyntaxError: Unexpected token '<'` once per page load.
    # Gated behind a Vercel-build flag; see
    # docs/audits/2026-09-13-vercel-analytics-pageerror.md.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start preview server
        run: |
          npm --prefix frontend run preview -- --host 0.0.0.0 --port 3000 > /tmp/hazardnet-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Preview server did not become ready in time.'
          cat /tmp/hazardnet-preview.log
          exit 1

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  verify:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-pipeline-scripts]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: ESLint (0-error policy)
        run: npm run lint:eslint

      - name: RAG knowledge-base freshness
        run: npm run check:rag-freshness

      - name: Model VERSION.json is current
        run: |
          node scripts/gen-model-version.mjs
          git diff --exit-code -- Models/VERSION.json || {
            echo "::error::Models/VERSION.json is stale — run 'node scripts/gen-model-version.mjs' and commit it."
            exit 1
          }

      - name: Serverless functions load as ESM
        run: |
          node -e "import('./api/forecasts.js').then(() => console.log('api/forecasts: ESM OK'))"
          node -e "import('./api/ingest.js').then(() => console.log('api/ingest: ESM OK'))"
          node -e "import('./api/metrics.js').then(() => console.log('api/metrics: ESM OK'))"
          node -e "import('./api/v1/forecasts/bulk.js').then(() => console.log('api/v1/forecasts/bulk: ESM OK'))"
          node -e "import('./api/v1/forecasts/metadata.js').then(() => console.log('api/v1/forecasts/metadata: ESM OK'))"
          node -e "import('./api/v1/forecasts/history.js').then(() => console.log('api/v1/forecasts/history: ESM OK'))"

      - name: Production build
        run: npm run build

      - name: Bundle budget check
        run: npm run check:bundle

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Working-tree scan for committed high-confidence secrets (ghp_/sk-/
      #AIza/xox/AKIA/private keys/connection strings with passwords...).
      # History is out of scope here (past leaks are tracked for rotation in
      # docs/audits/) — this gate stops NEW leaks from merging.
      - name: Scan working tree for leaked secrets
        run: bash scripts/check-secrets.sh

      # Fails closed on any high/critical advisory NOT listed in
      # audit-exceptions.json (accepted-risk entries carry expiries, so the
      # gate also fails when an exception goes stale without re-review).
      # Bare `npm audit --audit-level=high` could never pass: the tfjs-node
      # install toolchain (tar/adm-zip, install-time only) has no
      # non-breaking fix.
      - name: Production dependency audit
        run: node scripts/npm-audit-ci.mjs

  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: [verify, test-e2e]
    if: github.event_name == 'pull_request'

    # NOTE: the `secrets` context is forbidden in EVERY `if:` (job AND step —
    # GitHub rejects the whole file with zero jobs). Token presence is resolved
    # once into a step output (secrets ARE allowed inside `run:`), and the
    # deploy/skip steps gate on that output instead.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Vercel deploy flag
        id: flags
        run: echo "has_token=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Resolves the org + project the token may actually use, and exports them
      # for the deploy step. The CLI trusts VERCEL_ORG_ID / VERCEL_PROJECT_ID
      # blindly, so a stale secret in either produces a 403 the CLI reports as
      # "Could not retrieve Project Settings. To link your Project, remove the
      # `.vercel` directory and deploy again." — advice that cannot help in CI,
      # where no `.vercel` directory exists. The script looks the project up by
      # name instead, so a stale id degrades to a notice rather than a failure.
      # See scripts/ci/resolve-vercel-scope.sh and
      # docs/audits/2026-09-14-vercel-deploy-403-project-unresolved.md.
      - name: Resolve Vercel scope
        if: steps.flags.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_SLUG: aas-core
          VERCEL_PROJECT_NAME: hazardnet
        run: bash scripts/ci/resolve-vercel-scope.sh

      # Vercel CLI directly instead of amondnet/vercel-action@v25: that action
      # bundles CLI 25 (2023) and runs on the Node 20 Actions runtime GitHub is
      # removing. It also forwarded `scope: ${{ secrets.VERCEL_ORG_ID }}` as
      # `--scope`, and `--scope` takes a team *slug* (`aas-core`), not a
      # `team_…` id — the id form is what fails with "You do not have access to
      # the specified account". The documented CI pattern is the VERCEL_ORG_ID
      # / VERCEL_PROJECT_ID environment variables, which scope by id without
      # `--scope` — read here from `$GITHUB_ENV`, where `Resolve Vercel scope`
      # puts the ids that actually work. Do NOT re-declare them in this step's
      # `env:`, which would shadow the resolved values with the raw secrets.
      # See docs/audits/2026-09-14-actions-runtime-and-vercel-deploy.md.
      - name: Deploy to Vercel Preview
        if: steps.flags.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@50 deploy --yes \
            -m githubDeployment=1 \
            -m githubOrg="${GITHUB_REPOSITORY_OWNER}" \
            -m githubRepo="${GITHUB_REPOSITORY#*/}" \
            -m githubCommitSha="${GITHUB_SHA}" \
            -m githubCommitRef="${GITHUB_REF_NAME}" \
            -m githubCommitAuthorLogin="${GITHUB_ACTOR}" \
            -m githubCommitMessage="$(git log -1 --pretty=%s)")
          echo "Vercel preview: $url"
          echo "Vercel preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip notice (no Vercel token)
        if: steps.flags.outputs.has_token != 'true'
        run: echo "::notice::VERCEL_TOKEN not set — skipping Vercel preview deploy."

  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    needs: [verify, test-e2e, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # NOTE: no `secrets` in any `if:` (see deploy-preview) — gate on the
    # resolved step output instead.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve Vercel deploy flag
        id: flags
        run: echo "has_token=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Resolves the org + project the token may actually use — see
      # deploy-preview's `Resolve Vercel scope` for the full rationale.
      - name: Resolve Vercel scope
        if: steps.flags.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_SLUG: aas-core
          VERCEL_PROJECT_NAME: hazardnet
        run: bash scripts/ci/resolve-vercel-scope.sh

      # Vercel CLI directly — see deploy-preview for the rationale (dead
      # action, CLI 25, `--scope` given a team id). The resolved ids arrive via
      # `$GITHUB_ENV`; re-declaring them here would shadow them with the raw
      # secrets.
      - name: Deploy to Vercel Production
        if: steps.flags.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@50 deploy --prod --yes \
            -m githubDeployment=1 \
            -m githubOrg="${GITHUB_REPOSITORY_OWNER}" \
            -m githubRepo="${GITHUB_REPOSITORY#*/}" \
            -m githubCommitSha="${GITHUB_SHA}" \
            -m githubCommitRef="${GITHUB_REF_NAME}" \
            -m githubCommitAuthorLogin="${GITHUB_ACTOR}" \
            -m githubCommitMessage="$(git log -1 --pretty=%s)")
          echo "Vercel production: $url"
          echo "Vercel production: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip notice (no Vercel token)
        if: steps.flags.outputs.has_token != 'true'
        run: echo "::notice::VERCEL_TOKEN not set — skipping Vercel production deploy."
