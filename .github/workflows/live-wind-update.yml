name: Live Wind Update

# Phase E (2026-10-05), rewired 2026-10-26 (E.2): the wind field artifact is
# built from Open-Meteo — one keyless HTTP request covering the artifact's own
# 1° lattice — and committed, so no Vercel function and no runner-side GRIB
# decode (wgrib2) is spent on it. The retired GFS/ECMWF ladder needed the
# conda-forge wgrib2 build; this workflow no longer installs anything.
# Scheduled runs fire on the default branch only; manual dispatch seeds or
# rehearses the fetch on any branch.

on:
  # The unbacked wind map layer has been retired; automated schedule disabled.
  workflow_dispatch: {}

concurrency:
  group: live-wind-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Open-Meteo wind artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build wind artifact (Open-Meteo)
        run: node scripts/fetch_live_wind.mjs --out frontend/public/data/live/wind.json

      - name: Run wind pipeline tests
        run: node --test __tests__/windPipeline.test.js

      - name: Commit wind artifact
        id: commit-artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/live/wind.json
          if git diff --staged --quiet; then
            echo "[git] Wind artifact unchanged."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            MODEL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('frontend/public/data/live/wind.json','utf8')).model)")
            git commit -m "chore(live-wind): refresh wind artifact ($MODEL) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "[git] Pushed refreshed wind artifact ($MODEL)."
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Deployment is Cloudflare Pages' Git integration: pushing the artifact commit
      # to `main` starts the Pages build, which is why no deploy step lives here.
      # Until 2026-10-26 this job ended with `npx vercel deploy --prod`, gated on
      # `committed == 'true'` and on a VERCEL_TOKEN this repository never held — so the
      # step silently deferred to the Git trigger anyway. The Vercel project, its two
      # configs and its secrets are gone (docs/ops/deployment.md).
