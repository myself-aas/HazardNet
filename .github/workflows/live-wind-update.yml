name: Live Wind Update

# Phase E (2026-10-05): the wind field artifact, rebuilt every six hours from
# GFS with ECMWF open data as the L1 alternate (decision E.1: decode here with
# real tooling, serve a small committed artifact, spend no Vercel functions).
# Scheduled runs fire on the default branch only; manual dispatch seeds or
# rehearses the ladder on any branch.

on:
  # The unbacked wind map layer has been retired; automated schedule disabled.
  workflow_dispatch: {}

concurrency:
  group: live-wind-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: GFS/ECMWF wind artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # `wgrib2` does not exist in Ubuntu 24.04 — noble has no such package, jammy did — and
      # `ubuntu-latest` is 24.04 (it migrates to Ubuntu 26 on 2026-10-19). So the apt step this
      # replaces failed with "Unable to locate package wgrib2" (apt exit 100, eight seconds in)
      # and the job had never been green since it landed: every run died here and the decode,
      # tests, commit and deploy steps were skipped.
      #
      # This installs conda-forge's linux-64 build instead. It is the maintained upstream build
      # (3.8.0) and is compiled with g2clib/jasper + nceplibs-ip + libaec + libpng — exactly what
      # the fetch script needs: `-match`/`-small_grib` to cut the hazard window, `-spread` to emit
      # the `lon lat value` rows. The static micromamba binary makes the step independent of
      # which Ubuntu the runner label resolves to, so the 26.04 migration cannot break it again.
      #
      # The smoke check asserts the binary runs and identifies itself rather than trusting the
      # installer: a wgrib2 built without the compression libraries installs cleanly and only
      # fails later, inside the decode of a real GFS message (which is what `-spread` reads).
      - name: Install wgrib2 (conda-forge; Ubuntu 24.04 has no package)
        shell: bash
        env:
          WGRIB2_VERSION: '3.8.0'
        run: |
          set -euo pipefail
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/micromamba-root"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj bin/micromamba
          ./bin/micromamba create -y -p "$RUNNER_TEMP/wgrib2" -c conda-forge "wgrib2=$WGRIB2_VERSION"
          echo "$RUNNER_TEMP/wgrib2/bin" >> "$GITHUB_PATH"
          HELP=$("$RUNNER_TEMP/wgrib2/bin/wgrib2" -help 2>&1 || true)
          printf '%s\n' "$HELP" | head -2
          case "$HELP" in
            *wgrib2*) ;;
            *)
              echo "::error::wgrib2 installed but does not run — the smoke check got no wgrib2 banner."
              exit 1
              ;;
          esac

      - name: Build wind artifact (GFS, falling back to ECMWF)
        run: node scripts/fetch_live_wind.mjs --out frontend/public/data/live/wind.json

      - name: Run wind pipeline tests
        run: node --test __tests__/windPipeline.test.js

      - name: Commit wind artifact
        id: commit-artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/live/wind.json
          if git diff --staged --quiet; then
            echo "[git] Wind artifact unchanged."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            MODEL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('frontend/public/data/live/wind.json','utf8')).model)")
            git commit -m "chore(live-wind): refresh wind artifact ($MODEL) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "[git] Pushed refreshed wind artifact ($MODEL)."
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel Production Deployment
        if: steps.commit-artifact.outputs.committed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "[deploy] VERCEL_TOKEN unset — relying on GitHub push trigger for deployment."
            exit 0
          fi
          echo "[deploy] Triggering Vercel deployment..."
          npx --yes vercel deploy --prod --token="$VERCEL_TOKEN"
