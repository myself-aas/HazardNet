# Builds the HazardNet native apps and publishes their executables to GitHub
# Releases:
#
#   * Android: signed release APK  (apps/mobile,  Expo / React Native)
#   * Windows: Release x64 build — packaged .msix (and unpacked .exe)
#              (apps/windows, React Native for Windows / WinUI)
#
# Triggers
#   * push of a tag matching `v*`  -> assets are attached to that release
#   * manual "Run workflow"        -> a (pre-)release is created automatically,
#     named from the app versions + commit SHA
#
# Repository secrets (all optional but recommended):
#   ANDROID_KEYSTORE_BASE64   base64-encoded `android/app/keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
# Without these secrets the Android job generates a throw-away CI keystore:
# the APK is validly signed and installable, but the signing key is not
# reusable (fine for field installs, not for Play Store updates).
#
# See docs/APP_RELEASES.md for the full operator guide.

name: App Releases (Android APK / Windows MSIX)

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the created release as pre-release'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: app-releases-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      mobile_version: ${{ steps.meta.outputs.mobile_version }}
      windows_version: ${{ steps.meta.outputs.windows_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          set -euo pipefail
          MOBILE_VER="$(node -p "require('./apps/mobile/app.json').expo.version")"
          WINDOWS_VER="$(node -p "require('./apps/windows/package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            TAG="v${MOBILE_VER}-apps-${GITHUB_SHA::8}"
            PRERELEASE="${{ inputs.prerelease }}"
            [ -n "${PRERELEASE}" ] || PRERELEASE="true"
          fi
          {
            echo "tag=${TAG}"
            echo "mobile_version=${MOBILE_VER}"
            echo "windows_version=${WINDOWS_VER}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  android-apk:
    name: Build Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java ${{ env.JAVA_VERSION }} (for Gradle + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Accept Android licenses and install NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" || echo "NDK install failed, continuing"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls -la "${ANDROID_HOME}/ndk" || true

      - name: Prebuild the Android project (Expo)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          ls -la android/
          ls -la android/app/ | head -n 100
          cat android/gradle.properties | head -n 50

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_DIR="apps/mobile/android/app"
          mkdir -p "${APP_DIR}"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] \
             && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Signing with the repository keystore (ANDROID_KEYSTORE_* secrets)."
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${APP_DIR}/keystore.jks"
          else
            STORE_PASSWORD="hazardnet-ci"
            KEY_ALIAS="hazardnet-ci"
            KEY_PASSWORD="hazardnet-ci"
            rm -f "${APP_DIR}/keystore.jks"
            keytool -genkeypair \
              -keystore "${APP_DIR}/keystore.jks" \
              -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HazardNet CI, OU=Engineering, O=HazardNet, C=BD"
            echo "::warning::ANDROID_KEYSTORE_* secrets are not set; using a throw-away CI keystore (APK is installable, but the key cannot be reused for updates)."
          fi
          ls -lh "${APP_DIR}/keystore.jks"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${APP_DIR}/keystore.properties"
          cat "${APP_DIR}/keystore.properties"
          cp apps/mobile/ci-signing.gradle "${APP_DIR%/*}/signing-release.gradle"
          if ! grep -q "signing-release.gradle" "${APP_DIR}/build.gradle"; then
            printf '\napply from: "../signing-release.gradle"\n' >> "${APP_DIR}/build.gradle"
          fi
          echo "--- tail of build.gradle ---"
          tail -n 30 "${APP_DIR}/build.gradle"

      - name: Ensure local.properties (SDK location)
        run: |
          set -euo pipefail
          ANDROID_DIR="apps/mobile/android"
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "sdk.dir=${ANDROID_HOME}" > "${ANDROID_DIR}/local.properties"
          cat "${ANDROID_DIR}/local.properties"
          chmod +x "${ANDROID_DIR}/gradlew" || true
          ls -lh "${ANDROID_DIR}/gradlew"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs="-Xmx3g"
        run: |
          set -euo pipefail
          ./gradlew --version
          # Capture full log to file for diagnostics
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "--- last 200 lines of gradle log ---"
          tail -n 200 /tmp/gradle.log
          ls -lh app/build/outputs/apk/release/ || true

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" \
             "dist/HazardNet-mobile-v${{ needs.meta.outputs.mobile_version }}-android.apk"
          ls -lh dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: HazardNet Apps ${{ needs.meta.outputs.tag }}
          body: |
            Native app binaries for HazardNet (mobile Android + Windows desktop).

            - **Android:** `HazardNet-mobile-v<version>-android.apk` — signed release APK (see workflow for signing details).
            - **Windows:** `HazardNet-windows-v<version>-x64.msix` — packaged x64 app (double-click to install on Windows 10/11), plus the unpacked `HazardNet-windows-v<version>-x64.exe`.

            Built by the `App Releases (Android APK / Windows MSIX)` workflow from `${{ github.sha }}`.
          prerelease: ${{ fromJSON(needs.meta.outputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk

  windows-build:
    name: Build Windows x64
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify and fix React Native Windows layout
        shell: pwsh
        run: |
          Write-Host "=== Node version ==="
          node -v
          npm -v
          Write-Host "=== Checking for react-native-windows ==="
          $rootRnw = "node_modules/react-native-windows/package.json"
          $appRnw = "apps/windows/node_modules/react-native-windows/package.json"
          if (Test-Path $rootRnw) { Write-Host "Found $rootRnw"; Get-Content $rootRnw | Select-String '"version"' | Select-Object -First 1 }
          if (Test-Path $appRnw) { Write-Host "Found $appRnw"; Get-Content $appRnw | Select-String '"version"' | Select-Object -First 1 }
          # Ensure both locations exist via copy for compatibility with sln that may reference either
          if ((Test-Path $rootRnw) -and -not (Test-Path $appRnw)) {
            Write-Host "Copying root RNW to apps/windows/node_modules for sln compatibility"
            New-Item -ItemType Directory -Force -Path "apps/windows/node_modules" | Out-Null
            Copy-Item -Recurse -Force "node_modules/react-native-windows" "apps/windows/node_modules/react-native-windows"
          }
          if ((Test-Path $appRnw) -and -not (Test-Path $rootRnw)) {
            Write-Host "Copying app RNW to root for hoisted resolution"
            Copy-Item -Recurse -Force "apps/windows/node_modules/react-native-windows" "node_modules/react-native-windows" -ErrorAction SilentlyContinue
          }
          # Also ensure react-native exists in both
          if ((Test-Path "node_modules/react-native/package.json") -and -not (Test-Path "apps/windows/node_modules/react-native")) {
            Copy-Item -Recurse -Force "node_modules/react-native" "apps/windows/node_modules/react-native" -ErrorAction SilentlyContinue
          }
          Write-Host "=== Solution file references ==="
          Select-String -Path "apps/windows/windows/HazardNet.sln" -Pattern "react-native-windows" | Select-Object -First 20
          Write-Host "=== Checking for required vcxproj files ==="
          $slnDir = "apps/windows/windows"
          $expected = @(
            "$slnDir/../../..//node_modules/react-native-windows/Folly/Folly.vcxproj",
            "$slnDir/../node_modules/react-native-windows/Folly/Folly.vcxproj"
          )
          foreach ($p in $expected) {
            $exists = Test-Path $p
            Write-Host "$p exists: $exists"
          }
          # List actual files
          Get-ChildItem "node_modules/react-native-windows/Folly" -ErrorAction SilentlyContinue | Select-Object -First 5
          Get-ChildItem "apps/windows/node_modules/react-native-windows/Folly" -ErrorAction SilentlyContinue | Select-Object -First 5

      - name: Regenerate Windows project if needed (ensures compatibility with current RNW)
        shell: pwsh
        working-directory: apps/windows
        run: |
          # If the windows folder was created with an older RNW, regenerate to match current version
          # We run init-windows --overwrite to update sln and props, but keep our custom App.windows.tsx
          Write-Host "Running init-windows --overwrite to sync with current react-native-windows version"
          # Backup our fixed files
          Copy-Item "App.windows.tsx" "App.windows.tsx.bak" -Force
          Copy-Item "src/components/WindowsDesktopOverview.tsx" "src/components/WindowsDesktopOverview.tsx.bak" -Force
          npx react-native init-windows --name HazardNet --overwrite --no-telemetry
          # Restore our fixed files
          Move-Item "App.windows.tsx.bak" "App.windows.tsx" -Force
          Move-Item "src/components/WindowsDesktopOverview.tsx.bak" "src/components/WindowsDesktopOverview.tsx" -Force
          Write-Host "After regeneration, sln references:"
          Select-String -Path "windows/HazardNet.sln" -Pattern "react-native-windows" | Select-Object -First 10
          # Ensure sln points to root for monorepo hoisting (GetDirectoryNameOfFileAbove will find it, but sln refs need to be valid)
          # The init-windows generates sln with ..\node_modules references (apps/windows/node_modules)
          # Our earlier fix changed it to ..\..\..\node_modules; after regeneration we need to ensure it works
          # We'll ensure apps/windows/node_modules/react-native-windows exists (we copied earlier)
          # So we keep the generated sln as is if that path exists, otherwise fix it to root
          if (-not (Test-Path "node_modules/react-native-windows/Folly/Folly.vcxproj") -and (Test-Path "../node_modules/react-native-windows/Folly/Folly.vcxproj")) {
            Write-Host "Root RNW not found but app RNW found, keeping generated sln"
          } elseif ((Test-Path "../../..//node_modules/react-native-windows/Folly/Folly.vcxproj") -and -not (Test-Path "node_modules/react-native-windows/Folly/Folly.vcxproj")) {
            Write-Host "Fixing sln to point to root node_modules"
            (Get-Content "windows/HazardNet.sln") -replace '\.\.\\node_modules\\react-native-windows', '..\\..\\..\\node_modules\\react-native-windows' | Set-Content "windows/HazardNet.sln"
          }
          Get-Content "windows/HazardNet.sln" | Select-String "react-native-windows" | Select-Object -First 5

      - name: Autolink Windows (regenerate native modules)
        shell: pwsh
        working-directory: apps/windows
        run: |
          npx react-native autolink-windows --logging
          Get-ChildItem "windows/HazardNet" -Filter "AutolinkedNativeModules*" | Format-Table Name, Length
          Get-Content "windows/HazardNet/AutolinkedNativeModules.g.props"

      - name: Sync app version into Package.appxmanifest
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.windows_version }}"
          if ($ver -match '^\d+\.\d+\.\d+$') { $ver4 = "$ver.0" } elseif ($ver -match '^\d+\.\d+\.\d+\.\d+$') { $ver4 = $ver } else { $ver4 = "$ver.0" }
          Write-Host "Using version $ver4 (from $ver)"
          $manifest = "apps/windows/windows/HazardNet/Package.appxmanifest"
          $content = Get-Content $manifest -Raw
          $content = $content -replace 'Version="\d+\.\d+\.\d+\.\d+"', "Version=""$ver4"""
          Set-Content -Path $manifest -Value $content -NoNewline
          Get-Content $manifest | Select-String -Pattern 'Version=' | Select-Object -First 5

      - name: Restore NuGet packages (verbose, with fallback)
        shell: pwsh
        run: |
          $sln = "apps/windows/windows/HazardNet.sln"
          Write-Host "Attempting msbuild restore for $sln with binary logger"
          msbuild "$sln" /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal /bl:restore.binlog /fl /flp:logfile=restore.log`;verbosity=detailed
          $exit = $LASTEXITCODE
          Write-Host "First restore exit code: $exit"
          Get-Content "restore.log" -ErrorAction SilentlyContinue | Select-Object -Last 100 | Write-Host
          if ($exit -ne 0) {
            Write-Warning "msbuild /t:Restore failed, trying fallbacks"
            if (Get-Command nuget -ErrorAction SilentlyContinue) {
              nuget restore "$sln" -Verbosity detailed 2>&1 | Tee-Object -FilePath nuget-restore.log
            }
            if (Get-Command dotnet -ErrorAction SilentlyContinue) {
              dotnet restore "$sln" /p:Configuration=Release /p:Platform=x64 2>&1 | Tee-Object -FilePath dotnet-restore.log
            }
            msbuild "$sln" /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal /bl:restore2.binlog /fl /flp:logfile=restore2.log`;verbosity=detailed
            if ($LASTEXITCODE -ne 0) {
              Write-Host "=== restore.log ==="; Get-Content "restore.log" -ErrorAction SilentlyContinue | Select-Object -Last 200 | Write-Host
              Write-Host "=== restore2.log ==="; Get-Content "restore2.log" -ErrorAction SilentlyContinue | Select-Object -Last 200 | Write-Host
              Write-Host "=== Listing solution dir ==="; Get-ChildItem "apps/windows/windows" | Format-Table Name, Length
              throw "NuGet restore failed after fallbacks"
            }
          }

      - name: Upload restore logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-restore-logs
          path: |
            restore.log
            restore2.log
            restore.binlog
            restore2.binlog
            nuget-restore.log
            dotnet-restore.log
            apps/windows/windows/HazardNet.sln
          if-no-files-found: warn

      - name: Build Release (x64, bundled + Hermes)
        shell: pwsh
        working-directory: apps/windows
        run: |
          Get-Content "index.windows.js"
          Get-Content "metro.config.js" | Select-Object -First 60
          # Build with binary log for diagnostics
          npx react-native run-windows --release --no-launch --no-deploy --no-packager --logging --arch x64 --bl build.binlog --fl --flp:logfile=build.log`;verbosity=minimal 2>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== build.log tail ==="
            Get-Content "build.log" -ErrorAction SilentlyContinue | Select-Object -Last 300 | Write-Host
            Write-Host "=== build-output.log tail ==="
            Get-Content "build-output.log" -ErrorAction SilentlyContinue | Select-Object -Last 300 | Write-Host
            throw "Windows Release build failed"
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-logs
          path: |
            apps/windows/build.log
            apps/windows/build-output.log
            apps/windows/build.binlog
            apps/windows/windows/HazardNet/Build/Release/**/*.log
          if-no-files-found: warn

      - name: Stage artifacts
        shell: pwsh
        run: |
          $out = "apps/windows/windows/HazardNet/Build/Release"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $ver = "${{ needs.meta.outputs.windows_version }}"
          Write-Host "Looking for build output in $out"
          Get-ChildItem "$out" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 800 | Write-Host
          if (Test-Path "$out/HazardNet.exe") {
            Copy-Item "$out/HazardNet.exe" "dist/HazardNet-windows-v$ver-x64.exe"
          } else {
            $exe = Get-ChildItem "$out" -Filter "HazardNet.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName "dist/HazardNet-windows-v$ver-x64.exe" } else { throw "HazardNet.exe not found in $out" }
          }
          $appx = Get-ChildItem "$out" -Filter "*.appx" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appx) {
            Copy-Item $appx.FullName "dist/HazardNet-windows-v$ver-x64.msix"
          } else {
            Write-Warning "No .appx package was produced; only the unpacked .exe will be published."
            $msix = Get-ChildItem "$out" -Filter "*.msix" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($msix) { Copy-Item $msix.FullName "dist/HazardNet-windows-v$ver-x64.msix" }
          }
          Get-ChildItem "dist" | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error

  windows-release:
    name: Publish Windows artifacts
    needs: [meta, android-apk, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-dist
          path: dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: HazardNet Apps ${{ needs.meta.outputs.tag }}
          body: |
            Native app binaries for HazardNet (mobile Android + Windows desktop).

            - **Android:** `HazardNet-mobile-v<version>-android.apk` — signed release APK (see workflow for signing details).
            - **Windows:** `HazardNet-windows-v<version>-x64.msix` — packaged x64 app (double-click to install on Windows 10/11), plus the unpacked `HazardNet-windows-v<version>-x64.exe`.

            Built by the `App Releases (Android APK / Windows MSIX)` workflow from `${{ github.sha }}`.
          prerelease: ${{ fromJSON(needs.meta.outputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            dist/*
