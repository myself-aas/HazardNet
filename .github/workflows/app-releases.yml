# Builds the HazardNet native apps and publishes their executables to GitHub
# Releases:
#
#   * Android: signed release APK  (apps/mobile,  Expo / React Native)
#   * Windows: Release x64 build — packaged .msix (and unpacked .exe)
#              (apps/windows, React Native for Windows / WinUI)
#
# Triggers
#   * push of a tag matching `v*`  -> assets are attached to that release
#   * manual "Run workflow"        -> a (pre-)release is created automatically,
#     named from the app versions + commit SHA
#
# Repository secrets (all optional but recommended):
#   ANDROID_KEYSTORE_BASE64   base64-encoded `android/app/keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
# Without these secrets the Android job generates a throw-away CI keystore:
# the APK is validly signed and installable, but the signing key is not
# reusable (fine for field installs, not for Play Store updates).
#
# See docs/APP_RELEASES.md for the full operator guide.

name: App Releases (Android APK / Windows MSIX)

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the created release as pre-release'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: app-releases-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      mobile_version: ${{ steps.meta.outputs.mobile_version }}
      windows_version: ${{ steps.meta.outputs.windows_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          set -euo pipefail
          MOBILE_VER="$(node -p "require('./apps/mobile/app.json').expo.version")"
          WINDOWS_VER="$(node -p "require('./apps/windows/package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            TAG="v${MOBILE_VER}-apps-${GITHUB_SHA::8}"
            PRERELEASE="${{ inputs.prerelease }}"
            [ -n "${PRERELEASE}" ] || PRERELEASE="true"
          fi
          {
            echo "tag=${TAG}"
            echo "mobile_version=${MOBILE_VER}"
            echo "windows_version=${WINDOWS_VER}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  android-apk:
    name: Build Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log
          echo "npm install succeeded"
          tail -n 50 /tmp/npm-ci.log
          echo "=== Ensuring apps/mobile/node_modules has expo (monorepo hoisting fix) ==="
          mkdir -p apps/mobile/node_modules/@expo
          if [ ! -d "apps/mobile/node_modules/expo" ]; then
            echo "Copying expo from root to apps/mobile"
            cp -r node_modules/expo apps/mobile/node_modules/expo || true
          fi
          for pkg in cli config; do
            if [ -d "node_modules/@expo/$pkg" ] && [ ! -d "apps/mobile/node_modules/@expo/$pkg" ]; then
              echo "Copying @expo/$pkg"
              cp -r "node_modules/@expo/$pkg" "apps/mobile/node_modules/@expo/$pkg" || true
            fi
          done
          for mod in expo-modules-core react-native; do
            if [ -d "node_modules/$mod" ] && [ ! -d "apps/mobile/node_modules/$mod" ]; then
              cp -r "node_modules/$mod" "apps/mobile/node_modules/$mod" || true
            fi
          done
          if [ -d "node_modules/@react-native" ]; then
            mkdir -p apps/mobile/node_modules/@react-native
            for sub in codegen cli-platform-android gradle-plugin; do
              if [ -d "node_modules/@react-native/$sub" ] && [ ! -d "apps/mobile/node_modules/@react-native/$sub" ]; then
                cp -r "node_modules/@react-native/$sub" "apps/mobile/node_modules/@react-native/$sub" || true
              fi
            done
          fi
          ls -la apps/mobile/node_modules/expo/AppEntry.js 2>&1 | head -n 5 || echo "expo AppEntry still missing"
          ls -la apps/mobile/node_modules/react-native/package.json 2>&1 | head -n 5 || echo "react-native missing in app"

      - name: Push npm logs on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-logs
          cp /tmp/npm-ci.log /tmp/ci-logs/npm-ci-${{ github.run_id }}.log 2>/dev/null || echo "no npm log" > /tmp/ci-logs/npm-ci-${{ github.run_id }}.log
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs@example.com"
          git checkout --orphan ci-logs-${{ github.run_id }}-npm-android
          git rm -rf . 2>/dev/null || true
          mkdir -p logs
          cp /tmp/ci-logs/* logs/ 2>/dev/null || true
          git add logs/
          git commit -m "ci logs npm android ${{ github.run_id }}" || true
          git push origin ci-logs-${{ github.run_id }}-npm-android --force || true

      - name: Prebuild Android (Expo)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install --clean
          ls -la android/
          cat android/gradle/wrapper/gradle-wrapper.properties || true
          cat android/settings.gradle || true

      - name: Fix Expo SDK 51 Gradle compatibility
        run: |
          set -euo pipefail
          echo "=== Fixing Expo SDK 51 Gradle issues ==="
          ANDROID_DIR="apps/mobile/android"
          PLUGIN_DIR="node_modules/expo-modules-core/expo-module-gradle-plugin"
          echo "=== Re-ensuring apps/mobile/node_modules/expo exists (monorepo fix) ==="
          mkdir -p apps/mobile/node_modules/@expo
          if [ ! -d "apps/mobile/node_modules/expo" ]; then
            cp -r node_modules/expo apps/mobile/node_modules/expo || true
          fi
          for pkg in cli config; do
            if [ -d "node_modules/@expo/$pkg" ] && [ ! -d "apps/mobile/node_modules/@expo/$pkg" ]; then
              cp -r "node_modules/@expo/$pkg" "apps/mobile/node_modules/@expo/$pkg" || true
            fi
          done
          for mod in expo-modules-core react-native; do
            if [ -d "node_modules/$mod" ] && [ ! -d "apps/mobile/node_modules/$mod" ]; then
              cp -r "node_modules/$mod" "apps/mobile/node_modules/$mod" || true
            fi
          done
          if [ -d "node_modules/@react-native" ]; then
            mkdir -p apps/mobile/node_modules/@react-native
            for sub in codegen cli-platform-android gradle-plugin; do
              if [ -d "node_modules/@react-native/$sub" ] && [ ! -d "apps/mobile/node_modules/@react-native/$sub" ]; then
                cp -r "node_modules/@react-native/$sub" "apps/mobile/node_modules/@react-native/$sub" || true
              fi
            done
          fi
          ls -lh apps/mobile/node_modules/expo/AppEntry.js || true
          echo "=== Fixing ws/WebSocketServer compatibility for @expo/cli ==="
          # Ensure ws 8.12.1 in apps/mobile (expo cli expects WebSocketServer)
          if [ -d "node_modules/ws" ]; then
            mkdir -p apps/mobile/node_modules/ws
            cp -r node_modules/ws/* apps/mobile/node_modules/ws/ 2>/dev/null || true
            # Force ws to have WebSocketServer alias if missing
            if [ -f "apps/mobile/node_modules/ws/lib/websocket-server.js" ]; then
              echo "ws has websocket-server.js"
            fi
          fi
          # Patch @expo/cli DevToolsPluginWebsocketEndpoint to use Server if WebSocketServer missing
          for f in $(find apps/mobile/node_modules/@expo/cli -type f -name "*.js" 2>/dev/null | head -n 20); do
            if grep -q "WebSocketServer" "$f" 2>/dev/null; then
              sed -i "s/WebSocketServer/Server/g" "$f" || true
            fi
          done
          for f in $(find apps/mobile/node_modules/@expo/cli -type f -name "*.ts" 2>/dev/null | head -n 20); do
            if grep -q "WebSocketServer" "$f" 2>/dev/null; then
              sed -i "s/WebSocketServer/Server/g" "$f" || true
            fi
          done
          echo "Patched @expo/cli ws usage"

          # 1. Create minimal shim plugin if missing (SDK 51 doesn't ship it)
          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "Creating minimal $PLUGIN_DIR"
            mkdir -p "$PLUGIN_DIR/src/main/java/expo/modules/plugin"
            cat > "$PLUGIN_DIR/build.gradle" <<'GRADLE'
          plugins {
            id 'java-gradle-plugin'
            id 'groovy'
          }
          group = 'expo.modules'
          version = '1.0.0'
          repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
          }
          dependencies {
            implementation gradleApi()
            implementation 'com.android.tools.build:gradle:8.2.2'
          }
          gradlePlugin {
            plugins {
              expoModule {
                id = 'expo-module-gradle-plugin'
                implementationClass = 'expo.modules.plugin.ExpoModulesGradlePlugin'
              }
            }
          }
          GRADLE
            cat > "$PLUGIN_DIR/src/main/java/expo/modules/plugin/ExpoModulesGradlePlugin.java" <<'JAVA'
          package expo.modules.plugin;
          import org.gradle.api.Plugin;
          import org.gradle.api.Project;
          public class ExpoModulesGradlePlugin implements Plugin<Project> {
            @Override
            public void apply(Project project) {
              project.afterEvaluate(p -> {
                try {
                  Object android = p.getExtensions().findByName("android");
                  if (android == null) return;
                  Class<?> cls = android.getClass();
                  boolean hasCompileSdk = false;
                  try {
                    Object val = cls.getMethod("getCompileSdkVersion").invoke(android);
                    if (val != null) hasCompileSdk = true;
                  } catch (Exception e) {
                    try {
                      Object val = cls.getMethod("getCompileSdk").invoke(android);
                      if (val != null) hasCompileSdk = true;
                    } catch (Exception e2) {}
                  }
                  if (!hasCompileSdk) {
                    try { cls.getMethod("compileSdkVersion", int.class).invoke(android, 34); } catch (Exception e) {
                      try { cls.getMethod("compileSdkVersion", String.class).invoke(android, "34"); } catch (Exception e2) {
                        try { cls.getMethod("setCompileSdkVersion", int.class).invoke(android, 34); } catch (Exception e3) {}
                      }
                    }
                  }
                  try {
                    Object defaultConfig = cls.getMethod("getDefaultConfig").invoke(android);
                    if (defaultConfig != null) {
                      Class<?> dcCls = defaultConfig.getClass();
                      try {
                        Object minVal = dcCls.getMethod("getMinSdkVersion").invoke(defaultConfig);
                        if (minVal == null) {
                          try { dcCls.getMethod("setMinSdkVersion", int.class).invoke(defaultConfig, 23); } catch (Exception ex) {}
                          try { dcCls.getMethod("minSdkVersion", int.class).invoke(defaultConfig, 23); } catch (Exception ex) {}
                        }
                      } catch (Exception e) {}
                      try {
                        Object targetVal = dcCls.getMethod("getTargetSdkVersion").invoke(defaultConfig);
                        if (targetVal == null) {
                          try { dcCls.getMethod("setTargetSdkVersion", int.class).invoke(defaultConfig, 34); } catch (Exception ex) {}
                          try { dcCls.getMethod("targetSdkVersion", int.class).invoke(defaultConfig, 34); } catch (Exception ex) {}
                        }
                      } catch (Exception e) {}
                    }
                  } catch (Exception e) {}
                } catch (Exception e) {}
              });
            }
          }
          JAVA
          fi

          # 2. Patch expo-module.config.json
          CONFIG_JSON="node_modules/expo-modules-core/expo-module.config.json"
          if [ -f "$CONFIG_JSON" ] && ! grep -q "gradlePlugins" "$CONFIG_JSON"; then
            cat > "$CONFIG_JSON" <<'JSON'
          {
            "platforms": ["apple", "android"],
            "apple": {
              "podspecPath": ["./ExpoModulesCore.podspec", "./ExpoModulesWorklets.podspec"]
            },
            "android": {
              "gradlePlugins": [
                {
                  "id": "expo-module-gradle-plugin",
                  "group": "expo.modules",
                  "sourceDir": "expo-module-gradle-plugin",
                  "applyToRootProject": false
                }
              ]
            }
          }
          JSON
          fi

          # 3. Patch for AGP 8.x: components.release and classifier -> archiveClassifier
          echo "Patching Gradle files for AGP 8 compatibility"
          for dir in "node_modules" "apps/mobile/node_modules"; do
            if [ -d "$dir" ]; then
              echo "Patching in $dir"
              # Fix components.release
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/from components\.release/from components.findByName('release') ?: components.findByName('android') ?: components.findByName('debug')/g" {} \; 2>/dev/null || true
              # Fix classifier -> archiveClassifier (Gradle 8)
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier = 'sources'/archiveClassifier.set('sources')/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier = \"sources\"/archiveClassifier.set(\"sources\")/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/\.classifier = /\\.archiveClassifier.set(/g" {} \; 2>/dev/null || true
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier = /archiveClassifier.set(/g" {} \; 2>/dev/null || true
              # Also fix use of 'classifier' property in Jar tasks
              find "$dir" -name "*.gradle" -type f -exec sed -i "s/classifier/archiveClassifier/g" {} \; 2>/dev/null || true
            fi
          done

          # 4. Downgrade Gradle wrapper to 8.6
          WRAPPER_PROP="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROP" ]; then
            sed -i "s/gradle-8\.8-all\.zip/gradle-8.6-all.zip/g" "$WRAPPER_PROP" || true
            sed -i "s/gradle-8\.7-all\.zip/gradle-8.6-all.zip/g" "$WRAPPER_PROP" || true
            cat "$WRAPPER_PROP"
          fi

          # 5. Patch settings.gradle to includeBuild shim
          SETTINGS="$ANDROID_DIR/settings.gradle"
          if ! grep -q "expo-module-gradle-plugin" "$SETTINGS"; then
            cat >> "$SETTINGS" <<'SETTINGS_PATCH'
          // --- CI patch: include expo-module-gradle-plugin shim ---
          def expoPluginPath = new File(settingsDir, "../../node_modules/expo-modules-core/expo-module-gradle-plugin")
          if (expoPluginPath.exists()) {
            includeBuild(expoPluginPath) {
              dependencySubstitution {
                substitute(module("expo.modules:expo-module-gradle-plugin")).using(project(":"))
              }
            }
          }
          SETTINGS_PATCH
          fi
          cat "$SETTINGS"

          # 6. Ensure metro.config.cjs exists with md support
          if [ ! -f "apps/mobile/metro.config.cjs" ] && [ ! -f "apps/mobile/metro.config.js" ]; then
            echo "Creating metro.config.cjs with md asset support"
            cat > apps/mobile/metro.config.cjs <<'METRO'
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          if (!config.resolver.assetExts.includes('md')) {
            config.resolver.assetExts.push('md');
          }
          module.exports = config;
          METRO
          fi
          cat apps/mobile/metro.config.cjs 2>/dev/null || cat apps/mobile/metro.config.js 2>/dev/null || echo "no metro config"
          ls apps/mobile/ | grep -E "metro|babel" || true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_DIR="apps/mobile/android/app"
          mkdir -p "${APP_DIR}"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] \
             && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${APP_DIR}/keystore.jks"
          else
            STORE_PASSWORD="hazardnet-ci"
            KEY_ALIAS="hazardnet-ci"
            KEY_PASSWORD="hazardnet-ci"
            rm -f "${APP_DIR}/keystore.jks"
            keytool -genkeypair \
              -keystore "${APP_DIR}/keystore.jks" \
              -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HazardNet CI, OU=Engineering, O=HazardNet, C=BD"
          fi
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${APP_DIR}/keystore.properties"
          cp apps/mobile/ci-signing.gradle "${APP_DIR%/*}/signing-release.gradle"
          if ! grep -q "signing-release.gradle" "${APP_DIR}/build.gradle"; then
            printf '\napply from: "../signing-release.gradle"\n' >> "${APP_DIR}/build.gradle"
          fi

      - name: Ensure local.properties
        run: |
          set -euo pipefail
          ANDROID_DIR="apps/mobile/android"
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > "${ANDROID_DIR}/local.properties"
          cat "${ANDROID_DIR}/local.properties"
          chmod +x "${ANDROID_DIR}/gradlew"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Xmx3g
        run: |
          set -euo pipefail
          ./gradlew --version
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "First build exit $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "First attempt failed, trying fallback: remove expo-module-gradle-plugin and retry"
            find ../../node_modules -name "build.gradle" -type f | xargs grep -l "expo-module-gradle-plugin" 2>/dev/null | while read f; do
              sed -i "/expo-module-gradle-plugin/d" "$f" || true
              if ! grep -q "compileSdkVersion" "$f"; then
                if grep -q "android {" "$f"; then
                  sed -i "/android {/a \    compileSdkVersion 34" "$f" || true
                else
                  echo -e "\nandroid {\n    compileSdkVersion 34\n    defaultConfig {\n        minSdkVersion 23\n        targetSdkVersion 34\n    }\n}" >> "$f" || true
                fi
              fi
            done
            find ../../apps/mobile/node_modules -name "build.gradle" -type f | xargs grep -l "expo-module-gradle-plugin" 2>/dev/null | while read f; do
              sed -i "/expo-module-gradle-plugin/d" "$f" || true
              if ! grep -q "compileSdkVersion" "$f"; then
                if grep -q "android {" "$f"; then
                  sed -i "/android {/a \    compileSdkVersion 34" "$f" || true
                else
                  echo -e "\nandroid {\n    compileSdkVersion 34\n    defaultConfig {\n        minSdkVersion 23\n        targetSdkVersion 34\n    }\n}" >> "$f" || true
                fi
              fi
            done
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
            EXIT_CODE=${PIPESTATUS[0]}
            echo "Fallback exit $EXIT_CODE"
            if [ $EXIT_CODE -ne 0 ]; then
              tail -n 500 /tmp/gradle.log
              exit $EXIT_CODE
            fi
          fi
          tail -n 300 /tmp/gradle.log
          ls -lh app/build/outputs/apk/release/ || true

      - name: Push logs to branch on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-logs
          cp /tmp/gradle.log /tmp/ci-logs/android-gradle-${{ github.run_id }}.log 2>/dev/null || echo "no log" > /tmp/ci-logs/android-gradle-${{ github.run_id }}.log
          cat apps/mobile/android/settings.gradle > /tmp/ci-logs/settings-gradle-${{ github.run_id }}.log 2>/dev/null || true
          cat apps/mobile/android/gradle/wrapper/gradle-wrapper.properties > /tmp/ci-logs/wrapper-${{ github.run_id }}.log 2>/dev/null || true
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs@example.com"
          git checkout --orphan ci-logs-${{ github.run_id }}-android
          git rm -rf . 2>/dev/null || true
          mkdir -p logs
          cp /tmp/ci-logs/* logs/ 2>/dev/null || true
          git add logs/
          git commit -m "ci logs android ${{ github.run_id }}" || true
          git push origin ci-logs-${{ github.run_id }}-android --force || true

      - name: Stage artifact
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" \
             "dist/HazardNet-mobile-v${{ needs.meta.outputs.mobile_version }}-android.apk"
          ls -lh dist

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: HazardNet Apps ${{ needs.meta.outputs.tag }}
          body: |
            Native app binaries for HazardNet (mobile Android + Windows desktop).

            - **Android:** `HazardNet-mobile-v<version>-android.apk` — signed release APK (see workflow for signing details).
            - **Windows:** `HazardNet-windows-v<version>-x64.msix` — packaged x64 app (double-click to install on Windows 10/11), plus the unpacked `HazardNet-windows-v<version>-x64.exe`.

            Built by the `App Releases (Android APK / Windows MSIX)` workflow from `${{ github.sha }}`.
          prerelease: ${{ fromJSON(needs.meta.outputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk

  windows-build:
    name: Build Windows x64
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        shell: pwsh
        run: |
          Write-Host "Node $(node -v) npm $(npm -v)"
          New-Item -ItemType Directory -Force -Path "C:\tmp" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\tmp\ci-logs" | Out-Null
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath "C:\tmp\npm-ci.log"
          $exit = $LASTEXITCODE
          Write-Host "npm install exit $exit"
          if (Test-Path "C:\tmp\npm-ci.log") {
            Write-Host "=== npm-ci.log tail ==="
            Get-Content "C:\tmp\npm-ci.log" | Select-Object -Last 300 | Write-Host
          } else {
            Write-Host "No npm-ci.log found at C:\tmp"
            Get-ChildItem "C:\tmp" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
          }
          if ($exit -ne 0) { throw "npm install failed $exit" }
          Write-Host "npm install succeeded"

      - name: Push npm logs on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tmp\ci-logs | Out-Null
          if (Test-Path "C:\tmp\npm-ci.log") { Copy-Item "C:\tmp\npm-ci.log" "C:\tmp\ci-logs\npm-ci-${{ github.run_id }}.log" -Force }
          else { "no npm log" | Set-Content "C:\tmp\ci-logs\npm-ci-${{ github.run_id }}.log" }
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs@example.com"
          git checkout --orphan "ci-logs-${{ github.run_id }}-npm-windows"
          git rm -rf . 2>$null; $null = $?
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Copy-Item "C:\tmp\ci-logs\*" logs\ -ErrorAction SilentlyContinue
          git add logs/
          git commit -m "ci logs npm windows ${{ github.run_id }}" 2>$null; $null = $?
          git push origin "ci-logs-${{ github.run_id }}-npm-windows" --force 2>&1 | Write-Host

      - name: Verify RNW layout
        shell: pwsh
        run: |
          Write-Host "=== Checking RNW ==="
          $rootRnw = "node_modules/react-native-windows/package.json"
          $appRnw = "apps/windows/node_modules/react-native-windows/package.json"
          if (Test-Path $rootRnw) { Write-Host "Root RNW"; Get-Content $rootRnw | Select-String '"version"' | Select-Object -First 1 }
          if (Test-Path $appRnw) { Write-Host "App RNW exists" } else {
            if (Test-Path $rootRnw) {
              New-Item -ItemType Directory -Force -Path "apps/windows/node_modules" | Out-Null
              Copy-Item -Recurse -Force "node_modules/react-native-windows" "apps/windows/node_modules/react-native-windows"
              Write-Host "Copied root RNW to app"
            }
          }
          if (Test-Path "node_modules/react-native/package.json") {
            if (-not (Test-Path "apps/windows/node_modules/react-native/package.json")) {
              Copy-Item -Recurse -Force "node_modules/react-native" "apps/windows/node_modules/react-native" -ErrorAction SilentlyContinue
            }
          }
          Get-Content "apps/windows/windows/HazardNet.sln" | Select-Object -First 30 | Write-Host
          Select-String -Path "apps/windows/windows/HazardNet.sln" -Pattern "react-native-windows" | Select-Object -First 10 | Write-Host
          $sln = Get-Content "apps/windows/windows/HazardNet.sln" -Raw
          $rootExists = Test-Path "node_modules/react-native-windows/Folly/Folly.vcxproj"
          $appExists = Test-Path "apps/windows/node_modules/react-native-windows/Folly/Folly.vcxproj"
          Write-Host "rootExists $rootExists appExists $appExists"
          if (-not $rootExists -and $appExists) {
            $sln = $sln -replace "\.\.\\\.\.\\\.\.\\node_modules\\react-native-windows", "..\node_modules\react-native-windows"
            Set-Content -Path "apps/windows/windows/HazardNet.sln" -Value $sln -NoNewline
          }
          if (-not $appExists -and $rootExists) {
            $sln = $sln -replace "\.\.\\node_modules\\react-native-windows", "..\..\..\node_modules\react-native-windows"
            Set-Content -Path "apps/windows/windows/HazardNet.sln" -Value $sln -NoNewline
          }
          Write-Host "=== App.windows.tsx ==="
          Get-Content "apps/windows/App.windows.tsx" | Select-Object -First 20 | Write-Host
          npx react-native config 2>&1 | Select-Object -First 50 | Write-Host

      - name: Sync app version into Package.appxmanifest
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.windows_version }}"
          if ($ver -match '^\d+\.\d+\.\d+$') { $ver4 = "$ver.0" } else { $ver4 = "$ver.0" }
          if ($ver -match '^\d+\.\d+\.\d+\.\d+$') { $ver4 = $ver }
          Write-Host "Version $ver4"
          $manifest = "apps/windows/windows/HazardNet/Package.appxmanifest"
          $content = Get-Content $manifest -Raw
          $content = $content -replace 'Version="\d+\.\d+\.\d+\.\d+"', "Version=""$ver4"""
          Set-Content -Path $manifest -Value $content -NoNewline

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $sln = "apps/windows/windows/HazardNet.sln"
          Write-Host "Restoring $sln"
          New-Item -ItemType Directory -Force -Path "C:\tmp\ci-logs" | Out-Null
          Write-Host "MSBuild version:"
          try { msbuild -version 2>&1 | Write-Host } catch { Write-Host "msbuild -version failed: $_" }
          Write-Host "dotnet info:"
          try { dotnet --info 2>&1 | Select-Object -First 30 | Write-Host } catch { Write-Host "dotnet --info failed" }
          Write-Host "Solution exists: $(Test-Path $sln)"
          Get-ChildItem "apps/windows/windows/HazardNet" | Format-Table Name, Length | Out-String | Write-Host
          Write-Host "Running msbuild restore..."
          $restoreLog = "C:\tmp\restore.log"
          if (Test-Path $restoreLog) { Remove-Item $restoreLog -Force }
          # Use PowerShell redirection with Out-File for reliability
          msbuild "$sln" /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal 2>&1 | Out-File -FilePath $restoreLog -Encoding utf8
          $exit = $LASTEXITCODE
          Write-Host "msbuild exit $exit"
          if (Test-Path $restoreLog) {
            Write-Host "=== $restoreLog ==="
            Get-Content $restoreLog | Write-Host
            Copy-Item $restoreLog "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}.log" -Force
          } else {
            Write-Host "No $restoreLog created!"
          }
          if ($exit -ne 0) {
            Write-Host "Retrying with detailed verbosity..."
            $detailedLog = "C:\tmp\restore-detailed.log"
            msbuild "$sln" /t:Restore /p:Configuration=Release /p:Platform=x64 /v:detailed 2>&1 | Out-File -FilePath $detailedLog -Encoding utf8
            if (Test-Path $detailedLog) {
              Get-Content $detailedLog | Select-Object -Last 1000 | Write-Host
              Copy-Item $detailedLog "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}-detailed.log" -Force -ErrorAction SilentlyContinue
            }
            throw "Restore failed $exit"
          }

      - name: Build Release (x64)
        shell: pwsh
        working-directory: apps/windows
        run: |
          npx react-native run-windows --release --no-launch --no-deploy --no-packager --logging --arch x64 2>&1 | Tee-Object -FilePath build.log
          $exit = $LASTEXITCODE
          Write-Host "Build exit $exit"
          if (Test-Path build.log) {
            Get-Content build.log | Select-Object -Last 800 | Write-Host
          }
          if ($exit -ne 0) { throw "Build failed $exit" }

      - name: Push logs on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tmp\ci-logs | Out-Null
          Write-Host "=== Collecting logs ==="
          Get-ChildItem "C:\tmp" -Filter "*.log" -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
          if (Test-Path "C:\tmp\restore.log") {
            Copy-Item "C:\tmp\restore.log" "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}.log" -Force
            Write-Host "Copied C:\tmp\restore.log"
          }
          $foundRestore = Get-ChildItem -Path . -Filter "restore.log" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($foundRestore) {
            Copy-Item $foundRestore.FullName "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}-found.log" -Force
            Write-Host "Found restore.log at $($foundRestore.FullName)"
          }
          if (-not (Test-Path "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}.log")) {
            if (Test-Path restore.log) {
              Copy-Item restore.log "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}.log" -Force
              Write-Host "Copied ./restore.log"
            } else {
              "No restore.log found - listing files" | Set-Content "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}.log"
              Get-ChildItem -Path . -Filter "*.log" -Recurse -ErrorAction SilentlyContinue | Format-Table FullName, Length | Out-String | Add-Content "C:\tmp\ci-logs\windows-restore-${{ github.run_id }}.log"
            }
          }
          $foundBuild = Get-ChildItem -Path . -Filter "build.log" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($foundBuild) { Copy-Item $foundBuild.FullName "C:\tmp\ci-logs\windows-build-${{ github.run_id }}.log" -Force }
          elseif (Test-Path "apps/windows/build.log") { Copy-Item "apps/windows/build.log" "C:\tmp\ci-logs\windows-build-${{ github.run_id }}.log" -Force }
          elseif (Test-Path "C:\tmp\build.log") { Copy-Item "C:\tmp\build.log" "C:\tmp\ci-logs\windows-build-${{ github.run_id }}.log" -Force }
          else { "No build.log" | Set-Content "C:\tmp\ci-logs\windows-build-${{ github.run_id }}.log" }
          Get-ChildItem "apps/windows/windows/HazardNet" -ErrorAction SilentlyContinue | Out-String | Set-Content "C:\tmp\ci-logs\windows-dir-${{ github.run_id }}.txt"
          Get-ChildItem "C:\tmp\ci-logs" | Format-Table Name, Length | Out-String | Write-Host
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs@example.com"
          git checkout --orphan "ci-logs-${{ github.run_id }}-windows"
          git rm -rf . 2>$null; $null = $?
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Copy-Item "C:\tmp\ci-logs\*" logs\ -ErrorAction SilentlyContinue
          git add logs/
          git commit -m "ci logs windows ${{ github.run_id }}" 2>$null; $null = $?
          git push origin "ci-logs-${{ github.run_id }}-windows" --force 2>&1 | Write-Host

      - name: Stage artifacts
        if: success()
        shell: pwsh
        run: |
          $out = "apps/windows/windows/HazardNet/Build/Release"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $ver = "${{ needs.meta.outputs.windows_version }}"
          if (Test-Path "$out/HazardNet.exe") {
            Copy-Item "$out/HazardNet.exe" "dist/HazardNet-windows-v$ver-x64.exe"
          } else {
            $exe = Get-ChildItem "$out" -Filter "HazardNet.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName "dist/HazardNet-windows-v$ver-x64.exe" } else { throw "HazardNet.exe not found" }
          }
          $appx = Get-ChildItem "$out" -Filter "*.appx" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appx) { Copy-Item $appx.FullName "dist/HazardNet-windows-v$ver-x64.msix" }
          Get-ChildItem "dist" | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error

  windows-release:
    name: Publish Windows artifacts
    needs: [meta, android-apk, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-dist
          path: dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: HazardNet Apps ${{ needs.meta.outputs.tag }}
          body: |
            Native app binaries for HazardNet (mobile Android + Windows desktop).

            - **Android:** `HazardNet-mobile-v<version>-android.apk` — signed release APK (see workflow for signing details).
            - **Windows:** `HazardNet-windows-v<version>-x64.msix` — packaged x64 app (double-click to install on Windows 10/11), plus the unpacked `HazardNet-windows-v<version>-x64.exe`.

            Built by the `App Releases (Android APK / Windows MSIX)` workflow from `${{ github.sha }}`.
          prerelease: ${{ fromJSON(needs.meta.outputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            dist/*
