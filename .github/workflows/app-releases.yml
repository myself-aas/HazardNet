# Builds the HazardNet native apps and publishes their executables to GitHub
# Releases:
#
#   * Android: signed release APK  (apps/mobile,  Expo / React Native)
#   * Windows: Release x64 build — packaged .msix (and unpacked .exe)
#              (apps/windows, React Native for Windows / WinUI)
#
# Triggers
#   * push of a tag matching `v*`  -> assets are attached to that release
#   * manual "Run workflow"        -> a (pre-)release is created automatically,
#     named from the app versions + commit SHA
#
# Repository secrets (all optional but recommended):
#   ANDROID_KEYSTORE_BASE64   base64-encoded `android/app/keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
# Without these secrets the Android job generates a throw-away CI keystore:
# the APK is validly signed and installable, but the signing key is not
# reusable (fine for field installs, not for Play Store updates).
#
# See docs/APP_RELEASES.md for the full operator guide.

name: App Releases (Android APK / Windows MSIX)

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the created release as pre-release'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: app-releases-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      mobile_version: ${{ steps.meta.outputs.mobile_version }}
      windows_version: ${{ steps.meta.outputs.windows_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          set -euo pipefail
          MOBILE_VER="$(node -p "require('./apps/mobile/app.json').expo.version")"
          WINDOWS_VER="$(node -p "require('./apps/windows/package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            TAG="v${MOBILE_VER}-apps-${GITHUB_SHA::8}"
            PRERELEASE="${{ inputs.prerelease }}"
            [ -n "${PRERELEASE}" ] || PRERELEASE="true"
          fi
          {
            echo "tag=${TAG}"
            echo "mobile_version=${MOBILE_VER}"
            echo "windows_version=${WINDOWS_VER}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  android-apk:
    name: Build Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          ls -la node_modules/.bin/expo || true
          ls -la apps/mobile/node_modules 2>&1 | head -n 20 || true
          ls -la node_modules/react-native 2>&1 | head -n 5 || true

      - name: Prebuild Android (Expo)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          set -x
          npx expo prebuild --platform android --no-install --clean
          ls -la android/
          ls -la android/app/ | head -n 100
          cat android/gradle.properties | head -n 80

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set -x
          APP_DIR="apps/mobile/android/app"
          mkdir -p "${APP_DIR}"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] \
             && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Using repository keystore"
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${APP_DIR}/keystore.jks"
          else
            STORE_PASSWORD="hazardnet-ci"
            KEY_ALIAS="hazardnet-ci"
            KEY_PASSWORD="hazardnet-ci"
            rm -f "${APP_DIR}/keystore.jks"
            keytool -genkeypair \
              -keystore "${APP_DIR}/keystore.jks" \
              -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HazardNet CI, OU=Engineering, O=HazardNet, C=BD"
            echo "::warning::Using throw-away CI keystore"
          fi
          ls -lh "${APP_DIR}/keystore.jks"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${APP_DIR}/keystore.properties"
          cat "${APP_DIR}/keystore.properties"
          cp apps/mobile/ci-signing.gradle "${APP_DIR%/*}/signing-release.gradle"
          if ! grep -q "signing-release.gradle" "${APP_DIR}/build.gradle"; then
            printf '\napply from: "../signing-release.gradle"\n' >> "${APP_DIR}/build.gradle"
          fi
          tail -n 30 "${APP_DIR}/build.gradle"

      - name: Ensure local.properties
        run: |
          set -euo pipefail
          ANDROID_DIR="apps/mobile/android"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "sdk.dir=${ANDROID_HOME}" > "${ANDROID_DIR}/local.properties"
          cat "${ANDROID_DIR}/local.properties"
          chmod +x "${ANDROID_DIR}/gradlew"
          ls -lh "${ANDROID_DIR}/gradlew"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Xmx3g
        run: |
          set -euo pipefail
          set -x
          ./gradlew --version
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "=== Gradle log tail ==="
          tail -n 300 /tmp/gradle.log
          ls -lh app/build/outputs/apk/release/ || true

      - name: Push logs to branch on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-logs
          cp /tmp/gradle.log /tmp/ci-logs/android-gradle-${{ github.run_id }}.log 2>/dev/null || echo "no gradle log" > /tmp/ci-logs/android-gradle-${{ github.run_id }}.log
          ls -la apps/mobile/android/ 2>/dev/null | head -n 100 > /tmp/ci-logs/android-dir-${{ github.run_id }}.txt || true
          cat apps/mobile/android/app/build.gradle 2>/dev/null | tail -n 100 > /tmp/ci-logs/build-gradle-tail-${{ github.run_id }}.txt || true
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs@example.com"
          git checkout --orphan ci-logs-${{ github.run_id }}
          git rm -rf . 2>/dev/null || true
          mkdir -p logs
          cp /tmp/ci-logs/* logs/ 2>/dev/null || true
          git add logs/
          git commit -m "ci logs for run ${{ github.run_id }} android" || echo "no commit"
          git push origin ci-logs-${{ github.run_id }} --force || echo "push failed"

      - name: Stage artifact
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" \
             "dist/HazardNet-mobile-v${{ needs.meta.outputs.mobile_version }}-android.apk"
          ls -lh dist

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: HazardNet Apps ${{ needs.meta.outputs.tag }}
          body: |
            Native app binaries for HazardNet (mobile Android + Windows desktop).

            - **Android:** `HazardNet-mobile-v<version>-android.apk` — signed release APK (see workflow for signing details).
            - **Windows:** `HazardNet-windows-v<version>-x64.msix` — packaged x64 app (double-click to install on Windows 10/11), plus the unpacked `HazardNet-windows-v<version>-x64.exe`.

            Built by the `App Releases (Android APK / Windows MSIX)` workflow from `${{ github.sha }}`.
          prerelease: ${{ fromJSON(needs.meta.outputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk

  windows-build:
    name: Build Windows x64
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify RNW layout and ensure compatibility
        shell: pwsh
        run: |
          Write-Host "Node $(node -v) npm $(npm -v)"
          $rootRnw = "node_modules/react-native-windows/package.json"
          $appRnw = "apps/windows/node_modules/react-native-windows/package.json"
          if (Test-Path $rootRnw) { Write-Host "Found root RNW"; Get-Content $rootRnw | Select-String '"version"' | Select-Object -First 1 }
          else { Write-Host "Root RNW NOT found" }
          if (Test-Path $appRnw) { Write-Host "Found app RNW"; Get-Content $appRnw | Select-String '"version"' | Select-Object -First 1 }
          else { Write-Host "App RNW NOT found, will copy from root if exists" }
          if ((Test-Path $rootRnw) -and -not (Test-Path $appRnw)) {
            New-Item -ItemType Directory -Force -Path "apps/windows/node_modules" | Out-Null
            Copy-Item -Recurse -Force "node_modules/react-native-windows" "apps/windows/node_modules/react-native-windows"
            Write-Host "Copied root RNW to app location"
          }
          if ((Test-Path "node_modules/react-native/package.json") -and -not (Test-Path "apps/windows/node_modules/react-native/package.json")) {
            Copy-Item -Recurse -Force "node_modules/react-native" "apps/windows/node_modules/react-native" -ErrorAction SilentlyContinue
          }
          Write-Host "Solution refs:"
          Select-String -Path "apps/windows/windows/HazardNet.sln" -Pattern "react-native-windows" | Select-Object -First 5
          # Ensure sln points to a valid location; if it points to root but root doesn't have file, fix to app
          $slnContent = Get-Content "apps/windows/windows/HazardNet.sln" -Raw
          if ($slnContent -match "\.\.\\\.\.\\\.\.\\node_modules\\react-native-windows" -and -not (Test-Path "node_modules/react-native-windows/Folly/Folly.vcxproj")) {
            Write-Host "Sln points to root but root file missing, fixing to app path"
            $slnContent = $slnContent -replace "\.\.\\\.\.\\\.\.\\node_modules\\react-native-windows", "..\node_modules\react-native-windows"
            Set-Content -Path "apps/windows/windows/HazardNet.sln" -Value $slnContent -NoNewline
          }
          if ($slnContent -match "\.\.\\node_modules\\react-native-windows" -and -not (Test-Path "apps/windows/node_modules/react-native-windows/Folly/Folly.vcxproj") -and (Test-Path "node_modules/react-native-windows/Folly/Folly.vcxproj")) {
            Write-Host "Sln points to app but app file missing, fixing to root path"
            $slnContent = $slnContent -replace "\.\.\\node_modules\\react-native-windows", "..\..\..\node_modules\react-native-windows"
            Set-Content -Path "apps/windows/windows/HazardNet.sln" -Value $slnContent -NoNewline
          }
          Select-String -Path "apps/windows/windows/HazardNet.sln" -Pattern "react-native-windows" | Select-Object -First 5

      - name: Sync app version into Package.appxmanifest
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.windows_version }}"
          if ($ver -match '^\d+\.\d+\.\d+$') { $ver4 = "$ver.0" } else { $ver4 = "$ver.0" }
          if ($ver -match '^\d+\.\d+\.\d+\.\d+$') { $ver4 = $ver }
          Write-Host "Version $ver4 from $ver"
          $manifest = "apps/windows/windows/HazardNet/Package.appxmanifest"
          $content = Get-Content $manifest -Raw
          $content = $content -replace 'Version="\d+\.\d+\.\d+\.\d+"', "Version=""$ver4"""
          Set-Content -Path $manifest -Value $content -NoNewline
          Get-Content $manifest | Select-String "Version=" | Select-Object -First 3

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $sln = "apps/windows/windows/HazardNet.sln"
          Write-Host "Restoring $sln"
          msbuild "$sln" /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal 2>&1 | Tee-Object -FilePath restore.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== restore.log ==="
            Get-Content restore.log | Select-Object -Last 200 | Write-Host
            throw "Restore failed with exit $LASTEXITCODE"
          }
          Write-Host "Restore succeeded"
          Get-Content restore.log | Select-Object -Last 50 | Write-Host

      - name: Build Release (x64, bundled + Hermes)
        shell: pwsh
        working-directory: apps/windows
        run: |
          Write-Host "=== index.windows.js ==="; Get-Content index.windows.js
          Write-Host "=== App.windows.tsx head ==="; Get-Content App.windows.tsx | Select-Object -First 30
          Write-Host "=== metro.config.js ==="; Get-Content metro.config.js | Select-Object -First 50
          npx react-native run-windows --release --no-launch --no-deploy --no-packager --logging --arch x64 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== build.log tail ==="; Get-Content build.log | Select-Object -Last 500 | Write-Host
            throw "Build failed"
          }
          Write-Host "Build succeeded"
          Get-Content build.log | Select-Object -Last 100 | Write-Host

      - name: Push logs to branch on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tmp\ci-logs | Out-Null
          Copy-Item restore.log C:\tmp\ci-logs\windows-restore-${{ github.run_id }}.log -ErrorAction SilentlyContinue
          Copy-Item apps/windows/build.log C:\tmp\ci-logs\windows-build-${{ github.run_id }}.log -ErrorAction SilentlyContinue
          Get-ChildItem apps/windows/windows/HazardNet -ErrorAction SilentlyContinue | Out-String | Set-Content C:\tmp\ci-logs\windows-dir-${{ github.run_id }}.txt
          git config user.name "ci-logs-bot"
          git config user.email "ci-logs@example.com"
          git checkout --orphan ci-logs-${{ github.run_id }}
          git rm -rf . 2>$null; $null = $?
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Copy-Item C:\tmp\ci-logs\* logs\ -ErrorAction SilentlyContinue
          git add logs/
          git commit -m "ci logs for run ${{ github.run_id }} windows" 2>$null; $null = $?
          git push origin ci-logs-${{ github.run_id }} --force 2>&1 | Write-Host

      - name: Stage artifacts
        if: success()
        shell: pwsh
        run: |
          $out = "apps/windows/windows/HazardNet/Build/Release"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $ver = "${{ needs.meta.outputs.windows_version }}"
          Write-Host "Searching $out"
          Get-ChildItem "$out" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Select-Object -First 20 | Write-Host
          if (Test-Path "$out/HazardNet.exe") {
            Copy-Item "$out/HazardNet.exe" "dist/HazardNet-windows-v$ver-x64.exe"
          } else {
            $exe = Get-ChildItem "$out" -Filter "HazardNet.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName "dist/HazardNet-windows-v$ver-x64.exe" } else { throw "HazardNet.exe not found" }
          }
          $appx = Get-ChildItem "$out" -Filter "*.appx" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($appx) { Copy-Item $appx.FullName "dist/HazardNet-windows-v$ver-x64.msix" }
          else {
            $msix = Get-ChildItem "$out" -Filter "*.msix" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($msix) { Copy-Item $msix.FullName "dist/HazardNet-windows-v$ver-x64.msix" }
          }
          Get-ChildItem "dist" | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: windows-dist
          path: dist/
          if-no-files-found: error

  windows-release:
    name: Publish Windows artifacts
    needs: [meta, android-apk, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-dist
          path: dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: HazardNet Apps ${{ needs.meta.outputs.tag }}
          body: |
            Native app binaries for HazardNet (mobile Android + Windows desktop).

            - **Android:** `HazardNet-mobile-v<version>-android.apk` — signed release APK (see workflow for signing details).
            - **Windows:** `HazardNet-windows-v<version>-x64.msix` — packaged x64 app (double-click to install on Windows 10/11), plus the unpacked `HazardNet-windows-v<version>-x64.exe`.

            Built by the `App Releases (Android APK / Windows MSIX)` workflow from `${{ github.sha }}`.
          prerelease: ${{ fromJSON(needs.meta.outputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            dist/*
