name: Firebase deployment verify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-production-verify
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: forecast-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read forecast metadata with the trusted server identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo 'Configure the Firebase service account secret'; exit 1; }
          node --input-type=module -e "import {getForecastStore} from './backend/forecastStore.js'; const date=await getForecastStore().getLatestPredictionDate(); if(!date) throw new Error('Forecast store empty'); console.log({prediction_date:date});"
