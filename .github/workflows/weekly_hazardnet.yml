name: Weekly HazardNet Pipeline (Kaggle -> Firestore -> Firebase Hosting)

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (06:00 AM Bangladesh Standard Time)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: weekly-hazardnet-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas requests firebase-admin

      - name: 4. Configure Kaggle Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: 5. Trigger Kaggle Notebook Kernel
        run: |
          echo "🚀 Pushing & executing Kaggle forecast notebook..."
          kaggle kernels push -p ./kaggle_notebooks/hazardnet-auto-forecast-pipeline

      - name: 6. Poll Kaggle Notebook & Download Prediction CSV
        env:
          KAGGLE_NOTEBOOK_SLUG: "ashifahmedshuvo/hazardnet-auto-forecast-pipeline"
          MAX_POLL_ATTEMPTS: "120"
          POLL_INTERVAL: "30"
        run: |
          python scripts/poll_and_download.py

      - name: 7. Ingest & Update Firebase Firestore Database
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "🔥 Batch writing 7-day and 15-day predictions into Firestore..."
          python scripts/update_firestore.py hazardnet_forecasts_latest.csv

      - name: 8. Set up Node.js for Web Application
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 9. Build Frontend Web Application
        run: |
          npm ci
          npm run build

      - name: 10. Deploy Application to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: hazardnet-app
