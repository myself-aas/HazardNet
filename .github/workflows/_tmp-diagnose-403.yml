name: Diagnose 403 (temporary)

# TEMPORARY diagnostic. Probes the production origin from a GitHub runner
# (unrestricted egress) and commits the findings back to the branch so they can
# be read without runner-log access. Delete once the 403 is identified.
#
# Goal: decide between three hypotheses for the site-health 403s —
#   H1  Cloudflare WAF / bot defence refusing the request
#   H2  Firebase Hosting origin refusing (Host header not registered)
#   H3  stale deployment: Cloudflare cache serving old HTML at 200 while the
#       origin 403s everything not already cached
#
# Discriminators captured per request:
#   cf-ray, server, cf-cache-status, age, via   -> was this Cloudflare, cached?
#   x-fh-requested-host, x-served-by            -> Firebase origin answered
#   x-vercel-id, server: Vercel                 -> Vercel origin answered
#   body snippet                                -> Cloudflare error page? which one?

on:
  # Push, not workflow_dispatch: the token available here cannot dispatch
  # ("Resource not accessible by integration"), and ci.yml only fires for
  # main/develop, so nothing runs on this branch by default.
  #
  # paths-ignore plus "[skip ci]" in the commit message below keep the workflow
  # from re-triggering itself when it commits its own report.
  push:
    paths-ignore:
      - 'docs/ops/_tmp-403-probe.md'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe the origin
        shell: bash
        run: |
          set -uo pipefail
          UA_BROWSER='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          UA_PLAIN='curl-diagnostic'
          REPORT=/tmp/report.md
          CB=$RANDOM$RANDOM

          emit() { printf '%s\n' "$*" >> "$REPORT"; }

          emit '# 403 diagnostic — from a GitHub runner'
          emit ''
          emit "- ran at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          emit "- ref: ${{ github.ref_name }}"
          emit "- runner egress: unrestricted"
          emit ''

          emit '## DNS as seen from the runner'
          emit '```'
          for h in hazardnet.live www.hazardnet.live; do
            emit "--- $h"
            getent hosts "$h" >> "$REPORT" 2>/dev/null || emit "  (no record)"
          done
          emit '```'
          emit ''

          probe() {
            local label="$1" url="$2" ua="$3"
            local code headers body
            headers=/tmp/h.txt; body=/tmp/b.txt
            code=$(curl -sSL --max-redirs 5 -A "$ua" \
                    -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
                    -H 'Accept-Language: en-US,en;q=0.9' \
                    -D "$headers" -o "$body" -w '%{http_code}|%{url_effective}' \
                    --max-time 30 "$url" 2>/dev/null) || code="000|curl-failed"
            local st="${code%%|*}" eff="${code#*|}"
            emit "### \`$label\`"
            emit ''
            emit "- url: \`$url\`"
            emit "- UA: \`${ua:0:24}…\`"
            emit "- **HTTP $st**"
            emit "- effective: \`$eff\`"
            emit ''
            emit '```'
            grep -iE '^(HTTP/|server:|cf-ray|cf-cache-status|cf-mitigated|age:|via:|cache-control:|content-type:|x-fh-requested-host|x-served-by|x-vercel|x-cache|location:)' \
              "$headers" | sed 's/^/  /' >> "$REPORT" || emit '  (no headers matched)'
            emit '```'
            emit ''
            emit 'body (first 400 bytes, whitespace collapsed):'
            emit '```'
            head -c 400 "$body" | tr -d '\r' | tr '\n' ' ' | cut -c1-400 >> "$REPORT"
            emit ''
            emit '```'
            emit ''
          }

          emit '## Hypothesis H3 — is the 200 a Cloudflare cache HIT?'
          emit ''
          emit 'The same path with and without a cache-busting query string. If the'
          emit 'plain URL returns 200 and the cache-busted one returns 403, the origin'
          emit 'is refusing everything and Cloudflare cache is masking it for paths it'
          emit 'already had. That is the decisive test.'
          emit ''
          probe '/ (plain)'            "https://hazardnet.live/"                 "$UA_BROWSER"
          probe '/ (cache-busted)'     "https://hazardnet.live/?cb=$CB"          "$UA_BROWSER"
          emit '---'
          emit ''

          emit '## Failing paths (browser-like UA, as site-health sends)'
          emit ''
          probe '/status'                     "https://hazardnet.live/status"                     "$UA_BROWSER"
          probe '/sitemap.xml'                "https://hazardnet.live/sitemap.xml"                "$UA_BROWSER"
          probe '/data/freshness.json'        "https://hazardnet.live/data/freshness.json"        "$UA_BROWSER"
          probe '/data/content-index.json'    "https://hazardnet.live/data/content-index.json"    "$UA_BROWSER"
          probe '/data/forecasts-latest.json' "https://hazardnet.live/data/forecasts-latest.json" "$UA_BROWSER"
          probe '/api/v1/forecasts/metadata'  "https://hazardnet.live/api/v1/forecasts/metadata"  "$UA_BROWSER"
          emit '---'
          emit ''

          emit '## H1 — bot defence? same paths with a non-browser UA'
          emit ''
          emit 'If these differ from the browser-UA results, Cloudflare bot handling'
          emit 'is involved (site-health already sends a Chrome UA, so a difference'
          emit 'here would mean the UA is not the discriminator).'
          emit ''
          probe '/ (plain UA)'         "https://hazardnet.live/"                "$UA_PLAIN"
          probe '/status (plain UA)'   "https://hazardnet.live/status"          "$UA_PLAIN"
          probe '/data/freshness.json (plain UA)' "https://hazardnet.live/data/freshness.json" "$UA_PLAIN"
          emit '---'
          emit ''

          emit '## Control — a path that has never existed'
          emit ''
          emit 'Shapes what the origin does for an unknown path. If this also 403s,'
          emit 'the origin refuses everything and every 200 above is a cache artefact.'
          emit ''
          probe '/__probe-does-not-exist' "https://hazardnet.live/__probe-does-not-exist" "$UA_BROWSER"
          emit '---'
          emit ''

          emit '## Apex vs www'
          emit ''
          probe 'www /'        "https://www.hazardnet.live/"       "$UA_BROWSER"
          probe 'www /status'  "https://www.hazardnet.live/status" "$UA_BROWSER"

      - name: Commit the report
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs/ops
          cp /tmp/report.md docs/ops/_tmp-403-probe.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ops/_tmp-403-probe.md
          if git diff --staged --quiet; then echo "no report produced"; exit 1; fi
          git commit -m "chore(diag): temporary 403 origin probe $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
