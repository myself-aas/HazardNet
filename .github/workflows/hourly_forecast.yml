name: Hourly Forecast Refresh (Kaggle Notebook Output)

# Refresher cadence — downloads the Kaggle notebook's *latest-run* CSV output
# (`kaggle kernels output ashifahmedshuvo/hazardnet-auto-forecast-pipeline`),
# validates it, ingests it into the forecast store, rebuilds the static
# website snapshot, and commits. Never re-executes the notebook (the daily
# forecast-pipeline.yml is the producer). See docs/ops/hourly_forecast.md.
#
# Why the site is guaranteed to carry hourly data:
#  1. API path — ingestion updates the store behind GET /api/v1/forecasts/bulk.
#  2. Codebase path — the committed frontend/public/data/forecasts-latest.json
#     snapshot ships with every deployment; useForecasts() falls back to it
#     when the API is unreachable.

on:
  schedule:
    # Every hour at minute 5 UTC.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Ingest + commit even when the notebook output is unchanged'
        required: false
        default: 'false'

concurrency:
  group: hourly-forecast-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORECAST_STORE: ${{ vars.FORECAST_STORE || 'supabase' }}
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_SSL: 'true'
  KAGGLE_KERNEL: ashifahmedshuvo/hazardnet-auto-forecast-pipeline

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-pipeline.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install --requirement scripts/requirements-pipeline.txt

      - name: Preflight — verify required secrets
        shell: bash
        run: |
          missing=0
          for var in KAGGLE_USERNAME KAGGLE_KEY BACKEND_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "❌ '$var' is not configured (repo → Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          if [ "$FORECAST_STORE" = "supabase" ] && [ -z "$DATABASE_URL" ]; then
            echo "❌ FORECAST_STORE=supabase but SUPABASE_DB_URL secret is not set."
            echo "   Apply scripts/db/*.sql in Supabase, then add the service-role Postgres"
            echo "   connection string as SUPABASE_DB_URL (see docs/ops/hourly_forecast.md)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ Required secrets present (store: $FORECAST_STORE)."
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}

      - name: Fetch latest Kaggle notebook output
        id: fetch
        shell: bash
        run: |
          set -o pipefail
          python scripts/fetch_kaggle_forecast.py --attempts 3 --retry-delay 30 2>&1 | tee fetch.log
          CHANGED=$(grep -oE 'CHANGED=(true|false)' fetch.log | tail -n 1 | cut -d= -f2)
          echo "changed=${CHANGED:-true}" >> "$GITHUB_OUTPUT"
          echo "notebook output changed: ${CHANGED:-true}"

      - name: Validate forecast data
        if: steps.fetch.outputs.changed == 'true' || inputs.force_refresh == 'true'
        shell: bash
        run: |
          # --skip-freshness: the notebook runs on its own cadence, so its
          # latest output may be days old between runs — schema/range checks
          # still gate, staleness only warns (the fetch step emits it).
          python scripts/validate_forecasts.py --skip-freshness

      - name: Rebuild website snapshot
        if: steps.fetch.outputs.changed == 'true' || inputs.force_refresh == 'true'
        shell: bash
        run: node scripts/build_forecast_snapshot.mjs

      - name: Ingest CSV into the forecast store
        if: steps.fetch.outputs.changed == 'true' || inputs.force_refresh == 'true'
        shell: bash
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          PORT: '3001'
        run: |
          node backend/server.js > backend-server.log 2>&1 &
          echo $! > backend-server.pid
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/health" > /dev/null; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ Backend failed to become healthy. Server log:"
              cat backend-server.log
              exit 1
            fi
            sleep 2
          done
          HTTP_CODE=$(curl -sS -X POST "http://localhost:${PORT}/api/v1/forecasts/update" \
            -H "Authorization: Bearer $BACKEND_API_KEY" \
            -F "file=@backend/data/forecasts/hazardnet_forecasts_latest.csv" \
            -o ingest_response.json \
            -w "%{http_code}")
          echo "📥 Ingest responded HTTP $HTTP_CODE:"
          cat ingest_response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Ingestion failed with HTTP $HTTP_CODE"
            exit 1
          fi
          jq -e '.status == "success"' ingest_response.json > /dev/null

      - name: Stop backend server
        if: always()
        shell: bash
        run: |
          if [ -f backend-server.pid ]; then
            kill "$(cat backend-server.pid)" 2>/dev/null || true
          fi
          pkill -f "backend/server\\.js" 2>/dev/null || true

      - name: Commit refreshed data
        if: steps.fetch.outputs.changed == 'true' || inputs.force_refresh == 'true'
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/forecasts/ frontend/public/data/forecasts-latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            PREDICTION_DATE=$(jq -r '.prediction_date // "unknown"' backend/data/forecasts/manifest.json 2>/dev/null || echo unknown)
            git commit -m "chore(data): hourly forecast refresh ${PREDICTION_DATE}" \
              -m "Source: kaggle kernels output ${KAGGLE_KERNEL}" \
              -m "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            git push
          fi

      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.fetch.outputs.changed }}" = "true" ] || [ "${{ inputs.force_refresh }}" = "true" ]; then
            {
              echo "### Hourly forecast refresh — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              jq -r '"- prediction_date: " + (.prediction_date // "unknown") + "\n- rows: " + ((.row_count // 0) | tostring)' backend/data/forecasts/manifest.json 2>/dev/null || echo "- manifest unavailable"
              if [ -f ingest_response.json ]; then
                jq -r '"- ingested: " + ((.records_updated // 0) | tostring) + " (skipped " + ((.records_skipped // 0) | tostring) + ")"' ingest_response.json
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Hourly forecast refresh — no change (notebook output unchanged)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: hourly-forecast-diagnostics
          path: |
            backend-server.log
            ingest_response.json
            fetch.log
            data/kaggle_notebook_output/
          if-no-files-found: ignore
