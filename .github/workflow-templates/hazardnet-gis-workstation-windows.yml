# =============================================================================
# HazardNet CI/Release workflow template - GIS Workstation (Windows, .NET/MSBuild)
#
# This file lives in .github/workflow-templates/ inside the HazardNet
# repository and is NOT executed there: GitHub Actions only runs workflows
# stored in .github/workflows/. To adopt it, copy this file into the Windows
# product repository as .github/workflows/hazardnet-gis-workstation-windows.yml,
# then edit the CONFIGURATION block below (SOLUTION_OR_PROJECT is required).
# See .github/workflow-templates/README.md for adoption steps, secrets and
# tag conventions.
#
# CI (every pull request and push to the default branch), on windows-latest:
#   - fail-fast check that the configured solution/project exists
#   - NuGet restore (msbuild /t:Restore by default; overridable)
#   - MSBuild build (configurable configuration/platform/runtime identifier)
#   - tests via a configurable command (dotnet test by default; '' disables)
#   - packaging: publish output + zip, or a custom installer script (Inno/WiX)
#   - optional Authenticode signing when certificate secrets are present
#   - package uploaded as a CI artifact
#
# Release (gated):
#   - only on a pushed strict-semver tag (vMAJOR.MINOR.PATCH[-pre][+build])
#     or a manual dispatch with release=true targeting a tag
#   - installer/package plus SHA256SUMS attached to a GitHub Release via the
#     protected 'release' environment (create it in the product repository)
# =============================================================================

name: GIS Workstation (Windows) CI & Release

on:
  push:
    branches:
      - main # <<< EDIT: default branch of the product repository
    tags:
      - 'v*' # release-gate enforces strict semver before anything publishes
  pull_request: # validation for pull requests targeting any branch
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release from this run (a semver tag is required)'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Tag to publish (e.g. v1.2.3); required only when dispatching from a branch instead of a tag'
        required: false
        type: string
        default: ''

# Least privilege by default; only the release job escalates to contents:write.
permissions:
  contents: read

concurrency:
  # One lane per event type + ref, so validation runs cancel stale peers but
  # release runs (tag push or manual dispatch) are never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

env:
  # ---------------------------------------------------------------------------
  # CONFIGURATION - edit these defaults after copying into the product repo.
  # Every value is a plain string; an empty string disables the related step.
  # ---------------------------------------------------------------------------
  SOLUTION_OR_PROJECT: ./src/REPLACE_ME.sln # <<< EDIT (required): .sln or .*proj path
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: Any CPU # e.g. x64 for many desktop solutions
  RUNTIME_IDENTIFIER: win-x64 # '' omits -r/--self-contained and RID MSBuild property
  SELF_CONTAINED: 'false' # used with RUNTIME_IDENTIFIER for dotnet publish
  DOTNET_VERSION: '9.0.x' # '' when the solution only targets .NET Framework (skip SDK setup)
  RESTORE_COMMAND: '' # override restore, e.g. 'dotnet restore' or 'nuget restore'
  MSBUILD_EXTRA_ARGS: '' # extra MSBuild arguments appended to the build
  TEST_COMMAND: 'dotnet test --no-build' # '' disables tests; e.g. 'dotnet vstest tests/bin/Release/*.Tests.dll'
  PACKAGE_COMMAND: '' # override packaging entirely, e.g. 'msbuild /t:Publish /p:PublishProfile=FolderProfile'
  INSTALLER_SCRIPT: '' # e.g. './scripts/build-installer.ps1' (Inno Setup/WiX); '' zips publish output instead
  PACKAGE_PREFIX: hazardnet-gis-workstation # artifact/archive base name
  SIGN_FILES: '*.exe,*.dll' # files matched under publish/ and package/ when signing
  SIGN_TIMESTAMP_URL: 'http://timestamp.digicert.com'
  ARTIFACT_RETENTION_DAYS: '14' # adjust to the product repository's policy

jobs:
  release-gate:
    name: Release gate (event + semver tag checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-publish: ${{ steps.gate.outputs.should-publish }}
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Decide whether this run is allowed to publish
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          should=false
          tag=''

          if [ "${EVENT_NAME}" = 'push' ] && [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            tag="${GITHUB_REF_NAME}"
            if printf '%s' "${tag}" | grep -Eq "${semver_regex}"; then
              should=true
            else
              # Non-semver tags still run validation; they simply never publish.
              echo "::warning::Tag '${tag}' is not strict semver (vMAJOR.MINOR.PATCH[-pre][+build]); running validation only."
            fi
          elif [ "${EVENT_NAME}" = 'workflow_dispatch' ] && [ "${INPUT_RELEASE}" = 'true' ]; then
            if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
              tag="${GITHUB_REF_NAME}"
            elif [ -n "${INPUT_RELEASE_TAG}" ]; then
              tag="${INPUT_RELEASE_TAG}"
            else
              echo "::error::Manual release requires a tag: dispatch this workflow with a tag selected, or provide the 'release_tag' input (e.g. v1.2.3)."
              exit 1
            fi
            if ! printf '%s' "${tag}" | grep -Eq "${semver_regex}"; then
              echo "::error::Release tag '${tag}' is not strict semver (vMAJOR.MINOR.PATCH[-pre][+build])."
              exit 1
            fi
            should=true
          fi

          version="${tag#v}"
          prerelease=false
          case "${version}" in
            *-*) prerelease=true ;;
          esac

          {
            echo "should-publish=${should}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

          echo "Event=${EVENT_NAME} publish=${should} tag=${tag:-<none>} prerelease=${prerelease}"
          if [ "${should}" != 'true' ]; then
            echo 'Validation-only run: pull requests and untagged pushes can never publish.'
          fi

  build:
    name: Restore, build, test & package (Windows)
    needs: release-gate
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Authenticode signing is enabled only when both certificate secrets
      # exist. Fork PRs see no secrets and skip signing.
      SIGNING_ENABLED: ${{ secrets.CODE_SIGNING_CERT_PFX_BASE64 != '' && secrets.CODE_SIGNING_CERT_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fail fast if the configured solution/project is missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOLUTION_OR_PROJECT -like '*REPLACE_ME*') {
            Write-Host "::error::Edit SOLUTION_OR_PROJECT in the workflow CONFIGURATION block (currently '$env:SOLUTION_OR_PROJECT')."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:SOLUTION_OR_PROJECT)) {
            Write-Host "::error::SOLUTION_OR_PROJECT '$env:SOLUTION_OR_PROJECT' does not exist in the repository."
            exit 1
          }
          if ($env:SOLUTION_OR_PROJECT -notmatch '\.(sln|csproj|vbproj|fsproj)$') {
            Write-Host "::error::SOLUTION_OR_PROJECT must point to a .sln/.csproj/.vbproj/.fsproj file (got '$env:SOLUTION_OR_PROJECT')."
            exit 1
          }
          Write-Host "Building '$env:SOLUTION_OR_PROJECT' ($env:BUILD_CONFIGURATION / $env:BUILD_PLATFORM)."

      - name: Set up .NET SDK
        if: env.DOTNET_VERSION != ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RESTORE_COMMAND) {
            Write-Host "Using custom restore command: $env:RESTORE_COMMAND"
            Invoke-Expression $env:RESTORE_COMMAND
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            msbuild $env:SOLUTION_OR_PROJECT /t:Restore "/p:Configuration=$env:BUILD_CONFIGURATION" "/p:Platform=$env:BUILD_PLATFORM"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build (MSBuild)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuildArgs = @(
            $env:SOLUTION_OR_PROJECT,
            '/m',
            "/p:Configuration=$env:BUILD_CONFIGURATION",
            "/p:Platform=$env:BUILD_PLATFORM"
          )
          if ($env:RUNTIME_IDENTIFIER) { $msbuildArgs += "/p:RuntimeIdentifier=$env:RUNTIME_IDENTIFIER" }
          if ($env:MSBUILD_EXTRA_ARGS) { $msbuildArgs += ($env:MSBUILD_EXTRA_ARGS -split '\s+') }
          msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        if: env.TEST_COMMAND != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Running: $env:TEST_COMMAND"
          Invoke-Expression $env:TEST_COMMAND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (publish output)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACKAGE_COMMAND) {
            Write-Host "Using custom package command: $env:PACKAGE_COMMAND"
            Invoke-Expression $env:PACKAGE_COMMAND
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:DOTNET_VERSION) {
            # dotnet publish mode (SDK-style projects; for full solutions a
            # PACKAGE_COMMAND override is usually cleaner).
            $publishArgs = @($env:SOLUTION_OR_PROJECT, '-c', $env:BUILD_CONFIGURATION, '-o', 'publish')
            if ($env:RUNTIME_IDENTIFIER) {
              $publishArgs += @('-r', $env:RUNTIME_IDENTIFIER, '--self-contained', $env:SELF_CONTAINED)
            }
            dotnet publish @publishArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            msbuild $env:SOLUTION_OR_PROJECT /t:Publish "/p:Configuration=$env:BUILD_CONFIGURATION" "/p:Platform=$env:BUILD_PLATFORM" "/p:PublishDir=$($PWD.Path)\publish\\"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path publish) -or -not (Get-ChildItem publish -Recurse -File)) {
            Write-Host '::error::Packaging produced no output under ./publish.'
            exit 1
          }

      - name: Build installer (optional)
        if: env.INSTALLER_SCRIPT != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:INSTALLER_SCRIPT)) {
            Write-Host "::error::INSTALLER_SCRIPT '$env:INSTALLER_SCRIPT' does not exist (expected an Inno Setup / WiX build script that writes ./package)."
            exit 1
          }
          & pwsh -NoProfile -File $env:INSTALLER_SCRIPT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip publish output (fallback when no installer script)
        if: env.INSTALLER_SCRIPT == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $label = $env:RUNTIME_IDENTIFIER
          if (-not $label) { $label = 'win' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Compress-Archive -Path 'publish/*' -DestinationPath "package/$env:PACKAGE_PREFIX-$label.zip"
          Write-Host "Created package/$env:PACKAGE_PREFIX-$label.zip"

      - name: Sign binaries/installer (only when certificate secrets exist)
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CODE_SIGNING_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Host '::error::signtool.exe not found (Windows SDK expected on windows-latest).'
            exit 1
          }
          $patterns = $env:SIGN_FILES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $files = @()
          foreach ($pattern in $patterns) {
            $files += Get-ChildItem -Path publish, package -Recurse -Filter $pattern -File -ErrorAction SilentlyContinue
          }
          $files = $files | Sort-Object FullName -Unique
          if (-not $files -or $files.Count -eq 0) {
            Write-Host "::error::SIGN_FILES '$env:SIGN_FILES' matched no files under ./publish or ./package."
            exit 1
          }
          foreach ($file in $files) {
            & $signtool.FullName sign /fd sha256 /td sha256 /tr $env:SIGN_TIMESTAMP_URL /f $pfxPath /p $env:CERT_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Signed $($files.Count) file(s); certificate bytes and password were never printed."

      - name: Verify package output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem package -Recurse -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Host '::error::No installer/package files found under ./package. Installer scripts must write their output there.'
            exit 1
          }
          Write-Host "Package contents ($($files.Count) files):"
          $files | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Upload installer/package artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: package/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  github-release:
    name: Attach installer/package to GitHub Release
    needs: [release-gate, build]
    if: needs.release-gate.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create this environment in the product repository (optionally with
    # required reviewers) so releases can be approved/protected.
    environment: release
    permissions:
      contents: write # required to create the GitHub Release and upload assets
    steps:
      - name: Download staged installer/package artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: windows-package*
          merge-multiple: true
          path: release-assets

      - name: Fail fast when no release assets were produced
        working-directory: release-assets
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "${count}" -eq 0 ]; then
            echo '::error::No installer/package artifacts found; nothing to attach to the release.'
            exit 1
          fi

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-gate.outputs.tag }}
          name: ${{ needs.release-gate.outputs.tag }}
          prerelease: ${{ needs.release-gate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
