# =============================================================================
# HazardNet CI/Release workflow template - Python package
#
# This file lives in .github/workflow-templates/ inside the HazardNet
# repository and is NOT executed there: GitHub Actions only runs workflows
# stored in .github/workflows/. To adopt it, copy this file into the Python
# product repository as .github/workflows/hazardnet-python-package.yml (keep
# the file path stable: PyPI trusted publishing is registered per workflow
# path), then edit the CONFIGURATION block below.
# See .github/workflow-templates/README.md for adoption steps, secrets and
# tag conventions.
#
# CI (every pull request and push to the default branch):
#   - fail-fast check for a packaging manifest (pyproject.toml/setup.py/setup.cfg)
#   - tests across a configurable Python version matrix
#   - optional lint / type-check steps (enabled by configuring their commands)
#   - sdist + wheel built with 'python -m build' and validated with
#     'twine check --strict'
#   - dist uploaded as a CI artifact
#
# Release (gated):
#   - only on a pushed strict-semver tag (vMAJOR.MINOR.PATCH[-pre][+build])
#     or a manual dispatch with release=true targeting a tag
#   - PyPI publication via trusted publishing (OIDC) by default; API-token
#     publishing is an explicitly documented fallback (PUBLISH_MODE)
#   - dist plus SHA256SUMS also attached to a GitHub Release
#   - both run in the protected 'release' environment (create it in the
#     product repository)
# =============================================================================

name: Python Package CI & Release

on:
  push:
    branches:
      - main # <<< EDIT: default branch of the product repository
    tags:
      - 'v*' # release-gate enforces strict semver before anything publishes
  pull_request: # validation for pull requests targeting any branch
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to PyPI and create a GitHub Release from this run (a semver tag is required)'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Tag to publish (e.g. v1.2.3); required only when dispatching from a branch instead of a tag'
        required: false
        type: string
        default: ''

# Least privilege by default; publishing jobs escalate id-token (OIDC) and
# contents (GitHub Releases) explicitly.
permissions:
  contents: read

concurrency:
  # One lane per event type + ref, so validation runs cancel stale peers but
  # release runs (tag push or manual dispatch) are never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

env:
  # ---------------------------------------------------------------------------
  # CONFIGURATION - edit these defaults after copying into the product repo.
  # Every value is a plain string; an empty string disables the related step.
  # ---------------------------------------------------------------------------
  # Supported Python versions for the test matrix (edit the matrix itself in
  # the 'test' job below).
  PACKAGE_MANIFEST: pyproject.toml # used for pip caching + manifest guard
  INSTALL_COMMAND: '' # overrides the default editable install, e.g. 'pip install -e ".[dev,test]"'
  LINT_COMMAND: '' # e.g. 'ruff check .'; '' skips lint
  TYPECHECK_COMMAND: '' # e.g. 'mypy .'; '' skips type checking
  TEST_COMMAND: pytest
  BUILD_PYTHON_VERSION: '3.12' # Python used for the packaging job
  BUILD_COMMAND: python -m build # builds sdist + wheel into ./dist
  PUBLISH_MODE: trusted-publishing # 'trusted-publishing' (OIDC, default) or 'api-token'
  PUBLISH_REPOSITORY_URL: 'https://upload.pypi.org/legacy/' # use TestPyPI URL here for staging
  ARTIFACT_RETENTION_DAYS: '14' # adjust to the product repository's policy

jobs:
  release-gate:
    name: Release gate (event + semver tag checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-publish: ${{ steps.gate.outputs.should-publish }}
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Decide whether this run is allowed to publish
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          should=false
          tag=''

          if [ "${EVENT_NAME}" = 'push' ] && [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            tag="${GITHUB_REF_NAME}"
            if printf '%s' "${tag}" | grep -Eq "${semver_regex}"; then
              should=true
            else
              # Non-semver tags still run validation; they simply never publish.
              echo "::warning::Tag '${tag}' is not strict semver (vMAJOR.MINOR.PATCH[-pre][+build]); running validation only."
            fi
          elif [ "${EVENT_NAME}" = 'workflow_dispatch' ] && [ "${INPUT_RELEASE}" = 'true' ]; then
            if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
              tag="${GITHUB_REF_NAME}"
            elif [ -n "${INPUT_RELEASE_TAG}" ]; then
              tag="${INPUT_RELEASE_TAG}"
            else
              echo "::error::Manual release requires a tag: dispatch this workflow with a tag selected, or provide the 'release_tag' input (e.g. v1.2.3)."
              exit 1
            fi
            if ! printf '%s' "${tag}" | grep -Eq "${semver_regex}"; then
              echo "::error::Release tag '${tag}' is not strict semver (vMAJOR.MINOR.PATCH[-pre][+build])."
              exit 1
            fi
            should=true
          fi

          version="${tag#v}"
          prerelease=false
          case "${version}" in
            *-*) prerelease=true ;;
          esac

          {
            echo "should-publish=${should}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

          echo "Event=${EVENT_NAME} publish=${should} tag=${tag:-<none>} prerelease=${prerelease}"
          if [ "${should}" != 'true' ]; then
            echo 'Validation-only run: pull requests and untagged pushes can never publish.'
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # <<< EDIT: supported Python versions for this package
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fail fast if no packaging manifest exists
        env:
          MANIFEST: ${{ env.PACKAGE_MANIFEST }}
        run: |
          set -euo pipefail
          if [ ! -f "${MANIFEST}" ]; then
            echo "::error::${MANIFEST} not found (PACKAGE_MANIFEST). This template expects a pip-installable package (pyproject.toml/setup.py/setup.cfg)."
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ env.PACKAGE_MANIFEST }}

      - name: Install package and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -n "${INSTALL_COMMAND}" ]; then
            bash -e -o pipefail -c "${INSTALL_COMMAND}"
          else
            # Unknown extras only produce a pip warning, so a missing 'dev'
            # extra is not fatal; pytest is installed explicitly so the test
            # step fails loudly instead of with 'command not found'.
            pip install -e '.[dev]' pytest
          fi

      - name: Lint
        if: env.LINT_COMMAND != ''
        run: bash -e -o pipefail -c "${LINT_COMMAND}"

      - name: Type-check
        if: env.TYPECHECK_COMMAND != ''
        run: bash -e -o pipefail -c "${TYPECHECK_COMMAND}"

      - name: Run tests
        run: bash -e -o pipefail -c "${TEST_COMMAND}"

  build:
    name: Build sdist & wheel, validate metadata
    needs: [release-gate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.PACKAGE_MANIFEST }}

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          if [ -n "${BUILD_COMMAND}" ]; then
            bash -e -o pipefail -c "${BUILD_COMMAND}"
          else
            python -m build
          fi
          if ! ls dist/*.tar.gz >/dev/null 2>&1 && ! ls dist/*.whl >/dev/null 2>&1; then
            echo '::error::The build produced no sdist/wheel under ./dist.'
            exit 1
          fi

      - name: Validate package metadata (twine check --strict)
        run: |
          set -euo pipefail
          twine check --strict dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  publish-pypi:
    name: Publish to PyPI (gated)
    needs: [release-gate, build]
    if: needs.release-gate.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Create this environment in the product repository; register it in the
    # PyPI trusted publisher configuration for OIDC publishing.
    environment: release
    permissions:
      contents: read
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: python-dist*
          merge-multiple: true
          path: dist

      - name: Fail fast when dist is empty or versions do not match the tag
        env:
          TAG_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ ${#wheels[@]} -eq 0 ] && [ ${#sdists[@]} -eq 0 ]; then
            echo '::error::No wheel/sdist found in the python-dist artifact.'
            exit 1
          fi
          if [ ${#wheels[@]} -gt 0 ]; then
            python3 - "${TAG_VERSION}" "${wheels[0]}" <<'PY'
          import os
          import sys

          tag_version, wheel = sys.argv[1], sys.argv[2]
          wheel_version = os.path.basename(wheel)[:-4].split('-')[1]
          if wheel_version != tag_version:
              sys.exit(f"::error::Wheel version '{wheel_version}' does not match release tag 'v{tag_version}'.")
          print(f"wheel version {wheel_version} == tag v{tag_version}")
          PY
          fi

      - name: Fail fast on unsupported PUBLISH_MODE
        if: env.PUBLISH_MODE != 'trusted-publishing' && env.PUBLISH_MODE != 'api-token'
        run: |
          echo "::error::PUBLISH_MODE must be 'trusted-publishing' or 'api-token' (got '${PUBLISH_MODE}')."
          exit 1

      - name: Fail fast when token publishing is selected without a token
        if: ${{ env.PUBLISH_MODE == 'api-token' && secrets.PYPI_API_TOKEN == '' }}
        run: |
          echo "::error::PUBLISH_MODE is 'api-token' but secret PYPI_API_TOKEN is not configured in the 'release' environment."
          exit 1

      - name: Publish to PyPI (trusted publishing / OIDC)
        if: env.PUBLISH_MODE == 'trusted-publishing'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ vars.PYPI_REPOSITORY_URL || env.PUBLISH_REPOSITORY_URL }}
          attestations: true

      - name: Publish to PyPI (API token fallback)
        if: env.PUBLISH_MODE == 'api-token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ vars.PYPI_REPOSITORY_URL || env.PUBLISH_REPOSITORY_URL }}
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  github-release:
    name: Attach sdist/wheel to GitHub Release
    needs: [release-gate, build]
    if: needs.release-gate.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # required to create the GitHub Release and upload assets
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: python-dist*
          merge-multiple: true
          path: release-assets

      - name: Fail fast when no release assets were produced
        working-directory: release-assets
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "${count}" -eq 0 ]; then
            echo '::error::No sdist/wheel artifacts found; nothing to attach to the release.'
            exit 1
          fi

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-gate.outputs.tag }}
          name: ${{ needs.release-gate.outputs.tag }}
          prerelease: ${{ needs.release-gate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
