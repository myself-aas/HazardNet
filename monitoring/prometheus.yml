# HazardNet Prometheus scrape configuration (backlog #5).
#
# Two deployment shapes exist, and both expose a /metrics endpoint:
#
#   - Node server (Express, `npm start`):  http://<host>:3001/metrics   (full metric set)
#   - Node function (`api/metrics.js`):    https://<api-host>/api/metrics
#                                          (stateless: the forecast freshness SLO only)
#
# Enable whichever target you actually run. Neither is hosted today: the public site
# is a static Cloudflare Pages deployment with no API behind it (docs/ops/deployment.md).
# The function endpoint computes the gauge live from the forecast store with a 60s-cached
# probe, so a 30s scrape interval costs at most ~2 store reads per minute.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  # Self-hosted Node server (local dev / self-host runtime).
  - job_name: hazardnet-selfhost
    static_configs:
      - targets: ['localhost:3001']

  # Node-function deployment — replace the host with your own API host and
  # uncomment, once one exists. Keep the scrape interval modest: each
  # (uncached) scrape triggers one forecast-store probe.
  # - job_name: hazardnet-function-api
  #   scheme: https
  #   metrics_path: /api/metrics
  #   static_configs:
  #     - targets: ['api.example.org']
