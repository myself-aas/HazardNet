# HazardNet alert rules (backlog #5 — forecast freshness SLO).
#
# Threshold rationale: the canonical pipeline runs WEEKLY (Sunday ~02:00 UTC,
# .github/workflows/weekly_forecast.yml). With date-granular prediction_date
# values, a healthy gauge saws between ~2h (just after a run) and ~170h (just
# before the next). The deployment guide's original 48h threshold assumed its
# own daily-run schedule and would false-fire ~5 of 7 days at weekly cadence;
# 192h (8 days) = one missed run plus ~22h of grace.

groups:
  - name: hazardnet-forecast-freshness
    rules:
      - alert: HazardNetForecastStale
        expr: hazardnet_forecast_age_hours > 192
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Forecast data is stale ({{ $value | printf \"%.0f\" }}h old)"
          description: >-
            The newest prediction_date in the forecast store is older than 8
            days — the Sunday weekly pipeline likely missed a run. Check the
            latest weekly_forecast.yml run and the ingest endpoint logs.

      - alert: HazardNetForecastDataMissing
        expr: absent(hazardnet_forecast_age_hours)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Forecast age gauge is absent"
          description: >-
            No forecast-age samples for 30m. Either nothing has ever been
            ingested, the forecast store is unreadable (the gauge is reset on
            lookup failure), or the /metrics target is down. Note: a Vercel
            deployment only emits this series via /api/metrics — scrape it too.
