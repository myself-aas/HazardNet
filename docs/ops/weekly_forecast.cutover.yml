name: Weekly Forecast Pipeline & Patch Release

on:
  schedule:
    # Runs every Sunday at 02:00 UTC (i.e., 10:00 local Bangladesh time)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Manual trigger for debugging

concurrency:
  group: weekly-forecast
  cancel-in-progress: false # Prevent cancellation mid-release/version bump

env:
  # Injected as GitHub Secrets
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
  # The ingest endpoint authenticates with the fail-closed BACKEND_API_KEY
  # (backend/utils/apiKeyAuth.js — timing-safe Bearer compare; 503 when the
  # key is unset). The previous SUPABASE_SERVICE_ROLE_KEY header was never
  # accepted by this route. Configure a matching secret in repo settings.
  BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
  # Optional: enables Gemini advisory generation during ingest. Without it the
  # advisory agent falls back to deterministic canned text (by design).
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ADR 0002 cutover (no-op until activated): the forecast store defaults to
  # Firestore. To flip the weekly pipeline's write target to Supabase, set
  # the SUPABASE_DB_URL secret (Postgres connection string) and the
  # FORECAST_STORE repository variable to 'supabase' — no workflow edit
  # needed. Apply scripts/db/002_forecasts_supabase.sql and run the
  # migration script first (see docs/adr/0002-forecast-consolidation.md).
  FORECAST_STORE: ${{ vars.FORECAST_STORE || 'firestore' }}
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_SSL: 'true'

  # Paths
  # The notebook lives at kaggle_notebooks/hazardnet-auto-forecast-pipeline/
  # (contains kernel-metadata.json with kernel id
  # ashifahmedshuvo/hazardnet-auto-forecast-pipeline).
  NOTEBOOK_DIR: ./kaggle_notebooks/hazardnet-auto-forecast-pipeline
  CSV_PATH: ./data/weekly_forecast.csv
  # The backend listens on process.env.PORT (default 3000) — pin it here so
  # the health checks and ingest calls below hit the right port.
  PORT: '3001'

jobs:
  weekly-patch-and-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for version bumping, tagging, and releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git tagging and pushing history

      # Bun version must match the bun.lock lockfile version (v1, written by
      # Bun 1.3.x) — same pin as ci.yml. Bun 1.4+ would upgrade it to v2,
      # which Vercel's Bun cannot parse.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # =======================================================================
      # 0. PREFLIGHT — fail fast on missing configuration
      # =======================================================================
      - name: Preflight — verify required secrets
        run: |
          missing=0
          for var in KAGGLE_USERNAME KAGGLE_KEY BACKEND_API_KEY; do
            if [ -z "${!var}" ]; then
              echo "❌ '$var' is not configured (repo → Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY unset — ingest advisories will use the deterministic fallback text."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ Required secrets present."

      # =======================================================================
      # 1. AUTOMATED WEEKLY PATCH VERSIONING
      # =======================================================================
      - name: Bump Weekly Patch Version
        id: version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Bump patch version in package.json (e.g., 1.0.0 -> 1.0.1)
          npm version patch --no-git-tag-version

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Commit and tag the new version. NOTE: this repo has no
          # package-lock.json (bun.lock is the lockfile) — only package.json
          # changes, so only package.json is staged.
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "Automated weekly release v$NEW_VERSION"
          git push origin HEAD:main --tags
          echo "✅ Successfully bumped and tagged version v$NEW_VERSION"

      - name: Install dependencies
        run: |
          # Mirrors ci.yml: bun.lock (v1) is the lockfile — there is no
          # package-lock.json and no backend/package.json (single root
          # manifest + frontend workspace), so install once at the root.
          bun install --frozen-lockfile
          pip install kaggle

      # =======================================================================
      # 2. KAGGLE NOTEBOOK EXECUTION
      # =======================================================================
      - name: Configure Kaggle CLI
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ env.KAGGLE_USERNAME }}","key":"${{ env.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Trigger Kaggle Notebook
        run: |
          cd ${{ env.NOTEBOOK_DIR }}
          # Pushes the notebook and automatically triggers a run if 'enable_gpu' or schedule is set in metadata
          kaggle kernels push -p .

          # Extract the kernel slug (e.g., "username/kernel-name") from metadata
          KERNEL_SLUG=$(jq -r '.id' kernel-metadata.json)
          if [ -z "$KERNEL_SLUG" ] || [ "$KERNEL_SLUG" = "null" ]; then
            echo "❌ Could not read kernel id from kernel-metadata.json"
            exit 1
          fi
          echo "KERNEL_SLUG=$KERNEL_SLUG" >> $GITHUB_ENV
          echo "✅ Triggered Kaggle kernel: $KERNEL_SLUG"

      - name: Wait for Kaggle Notebook to Complete
        env:
          MAX_RETRIES: '90' # 90 minutes — the 64-district run can take 60-90 min
        run: |
          echo "⏳ Polling Kaggle kernel status (max $MAX_RETRIES minutes)..."
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # The CLI can fail transiently right after a push (kernel version
            # not yet registered) — treat CLI-level failures as retryable.
            if STATUS_OUTPUT=$(kaggle kernels status "$KERNEL_SLUG" 2>&1); then
              echo "[$((RETRY_COUNT + 1))/$MAX_RETRIES] $STATUS_OUTPUT"
              # Substring matching (same approach as the deployment guide's
              # reference script) — the CLI's exact output format varies.
              if echo "$STATUS_OUTPUT" | grep -qi 'complete'; then
                echo "✅ Notebook execution completed successfully!"
                exit 0
              elif echo "$STATUS_OUTPUT" | grep -qiE 'error|cancel'; then
                echo "❌ Notebook execution failed!"
                mkdir -p ./kaggle_logs
                kaggle kernels output "$KERNEL_SLUG" -p ./kaggle_logs || true
                cat ./kaggle_logs/* || true
                exit 1
              fi
            else
              echo "[$((RETRY_COUNT + 1))/$MAX_RETRIES] Transient status check failure (retrying): $STATUS_OUTPUT"
            fi

            sleep 60
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "❌ Timeout waiting for Kaggle notebook to complete."
          exit 1

      - name: Download Forecast Data from Kaggle
        run: |
          mkdir -p data
          kaggle kernels output "$KERNEL_SLUG" -p data

          # Prefer the notebook's canonical output name; fall back to any CSV.
          CSV_FILE=$(ls data/hazardnet_forecasts_latest.csv 2>/dev/null || find data -name '*.csv' | head -n 1)
          if [ -z "$CSV_FILE" ]; then
            echo "❌ No CSV file found in Kaggle output:"
            ls -la data
            exit 1
          fi

          mv "$CSV_FILE" ${{ env.CSV_PATH }}
          echo "✅ Downloaded forecast CSV ($(wc -l < ${{ env.CSV_PATH }}) lines) -> ${{ env.CSV_PATH }}"

          # Optional artifacts (phases 8b/8d, ADR 0006 — the notebook computes
          # them fail-soft, so they may legitimately be absent): OSM exposure
          # overlay, the ADM3 location matrix, and the hazard+exposure GeoJSON.
          # Collected into a multiline RELEASE_FILES env for the release step.
          RELEASE_FILES="${{ env.CSV_PATH }}"
          for f in hazardnet_adm3_exposure.csv hazardnet_adm3_locations.csv hazardnet_adm3_latest.geojson; do
            if [ -f "data/$f" ]; then
              RELEASE_FILES="$RELEASE_FILES
          ./data/$f"
              echo "✅ Optional artifact present: $f"
            else
              echo "ℹ️ Optional artifact absent (notebook step is fail-soft): $f"
            fi
          done
          {
            echo "RELEASE_FILES<<ARTIFACT_EOF"
            echo "$RELEASE_FILES"
            echo "ARTIFACT_EOF"
          } >> "$GITHUB_ENV"

      # =======================================================================
      # 3. BACKEND INGESTION & TESTING
      # =======================================================================
      - name: Start backend server
        run: |
          # Single root manifest — the server is started from the repo root
          # (there is no backend/package.json, so the old
          # `cd backend && npm run start` could never work). PORT comes from
          # the workflow env so all later steps agree on the port.
          node backend/server.js > backend-server.log 2>&1 &
          echo $! > backend-server.pid
          disown

          # Wait for /health — proves Express is actually serving, not just
          # that a TCP socket is open.
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${{ env.PORT }}/health" > /dev/null; then
              echo "✅ Backend is healthy:"
              curl -s "http://localhost:${{ env.PORT }}/health"
              exit 0
            fi
            sleep 2
          done

          echo "❌ Backend failed to become healthy. Server log:"
          cat backend-server.log
          exit 1

      - name: Ingest CSV and generate advisories
        run: |
          # The route is POST /api/v1/forecasts/update (mounted in
          # backend/server.js) with the timing-safe BACKEND_API_KEY bearer
          # check. NOTE: no manual Content-Type header — curl must generate
          # the multipart boundary itself or multer cannot parse the body.
          HTTP_CODE=$(curl -sS -X POST "http://localhost:${{ env.PORT }}/api/v1/forecasts/update" \
            -H "Authorization: Bearer $BACKEND_API_KEY" \
            -F "file=@${{ env.CSV_PATH }}" \
            -o ingest_response.json \
            -w "%{http_code}")

          echo "📥 Ingest responded HTTP $HTTP_CODE:"
          cat ingest_response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Ingestion failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Verify that the response indicates success
          if ! jq -e '.status == "success"' ingest_response.json > /dev/null; then
            echo "❌ Ingestion response did not report success"
            exit 1
          fi

          echo "✅ Ingested $(jq -r '.records_updated' ingest_response.json) records \
            (skipped $(jq -r '.records_skipped' ingest_response.json)) \
            for prediction_date $(jq -r '.prediction_date' ingest_response.json)"

      - name: Run test suite
        run: |
          # No backend/package.json — the root manifest runs the whole suite
          # (same command as ci.yml).
          npx jest --ci

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend-server.pid ]; then
            kill "$(cat backend-server.pid)" 2>/dev/null || true
          fi
          pkill -f "backend/server\.js" 2>/dev/null || true

      # =======================================================================
      # 4. RELEASE & ARTIFACTS
      # =======================================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: Weekly Forecast Release v${{ steps.version.outputs.new_version }}
          body: |
            🤖 **Automated Weekly Forecast Pipeline Execution**

            - ✅ Kaggle notebook executed successfully.
            - ✅ New forecast data ingested into the Firestore forecast store via `POST /api/v1/forecasts/update`.
            - ✅ Advisories generated per ingested row.
            - 🧪 Test suite passed (`npx jest --ci`).
            - 🔗 Datasets attached below (forecasts CSV; when present also the ADM3 location matrix, the OSM exposure overlay, and the ADM3 hazard+exposure GeoJSON — ADR 0006).
          files: |
            ${{ env.RELEASE_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-forecast-diagnostics
          path: |
            backend-server.log
            ingest_response.json
            kaggle_logs/
            data/
          if-no-files-found: ignore
