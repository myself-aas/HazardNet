<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HazardNet</title>
  <meta name="description" content="AI-powered Geospatial Multi-Hazard Intelligence & Early Warning System for Bangladesh with offline map tile caching and Ultra-HD map report export." />
  <meta property="og:title" content="HazardNet" />
  <meta property="og:description" content="AI-powered Geospatial Multi-Hazard Intelligence & Early Warning System for Bangladesh with offline map tile caching and Ultra-HD map report export." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.hazardnet.live/hazardnet-logo.svg" />
  <!-- Machine-readable product facts (source: Models/VERSION.json). Kept in
       the shell so non-prerendered routes still carry it. -->
  <meta name="application-name" content="HazardNet" />
  <meta name="generator" content="Vite + React" />
  <!-- Shell fallback only: the SPA rewrite serves this document for unknown
       paths, so the default is noindex. prerender.mjs strips this tag and
       writes the correct per-route robots directive for every prerendered
       page (see frontend/scripts/prerender.mjs). -->
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" href="/hazardnet-logo.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HazardNet" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- All fonts are self-hosted via @fontsource-variable (see src/index.css):
       Noto Sans Variable, Playfair Display Variable, JetBrains Mono.
       No render-blocking third-party font requests; works fully offline. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
