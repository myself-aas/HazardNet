<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HazardNet</title>
  <meta name="description" content="AI-powered Geospatial Multi-Hazard Intelligence & Early Warning System for Bangladesh with real-time gemini-3.8-live voice conversation, RAG institutional protocols, and Google Search & Maps Grounding." />
  <meta property="og:title" content="HazardNet" />
  <meta property="og:description" content="AI-powered Geospatial Multi-Hazard Intelligence & Early Warning System for Bangladesh with real-time gemini-3.8-live voice conversation, RAG institutional protocols, and Google Search & Maps Grounding." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.hazardnet.live/hazardnet-logo-primary.svg" />
  <!-- Machine-readable product facts. Kept in the shell so non-prerendered
       routes still carry them. -->
  <meta name="application-name" content="HazardNet" />
  <meta name="generator" content="Vite + React" />
  <!-- Shell fallback only: the SPA rewrite serves this document for unknown
       paths, so the default is noindex. The prerenderer strips this tag and
       writes the correct per-route robots directive for every prerendered
       page. -->
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" type="image/svg+xml" href="/hazardnet-mark.svg" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Two tints, one per scheme, because the app has two grounds. Light is Apple's
       white canvas (--ap-canvas); dark is tile 3 (--ap-tile-3), the same surface the
       dark arm of apple.css paints as --ap-bg-canvas. A single tint was always wrong
       against one of the two. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HazardNet" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Typography is same-origin/system fallback only. No third-party font request. -->
  <!--
    Theme boot. Runs before first paint, synchronously and inline, so the stored
    choice is on <html> by the time anything is drawn.

    apple.css already paints a system-dark visitor correctly without JavaScript,
    using a prefers-color-scheme query scoped to documents not already marked
    light. What that cannot do is honour an *explicit* choice that disagrees with the
    system: a visitor who picked dark on a light OS would get a white flash, and
    one who picked light on a dark OS would get a dark flash. This closes both.

    It must stay inline and un-deferred — an external or module script lands
    after the first paint, which is the flash it exists to prevent. It writes the
    same three things the runtime theme code writes, so hydration is a no-op.
  -->
  <script>
    (function () {
      try {
        var stored = window.localStorage.getItem('hazardnet.theme');
        if (stored !== 'light' && stored !== 'dark' && stored !== 'system') return;
        var resolved = stored === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : stored;
        var root = document.documentElement;
        root.setAttribute('data-theme', resolved);
        root.classList.toggle('dark', resolved === 'dark');
        root.style.colorScheme = resolved;
      } catch (e) {
        /* Private mode denies localStorage. The CSS fallback is still correct. */
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
