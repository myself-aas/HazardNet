<?xml version="1.0" encoding="UTF-8"?>
<!-- HazardNet brand mark.
     Traced with visioncortex VTracer 0.6.4 from the owner-supplied artwork.
     Transparent background: the opaque #FEFEFE plate the tracer emitted was
     removed so the mark composites onto any surface (header over the hero,
     footer, auth panels, favicon, PWA icon).
     Palette actually painted by this file: #0D0D0D bars, #D7D7D7 offset
     echoes, #970002 arrow. Every other path the tracer emitted is
     zero-area at this resolution and paints nothing; they are kept only in
     hazardnet-mark.svg so the file stays a faithful copy of the artwork. -->
<!-- Page-loading animation built from the same mark. The tracer's zero-area
     paths are omitted: they paint nothing and would only weigh the first
     request down. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Loading HazardNet</title>
  <style>
    /* The two bars breathe out of phase and the arrow surges between them: the
       mark reads as a signal being pushed forward, which is what a wait is.
       Opacity and transform only, so the animation is compositor-cheap and
       survives any background.
       Each shape sits inside its own group carrying the tracer's translate,
       because a CSS `transform` replaces the SVG transform *attribute* on the
       same element — animating the path itself would snap it back to the origin. */
    .hn-bar-l, .hn-bar-r, .hn-arrow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      will-change: opacity, transform;
    }
    .hn-bar-l  { animation: hn-bar-l 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .hn-bar-r  { animation: hn-bar-r 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .hn-arrow  { animation: hn-arrow 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes hn-bar-l { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes hn-bar-r { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes hn-arrow {
      0%, 100% { opacity: 0.55; transform: translateX(-18px) scale(0.95); }
      50%      { opacity: 1;    transform: translateX(18px) scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hn-bar-l, .hn-bar-r, .hn-arrow { animation: none; opacity: 1; transform: none; }
    }
  </style>
